name: "Get Installation Token"
description: "Get a repository-scoped GitHub App token, revoked after the caller job"
author: "Alex Hawat"
inputs:
  repos:
    description: "Comma-separated additional repository names; current repository is always included."
    required: false
  app_id:
    description: "GitHub App ID (defaults to GITHUB_APP_ID env)."
    required: false
  private_key:
    description: "GitHub App private key PEM (defaults to GITHUB_APP_PRIVATE_KEY env)."
    required: false
  installation_id:
    description: "Optional expected installation ID; a mismatch fails the action."
    required: false
outputs:
  token:
    description: "GitHub App installation token"
    value: ${{ steps.validate.outputs.token }}
runs:
  using: "composite"
  steps:
    - name: Create repository-scoped token
      id: mint
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
      with:
        app-id: ${{ inputs.app_id || env.GITHUB_APP_ID }}
        private-key: ${{ inputs.private_key || env.GITHUB_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ format('{0},{1}', github.event.repository.name, inputs.repos) }}
        permission-contents: read
        permission-actions: read
        permission-checks: write
        permission-pull-requests: write
        permission-issues: write
    - name: Validate installation before exposing token
      id: validate
      shell: bash
      env:
        EXPECTED_ID: ${{ inputs.installation_id || env.GITHUB_APP_INSTALLATION_ID }}
        ACTUAL_ID: ${{ steps.mint.outputs.installation-id }}
        APP_TOKEN: ${{ steps.mint.outputs.token }}
      run: |
        set -euo pipefail
        if [[ -n "$EXPECTED_ID" && "$EXPECTED_ID" != "$ACTUAL_ID" ]]; then
          echo '::error::GitHub App installation does not match the requested installation.'
          exit 1
        fi
        printf 'token=%s\n' "$APP_TOKEN" >> "$GITHUB_OUTPUT"
