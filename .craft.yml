# SPDX-License-Identifier: MIT
# Craft release configuration — https://getsentry.github.io/craft/
# Docker targets retag the CI/CD-built SHA tags (same digest that was scanned,
# cosign-signed, and attested) onto version tags — never rebuild. Craft has no
# pre-release handling, so `:latest` / `:analyzers` are deliberately NOT targets
# here: CI/CD promotes them from `main` only, and a release must not move them.
minVersion: '2.21.0'

github:
  owner: alexhawat
  repo: mergeCraft

versioning:
  policy: auto

changelog:
  filePath: CHANGELOG.md
  policy: auto

artifactProvider:
  name: github
  config:
    artifacts:
      CI/CD:
        - artifact-python-dist

requireNames:
  - /^mergecraft[_-]action.*\.(whl|tar\.gz)$/

preReleaseCommand: bash scripts/bump-version.sh
postReleaseCommand: bash scripts/post-release.sh

targets:
  - name: pypi
    includeNames: /^mergecraft[_-]action.*$/
  - name: github
    tagPrefix: v
  # Build-once promote: source is the immutable SHA tag from ci-cd.yml.
  - name: docker
    id: slim
    source:
      image: ghcr.io/alexhawat/mergecraft
      format: '{{{image}}}:{{{revision}}}'
    target:
      image: ghcr.io/alexhawat/mergecraft
      format: '{{{image}}}:{{{version}}}'
  - name: docker
    id: analyzers
    source:
      image: ghcr.io/alexhawat/mergecraft
      format: '{{{image}}}:analyzers-{{{revision}}}'
    target:
      image: ghcr.io/alexhawat/mergecraft
      format: '{{{image}}}:analyzers-{{{version}}}'
