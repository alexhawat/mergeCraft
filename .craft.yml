# SPDX-License-Identifier: MIT
# Craft release configuration — https://getsentry.github.io/craft/
# Docker targets retag the CI/CD-built SHA tags (same digest that was scanned,
# cosign-signed, and attested) onto version / latest tags — never rebuild.
minVersion: '2.21.0'

github:
  owner: alexhawat
  repo: mergeCraft

versioning:
  policy: auto

changelog:
  filePath: CHANGELOG.md
  policy: auto

artifactProvider:
  name: github
  config:
    artifacts:
      CI/CD:
        - artifact-python-dist

requireNames:
  - /^merge[_-]craft.*\.(whl|tar\.gz)$/

postReleaseCommand: bash scripts/post-release.sh

targets:
  - name: pypi
    includeNames: /^merge[_-]craft.*$/
  - name: github
    tagPrefix: v
  # Build-once promote: source is the immutable SHA tag from ci-cd.yml.
  - name: docker
    id: slim
    source:
      image: ghcr.io/alexhawat/mergecraft
      format: '{{{image}}}:{{{revision}}}'
    target:
      image: ghcr.io/alexhawat/mergecraft
      format: '{{{image}}}:{{{version}}}'
  - name: docker
    id: slim-latest
    source:
      image: ghcr.io/alexhawat/mergecraft
      format: '{{{image}}}:{{{revision}}}'
    target:
      image: ghcr.io/alexhawat/mergecraft
      format: '{{{image}}}:latest'
  - name: docker
    id: analyzers
    source:
      image: ghcr.io/alexhawat/mergecraft
      format: '{{{image}}}:analyzers-{{{revision}}}'
    target:
      image: ghcr.io/alexhawat/mergecraft
      format: '{{{image}}}:analyzers-{{{version}}}'
  - name: docker
    id: analyzers-latest
    source:
      image: ghcr.io/alexhawat/mergecraft
      format: '{{{image}}}:analyzers-{{{revision}}}'
    target:
      image: ghcr.io/alexhawat/mergecraft
      format: '{{{image}}}:analyzers'
