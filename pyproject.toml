[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_build.py"

[project]
name = "mergecraft-action"
version = "0.1.0a7.dev0"
description = "Standalone BYOK GitHub Action for AI-powered PR review (mergeCraft)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alex Hawat" }]
keywords = ["github-actions", "ai-coding-agent", "code-review"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "loguru==0.7.3",
    "httpx==0.28.1",
    # security/egress.py subclasses the private httpcore._backends.base.NetworkBackend,
    # so httpcore is declared directly rather than left to httpx's transitive tree.
    "httpcore==1.0.9",
    "rich==15.0.0",
    "typer==0.25.1",
    # cli/interactive.py and cli/typer_group.py import click directly; typer only
    # brings it transitively, so pin it explicitly at the locked resolution.
    "click==8.4.2",
    "pyyaml==6.0.3",
    "pydantic==2.14.3",
    # Imported by src/mergecraft/config/env/ (the typed settings layer).
    "pydantic-settings==2.16.2",
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "starlette==1.10.0",
    "jsonschema==4.26.0",
    "semver==3.1.0",
    "python-dotenv==1.2.4",
    # Transitive runtime requirement of httpx and starlette; the exact pin is policy.
    "anyio==4.16.0",
    "defusedxml==0.7.1",
    "tenacity==9.2.1",
    "pyjwt[crypto]==2.15.1",
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
    "typing-extensions==4.16.0",
    "typesafe-sdk==0.7.5",
    # CDP transport for the host-Chrome verify driver (`mergecraft.browser.cdp`).
    # Pinned to the version already locked transitively via uvicorn[standard].
    "websockets==15.0.1",
]

[project.urls]
Homepage = "https://github.com/alexhawat/mergeCraft"
Repository = "https://github.com/alexhawat/mergeCraft"
Changelog = "https://github.com/alexhawat/mergeCraft/blob/main/CHANGELOG.md"
Issues = "https://github.com/alexhawat/mergeCraft/issues"

[project.scripts]
mergecraft = "mergecraft.cli.entrypoint:main"

[project.optional-dependencies]
harbor = [
    "harbor==0.20.0; python_version >= '3.12'",
]
# Optional in-process OpenAI Agents SDK integration.
agents = [
    "openai-agents==0.24.0",
    "openai==3.46.0",
]
# W8 / D6 — `tracing` extra behind which `logfire` and `opentelemetry-*` live.
# Imports are lazy and guarded inside the sink factory; `make ci-resume` passes
# with these uninstalled (convention 5). Exact pins + `uv.lock` committed
# gate via `make lockcheck`.
tracing = [
    "logfire==5.5.0",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-semantic-conventions==0.66b2",
]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-xdist==3.8.0",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "bandit[toml]==1.9.4",
    "pip-audit==2.10.1",
    "types-PyYAML==6.0.12.20260906",
    "types-jsonschema==4.26.0.20261006",
    "pyright==1.1.414",
    "basedpyright==1.40.2",
    "pytest-cov==7.1.0",
    "pytest-randomly==5.0.0",
    "pytest-split==0.11.0",
    # Pinned to the version in analyzers/catalog/ast-grep.yaml so dev/test
    # runs exercise the same declaration-node kinds as the managed binary
    # impact.py resolves at review time.
    "ast-grep-cli==0.51.1",
    # Pinned to analyzers/catalog/vulture.yaml — repo-native dead-code scan (#427).
    "vulture==2.16",
    # Pinned to analyzers/catalog/typos.yaml — repo-native typo checker (#427).
    "typos==1.52.0",
    # BR0 / D14b — property-based tests for redaction transforms (BR1 RED suite).
    "hypothesis==6.170.14",
]

[tool.uv]
# litellm (reached only through the `harbor` extra) caps filelock below 4.0,
# which drags every Python 3.12+ environment, dev included, down to filelock
# 3.32.7: thirteen OSV advisories (CVE-2026-112907..112940) that `make security`
# rejects. 4.0 changed only `SoftReadWriteLock`; litellm uses `FileLock` and
# harbor `AsyncFileLock`, both unchanged, so lift the cap and keep 4.x
# everywhere. Drop this once litellm permits filelock 4 (1.109.0 per PyPI).
override-dependencies = ["filelock>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/mergecraft"]
# Maintainer commands and support modules run from the checkout, not the wheel.
# Corpus readers and quality metrics remain available for benchmark/live consumers.
exclude = [
    "src/mergecraft/cli/eval_cmd.py",
    "src/mergecraft/analyzers/catalog_docs.py",
    "src/mergecraft/evals/mcp_public.py",
    "src/mergecraft/evals/skill_taxonomy_gate.py",
    "src/mergecraft/utils/git_ref.py",
    "src/mergecraft/integrations/live_providers.py",
    "src/mergecraft/mcp/codegen.py",
    "src/mergecraft/evidence/shadow_compare.py",
    "src/mergecraft/evals/human_batch.py",
    "src/mergecraft/evals/skill.py",
    "src/mergecraft/agents/catalog_docs.py",
]
artifacts = [
    "src/mergecraft/skills/**/*.md",
    "src/mergecraft/policy/packs/**/*.yaml",
    "src/mergecraft/evals/cases/**/*.json",
    "src/mergecraft/evals/fixtures/**/*.json",
    "src/mergecraft/data/**/*.yaml",
    "src/mergecraft/data/**/*.tpl",
]

[tool.hatch.build.targets.wheel.force-include]
"evals/corpora/recall_pass_corpus.json" = "mergecraft/evals/fixtures/recall_pass_corpus.json"
"integrations/opencode" = "mergecraft/data/opencode"

[tool.hatch.build.targets.sdist]
include = ["/src/mergecraft", "/tests", "/README.md", "/pyproject.toml", "/scripts/hatch_build.py", "/evals/corpora/recall_pass_corpus.json", "/integrations/opencode"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = ["tests/analyzers/fixtures/repo", "tests/analyzers/fixtures/antislop"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "ASYNC",
    "PT",
    "TCH",
    "PIE",
    "T20",
    "RET",
    "RSE",
    "DTZ",
    "FLY",
    "ERA",
]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "RUF001", "TC001", "TC003"]
"scripts/**" = ["T20"]
"docker/e2e/**" = ["T20"]
# Standalone regeneration script (uv run --with fonttools==4.63.0 python docs/assets/brand/build_logo.py).
"docs/assets/brand/build_logo.py" = ["T20"]
# Catalog prompts intentionally retain upstream emoji / typography.
"src/mergecraft/modes.py" = ["RUF001", "TC003"]
"src/mergecraft/modes/**" = ["RUF001", "TC003"]
"src/mergecraft/mcp/**" = ["SIM105", "SIM102", "RUF001"]
# These MCP handlers keep synchronous checkout metadata and local artifact I/O.
"src/mergecraft/mcp/checkout.py" = ["ASYNC240"]
"src/mergecraft/mcp/commit_info.py" = ["ASYNC240"]
"src/mergecraft/mcp/git.py" = ["ASYNC240"]
"src/mergecraft/mcp/review.py" = ["ASYNC240"]
"src/mergecraft/mcp/shell.py" = ["ASYNC230", "ASYNC240"]
"src/mergecraft/mcp/upload.py" = ["ASYNC240"]
"src/mergecraft/mcp/verification.py" = ["ASYNC240"]
# Agent CLI harnesses and CI helpers use synchronous subprocess/Path I/O.
"src/mergecraft/ci/**" = ["ASYNC240", "RUF001"]
"src/mergecraft/agents/**" = ["ASYNC221", "ASYNC230", "ASYNC240", "SIM105", "SIM102", "FLY002", "RUF001"]
"src/mergecraft/cli/**" = ["T20", "ASYNC221", "ASYNC230", "ASYNC240", "TC003"]
"src/mergecraft/yes/**" = ["UP047"]
"src/mergecraft/utils/learnings.py" = ["ASYNC240"]
"src/mergecraft/utils/skills.py" = ["ASYNC240"]
"src/mergecraft/utils/git_setup.py" = ["ASYNC221", "ASYNC240"]
"src/mergecraft/utils/offline_diff.py" = ["ASYNC221", "ASYNC240", "TC003"]
"src/mergecraft/offline_review.py" = ["ASYNC221", "ASYNC230", "ASYNC240"]
"src/mergecraft/action/**" = ["T20", "ASYNC240"]
"src/mergecraft/prep/**" = ["ASYNC221", "ASYNC240", "TC003"]
"get-installation-token/**" = ["T20", "ASYNC230", "SIM112"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
mypy_path = ["src"]
packages = ["mergecraft"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mergecraft.agents_sdk.*"]
disallow_untyped_decorators = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["mergecraft.yes.*", "mergecraft.yes"]
disallow_untyped_decorators = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["mergecraft.harbor.*", "mergecraft.harbor"]
disallow_subclassing_any = false
disallow_untyped_decorators = false
warn_return_any = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
# Warnings are errors, except the known entries below. Each ignore names its source;
# remove an entry when the cause is fixed, and do not add new ones to hide a regression.
filterwarnings = [
    "error",
    # src/mergecraft/utils/retry_policy.py passes tenacity's deprecated ``initial=``.
    "ignore:The 'initial' parameter is deprecated:DeprecationWarning",
    # Legacy-provider-key notice the CLI deliberately emits; several tests exercise it.
    "ignore:LLM_PROVIDER_1_API_KEY wins over legacy:DeprecationWarning",
    # os.fork() from the egress bridge in a threaded test process (CPython 3.12+).
    "ignore:This process .* is multi-threaded, use of fork:DeprecationWarning",
    # Third-party deprecations raised while importing fastapi / hypothesis.
    "ignore::DeprecationWarning:fastapi.*",
    "ignore:Do not use the `random` module inside strategies",
    # FastAPI ``on_event`` used by tests/mcp/test_ports_identity.py to force a startup failure.
    "ignore:\\s*on_event is deprecated:DeprecationWarning",
    # Unclosed sockets/files/loops in tests are reported when the garbage collector runs,
    # so they surface in whichever test is running then. Known debt: fix the leaks, then
    # drop these two entries.
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "integration: opt-in tests that need network, credentials, or real binaries",
    "hermetic_integration: keyless integration tests selected by make test-integration",
    "live: real-provider / live-credential integration (scheduled + release precondition)",
    "coverage: branch-walking tests that inflate coverage; excluded from the default make test read",
    "network: test may reach non-loopback hosts (the autouse network guard is lifted)",
    "timeout(seconds): per-test time budget (default 180 s, 0 disables); see tests/support/hermetic.py",
]

[tool.coverage.run]
source = ["mergecraft"]
branch = true
omit = [
    "*/tests/*",
    "*/pytest-of-*/*",
    "*/scratch/*",
    "*/.ci-mergecraft-base-coverage/*",
]

[tool.coverage.report]
fail_under = 84
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests", "scripts"]
# B101: assert in tests/guards; B108: GHA uses /tmp by design;
# B604: false positive on kwargs named ``shell`` (permission field, not subprocess).
skips = ["B101", "B108", "B604"]
