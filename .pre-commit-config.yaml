# Sync hook revisions with dev tooling (see pyproject.toml optional dev deps).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: e8f7d69b957a30acb2c875078d5fd012de24b64c  # v0.16.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        # Match `make lint`'s `ruff format src tests scripts` file types. The
        # v0.16 ruff-pre-commit manifest widened ruff-format to markdown, which
        # would rewrite python code fences in frozen tracked docs.
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=1024]
        # Machine-generated pytest-split timing metadata, regenerated in full by
        # `make test-durations`; its size tracks the test count, not a stray
        # binary, so it is the one new file the size guard skips.
        exclude: ^\.test_durations$
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: mergecraft-loguru-only
        name: loguru-only (no stdlib logging imports)
        entry: uv run python scripts/check_loguru_only.py
        language: system
        pass_filenames: false
        files: ^src/mergecraft/.*\.py$

      - id: mergecraft-action-yml-hygiene
        name: action.yml hygiene (no ${{ }} in description text)
        entry: uv run python scripts/check_action_yml_hygiene.py
        language: system
        pass_filenames: false
        files: (^|/)action\.ya?ml$

      - id: mergecraft-tracked-markdown
        name: tracked markdown (no decision IDs or gitignored wave paths)
        entry: uv run python scripts/check_tracked_markdown.py
        language: system
        pass_filenames: false
        files: \.md$

      - id: conventional-commit
        name: Conventional Commits
        entry: uv run python scripts/check_conventional_commit.py
        language: system
        stages: [commit-msg]
        pass_filenames: true

      - id: mergecraft-push-authors
        name: push authors (block foreign-authored commits on push)
        entry: uv run python scripts/check_push_authors.py
        language: system
        stages: [pre-push]
        pass_filenames: false
