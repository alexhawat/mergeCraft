# Sync hook revisions with dev tooling (see pyproject.toml optional dev deps).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 9026c9127e153371d7a78dfcb0c45ae2046a3d10  # v0.17.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        # Match `make lint`'s `ruff format src tests scripts` file types. The
        # v0.16 ruff-pre-commit manifest widened ruff-format to markdown, which
        # would rewrite python code fences in frozen tracked docs.
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        # Frozen upstream excerpt: the final blank line is part of its hash.
        exclude: ^evals/fixtures/golden/golden-b002-systems-rust-tokio-timer-runtime/fixed-source\.txt$
      - id: trailing-whitespace
        # Preserve hashed upstream diff context and numbered blank source lines.
        # Attribution, JSON, licenses and all other hooks still run normally.
        exclude: >-
          (?x)^evals/fixtures/golden/golden-b002-
          (?:(?:js|python|systems)-[^/]+/[^/]+\.patch|
          js-[^/]+/(?:buggy|fixed|regression-test)-snippet\.txt|
          python-[^/]+/(?:(?:base|before-fix|fixed|introduced)-source|regression-tests)\.txt)$
      - id: check-added-large-files
        args: [--maxkb=1024]
        # Machine-generated pytest-split timing metadata, regenerated in full by
        # `make test-durations`; its size tracks the test count, not a stray
        # binary, so it is the one new file the size guard skips.
        exclude: ^\.test_durations$
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: mergecraft-loguru-only
        name: loguru-only (no stdlib logging imports)
        entry: uv run python scripts/check_loguru_only.py
        language: system
        pass_filenames: false
        files: ^src/mergecraft/.*\.py$

      - id: mergecraft-action-yml-hygiene
        name: action.yml hygiene (no ${{ }} in description text)
        entry: uv run python scripts/check_action_yml_hygiene.py
        language: system
        pass_filenames: false
        files: (^|/)action\.ya?ml$

      - id: mergecraft-tracked-markdown
        name: tracked markdown (no decision IDs or gitignored wave paths)
        entry: uv run python scripts/check_tracked_markdown.py
        language: system
        pass_filenames: false
        files: \.md$

      - id: mergecraft-test-honesty
        name: test honesty (no fixed sleeps or flake masking in tests/)
        entry: uv run python scripts/lint_test_honesty.py
        language: system
        pass_filenames: false
        files: ^tests/.*\.py$

      - id: conventional-commit
        name: Conventional Commits
        entry: uv run python scripts/check_conventional_commit.py
        language: system
        stages: [commit-msg]
        pass_filenames: true

      - id: mergecraft-push-authors
        name: push authors (block foreign-authored commits on push)
        entry: uv run python scripts/check_push_authors.py
        language: system
        stages: [pre-push]
        pass_filenames: false
