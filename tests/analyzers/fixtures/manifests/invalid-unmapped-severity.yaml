id: bad-severity-map
category: lint
languages: ["python"]
detect:
  files: ["*.py"]
command: ["ruff", "check", "{files}"]
scope: diff
parser: ruff_json
supports_fix: false
default_enabled: false
version: "0.15.12"
runtime: repo-native
timeout_s: 120
trust: trusted
severity_map:
  banana: Major
provenance: {}
network_allowlist: []
exclusive_group: python-lint
