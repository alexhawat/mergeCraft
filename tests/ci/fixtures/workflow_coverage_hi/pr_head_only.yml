# Models #432 pre-merge gap: PR coverage scores the head branch, not the merge.
name: HI PR head only (bad)

on:
  pull_request:
    branches: [main, pre-0.0.1]

jobs:
  integration-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Coverage ratchet
        run: make coverage-gate
