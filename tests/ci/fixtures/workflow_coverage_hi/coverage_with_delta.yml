# SPDX-License-Identifier: MIT
# Good: merge-ref checkout plus explicit delta-vs-base reporting.
name: HI coverage with delta report (good)

on:
  pull_request:
    branches: [main, pre-0.0.1]

jobs:
  integration-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
      - name: Coverage gate with delta vs base
        run: |
          make coverage-gate
          python scripts/check_coverage_delta.py coverage.json --base coverage-base.json
