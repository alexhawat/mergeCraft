# Shared placeholders for rendered example workflows.
# Source of truth: scripts/example_workflows/defaults.yaml — copy byte-identical
# to src/mergecraft/data/example_workflows/defaults.yaml, then make pins-check.
# Override via env when generating examples: make examples
action_repo: alexhawat/mergeCraft
# A tagged release ref is fine for the minimal getting-started example.
action_pin_minimal: v0.1.0a1
# The immutable commit the minimal Action pin above resolves to; rendered as
# `@<commit> # <tag>` so a workflow runs the same code Harbor installs by tag.
action_sha_minimal: 521c0aedbf525a80a5bf6eddf0119ada85a8d381
# One actions/checkout commit for every example, the scaffold and the self-workflow.
checkout_sha: 3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
# Hardened workflow must pin a full commit SHA for org SHA-pinning policies.
action_pin_hardened: REPLACE_WITH_FULL_COMMIT_SHA
# Prefix of YOUR CI job names (see .github/workflows/ci.yml in this repo).
ci_job_prefix: "Verify ("
# Base branches auto-reviewed under pull_request_target.
base_branches: "[main]"
