id: osv-scanner
category: vuln
languages: []
detect:
  files:
    - "requirements*.txt"
    - "*requirements*.txt"
    - "Pipfile.lock"
    - "poetry.lock"
    - "package-lock.json"
    - "yarn.lock"
    - "pnpm-lock.yaml"
    - "go.sum"
    - "Gemfile.lock"
    - "Cargo.lock"
command:
  - osv-scanner
  - scan
  - --format
  - json
  - -L
  - "{files}"
scope: diff
parser: osv_json
supports_fix: false
default_enabled: auto
version: "2.4.0"
runtime: managed
timeout_s: 180
trust: untrusted
severity_map:
  critical: Critical
  high: Major
  medium: Minor
  low: Trivial
provenance:
  linux-amd64:
    url: https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64
    sha256: "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0"
  darwin-arm64:
    url: https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_darwin_arm64
    sha256: "9ca3185ad63e9ab54f7cb90f46a7362be02d80e37f0123d095a54355ea202f5d"
network_allowlist:
  - "https://api.osv.dev"
  - "https://deps.dev"
exclusive_group: dependency-vuln
