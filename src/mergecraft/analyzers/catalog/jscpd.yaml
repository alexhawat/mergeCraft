id: jscpd
category: quality
languages:
  - javascript
  - typescript
  - python
detect:
  files:
    - "*.js"
    - "*.jsx"
    - "*.ts"
    - "*.tsx"
    - "*.py"
command:
  - jscpd
  - --reporters
  - json
  - --silent
  - .
scope: repo
parser: jscpd_json
supports_fix: false
default_enabled: auto
version: "4.1.0"
runtime: repo-native
timeout_s: 300
trust: trusted
severity_map:
  warning: Minor
provenance: {}
network_allowlist: []
exclusive_group: null
