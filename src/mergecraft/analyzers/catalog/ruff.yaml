id: ruff
category: lint
languages: ["python"]
detect:
  files:
    - "*.py"
command:
  - ruff
  - check
  - --output-format
  - json
  - --ignore-noqa
  - "{files}"
scope: diff
parser: ruff_json
supports_fix: true
default_enabled: auto
version: "0.15.12"
runtime: repo-native
timeout_s: 120
trust: trusted
severity_map:
  error: Major
  warning: Minor
provenance: {}
network_allowlist: []
exclusive_group: python-lint
