id: zizmor
category: ci
languages: []
detect:
  files:
    - ".github/workflows/*.{yml,yaml}"
    - ".github/actions/**/action.yml"
command: ["zizmor", "sarif", "{files}"]
scope: diff
parser: sarif
supports_fix: false
default_enabled: auto
version: "1.28.0"
runtime: managed
timeout_s: 120
trust: untrusted
severity_map:
  error: Major
  warning: Minor
  note: Trivial
provenance:
  linux-amd64:
    url: https://github.com/zizmorcore/zizmor/releases/download/v1.28.0/zizmor-x86_64-unknown-linux-gnu.tar.gz
    sha256: "e87b67160194884e375a46a12c57ccc904f762b53845f254fab7f17d98809c09"
network_allowlist: []
exclusive_group: github-workflow
