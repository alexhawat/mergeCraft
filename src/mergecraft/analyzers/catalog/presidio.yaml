id: presidio
category: security
languages: []
detect:
  files:
  - '*.txt'
  - '*.md'
  - '*.yaml'
  - '*.json'
command:
- presidio-analyzer
- '{files}'
scope: diff
parser: sarif
supports_fix: false
default_enabled: false
version: 2.2.355
runtime: container
timeout_s: 300
trust: trusted
severity_map:
  error: Major
  warning: Minor
  note: Trivial
provenance: {}
network_allowlist: []
exclusive_group: null
