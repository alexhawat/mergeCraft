id: brakeman
category: security
languages:
- ruby
detect:
  files:
  - '*.rb'
  - config/application.rb
  - config/routes.rb
command:
- brakeman
- -f
- sarif
- -o
- "-"
scope: repo
parser: sarif
supports_fix: false
default_enabled: auto
version: 6.4.0
runtime: repo-native
timeout_s: 300
trust: trusted
severity_map:
  error: Major
  warning: Minor
  note: Trivial
provenance: {}
network_allowlist: []
exclusive_group: null
