id: circleci
category: lint
languages:
- yaml
detect:
  files:
  - .circleci/config.yml
command:
- circleci
- config
- validate
- '{files}'
scope: diff
parser: sarif
supports_fix: false
default_enabled: false
version: 0.1.31438
runtime: managed
timeout_s: 120
trust: untrusted
severity_map:
  error: Major
  warning: Minor
  note: Trivial
provenance: {}
network_allowlist: []
exclusive_group: null
