id: pmd
category: lint
languages:
- java
detect:
  files:
  - '*.java'
  - pmd.ruleset.xml
command:
- pmd
- check
- -f
- sarif
- -d
- '{files}'
scope: diff
parser: sarif
supports_fix: false
default_enabled: auto
version: 7.9.0
runtime: managed
timeout_s: 300
trust: trusted
severity_map:
  error: Major
  warning: Minor
  note: Trivial
provenance: {}
network_allowlist: []
exclusive_group: null
