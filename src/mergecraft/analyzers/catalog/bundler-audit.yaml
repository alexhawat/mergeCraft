id: bundler-audit
category: vuln
languages:
- ruby
detect:
  files:
  - Gemfile.lock
command:
- bundle
- audit
- --format
- json
scope: repo
parser: bundler_audit_json
supports_fix: false
default_enabled: auto
version: "0.9.2"
runtime: repo-native
timeout_s: 180
trust: trusted
severity_map:
  error: Major
  warning: Minor
provenance: {}
network_allowlist:
- "https://rubysec.com"
exclusive_group: null
