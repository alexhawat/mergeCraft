id: tsc
category: lint
languages:
  - typescript
detect:
  files:
    - tsconfig.json
    - "*.ts"
    - "*.tsx"
command:
  - tsc
  - --noEmit
scope: repo
parser: sarif
supports_fix: false
default_enabled: auto
version: "5.8.3"
runtime: repo-native
timeout_s: 300
trust: trusted
severity_map:
  error: Major
  warning: Minor
  note: Trivial
provenance: {}
network_allowlist: []
exclusive_group: null
