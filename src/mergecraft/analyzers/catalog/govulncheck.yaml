id: govulncheck
category: vuln
languages:
  - go
detect:
  files:
    - go.mod
    - "*.go"
command:
  - govulncheck
  - -format
  - sarif
  - ./...
scope: repo
parser: sarif
supports_fix: false
default_enabled: auto
version: "1.1.4"
runtime: repo-native
timeout_s: 300
trust: trusted
severity_map:
  error: Major
  warning: Minor
  note: Trivial
provenance: {}
network_allowlist:
  - "https://vuln.go.dev"
exclusive_group: null
