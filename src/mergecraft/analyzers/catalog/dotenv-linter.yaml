id: dotenv-linter
category: lint
languages: []
detect:
  files:
  - .env*
  - '*.env'
command:
- dotenv-linter
- '{files}'
scope: diff
parser: sarif
supports_fix: false
default_enabled: false
version: 3.3.0
runtime: managed
timeout_s: 60
trust: trusted
severity_map:
  error: Major
  warning: Minor
  note: Trivial
provenance: {}
network_allowlist: []
exclusive_group: null
