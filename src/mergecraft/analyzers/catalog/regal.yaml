id: regal
category: lint
languages:
- rego
detect:
  files:
  - '*.rego'
command:
- regal
- lint
- --format
- sarif
- '{files}'
scope: diff
parser: sarif
supports_fix: false
default_enabled: auto
version: 0.27.0
runtime: managed
timeout_s: 120
trust: trusted
severity_map:
  error: Major
  warning: Minor
  note: Trivial
provenance: {}
network_allowlist: []
exclusive_group: null
