id: biome
category: lint
languages: ["javascript", "typescript"]
detect:
  files:
    - "*.js"
    - "*.jsx"
    - "*.ts"
    - "*.tsx"
    - "*.mjs"
    - "*.cjs"
command:
  - biome
  - lint
  - --reporter=json
  - "{files}"
scope: diff
parser: eslint_json
supports_fix: false
default_enabled: auto
version: "1.9.0"
runtime: repo-native
timeout_s: 180
trust: trusted
severity_map:
  error: Major
  warning: Minor
provenance: {}
network_allowlist: []
exclusive_group: js-lint
