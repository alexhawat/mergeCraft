id: golangci-lint
category: lint
languages:
- go
detect:
  files:
  - '*.go'
  - go.mod
  lint_files:
  - '*.go'
command:
- golangci-lint
- run
- --out-format
- sarif
- '{files}'
scope: diff
parser: sarif
supports_fix: false
default_enabled: auto
version: 1.62.2
runtime: managed
timeout_s: 300
trust: trusted
severity_map:
  error: Major
  warning: Minor
  note: Trivial
provenance: {}
network_allowlist: []
exclusive_group: go-lint
