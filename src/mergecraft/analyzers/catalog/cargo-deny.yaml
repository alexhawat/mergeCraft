id: cargo-deny
category: license
languages:
  - rust
detect:
  files:
    - Cargo.toml
    - Cargo.lock
    - deny.toml
command:
  - cargo
  - deny
  - check
scope: repo
parser: sarif
supports_fix: false
default_enabled: auto
version: "0.16.4"
runtime: repo-native
timeout_s: 180
trust: trusted
severity_map:
  error: Major
  warning: Minor
  note: Trivial
provenance: {}
network_allowlist: []
exclusive_group: null
