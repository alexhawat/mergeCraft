id: shellcheck
category: lint
languages: ["shell"]
detect:
  files:
    - "*.sh"
    - "*.bash"
command: ["shellcheck", "-f", "json", "{files}"]
scope: diff
parser: shellcheck_json
supports_fix: false
default_enabled: auto
version: "0.10.0"
runtime: managed
timeout_s: 120
trust: untrusted
severity_map:
  error: Major
  warning: Minor
  info: Trivial
  style: Trivial
provenance:
  linux-amd64:
    url: https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
    sha256: "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87"
network_allowlist: []
exclusive_group: null
