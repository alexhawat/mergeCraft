id: cppcheck
category: lint
languages:
- c
- cpp
detect:
  files:
  - '*.c'
  - '*.cpp'
  - '*.h'
  - '*.hpp'
command:
- cppcheck
- --output-format=sarif
- '{files}'
scope: diff
parser: sarif
supports_fix: false
default_enabled: auto
version: 2.16.0
runtime: managed
timeout_s: 300
trust: trusted
severity_map:
  error: Major
  warning: Minor
  note: Trivial
provenance: {}
network_allowlist: []
exclusive_group: null
