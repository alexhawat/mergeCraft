id: checkmake
category: lint
languages:
- make
detect:
  files:
  - Makefile
  - makefile
  - '*.mk'
command:
- checkmake
- --format
- '{{.FileName}}:{{.LineNumber}}:{{.Rule}}:{{.Violation}}'
- '{files}'
scope: diff
parser: checkmake_text
supports_fix: false
default_enabled: auto
version: 0.2.2
runtime: managed
timeout_s: 60
trust: trusted
severity_map:
  warning: Minor
provenance: {}
network_allowlist: []
exclusive_group: null
