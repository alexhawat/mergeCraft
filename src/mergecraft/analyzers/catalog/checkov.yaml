id: checkov
category: security
languages:
- terraform
- cloudformation
detect:
  files:
  - '*.tf'
  - '*.yaml'
  - '*.yml'
  - serverless.yml
command:
- checkov
- -f
- '{files}'
- -o
- sarif
scope: diff
parser: sarif
supports_fix: false
default_enabled: auto
version: 3.2.366
runtime: managed
timeout_s: 300
trust: untrusted
severity_map:
  error: Major
  warning: Minor
  note: Trivial
provenance: {}
network_allowlist: []
exclusive_group: null
declared_unavailable: manifest-only — checkov binary not bundled for linux-amd64
  (provisioning gap; use repo-native install or wait for pinned provenance)
