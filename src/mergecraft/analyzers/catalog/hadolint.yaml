id: hadolint
category: lint
languages: ["docker"]
detect:
  files:
    - "Dockerfile"
    - "Dockerfile.*"
    - "*.dockerfile"
command: ["hadolint", "-f", "sarif", "{files}"]
scope: diff
parser: sarif
supports_fix: false
default_enabled: auto
version: "2.15.1"
runtime: managed
timeout_s: 120
trust: untrusted
severity_map:
  error: Major
  warning: Minor
  note: Trivial
provenance:
  linux-amd64:
    url: https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
    sha256: "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"
network_allowlist: []
exclusive_group: null
