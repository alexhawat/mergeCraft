id: prisma-lint
category: lint
languages:
- prisma
detect:
  files:
  - '*.prisma'
command:
- prisma-lint
- --output-format
- json
- '{files}'
scope: diff
parser: prisma_lint_json
supports_fix: false
default_enabled: auto
version: 0.10.1
runtime: repo-native
timeout_s: 120
trust: trusted
severity_map:
  error: Major
provenance: {}
network_allowlist: []
exclusive_group: null
