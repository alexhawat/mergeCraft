id: prisma-lint
category: lint
languages:
- prisma
detect:
  files:
  - '*.prisma'
command:
- prisma-lint
- '{files}'
scope: diff
parser: sarif
supports_fix: false
default_enabled: auto
version: 0.10.1
runtime: repo-native
timeout_s: 120
trust: trusted
severity_map:
  error: Major
  warning: Minor
  note: Trivial
provenance: {}
network_allowlist: []
exclusive_group: null
