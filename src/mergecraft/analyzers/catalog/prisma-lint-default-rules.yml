# prisma-lint conservative default fallback ruleset (shipped with mergeCraft)
# Applied when no repo-level prisma-lint config is found.
# Enables a small, safe subset: naming conventions (idiomatic Prisma) and
# one footgun guard (required ignored fields have surprising side-effects).
rules:
  model-name-pascal-case: error
  field-name-camel-case: error
  enum-name-pascal-case: error
  forbid-required-ignored-field: error
