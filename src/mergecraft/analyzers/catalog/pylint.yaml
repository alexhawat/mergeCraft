id: pylint
category: lint
languages:
- python
detect:
  files:
  - '*.py'
command:
- pylint
- '{files}'
scope: diff
parser: sarif
supports_fix: false
default_enabled: false
version: 3.3.0
runtime: managed
timeout_s: 120
trust: trusted
severity_map:
  error: Major
  warning: Minor
  note: Trivial
provenance: {}
network_allowlist: []
exclusive_group: python-lint
