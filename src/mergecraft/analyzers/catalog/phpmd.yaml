id: phpmd
category: lint
languages:
- php
detect:
  files:
  - '*.php'
command:
- phpmd
- '{files}'
- sarif
- cleancode,codesize,design,naming,unusedcode
scope: diff
parser: sarif
supports_fix: false
default_enabled: false
version: 2.15.0
runtime: repo-native
timeout_s: 180
trust: trusted
severity_map:
  error: Major
  warning: Minor
  note: Trivial
provenance: {}
network_allowlist: []
exclusive_group: null
