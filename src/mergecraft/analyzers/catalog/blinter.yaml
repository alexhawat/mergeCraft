id: blinter
category: lint
languages:
- batch
detect:
  files:
  - '*.bat'
  - '*.cmd'
command:
- blinter
- '{files}'
scope: diff
parser: sarif
supports_fix: false
default_enabled: auto
version: 1.0.0
runtime: managed
timeout_s: 60
trust: trusted
severity_map:
  error: Major
  warning: Minor
  note: Trivial
provenance: {}
network_allowlist: []
exclusive_group: null
declared_unavailable: requires non-Linux runner — Windows batch lint not supported
  on Linux (C6)
