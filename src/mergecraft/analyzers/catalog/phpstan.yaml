id: phpstan
category: lint
languages:
- php
detect:
  files:
  - '*.php'
  - phpstan.neon
  - phpstan.neon.dist
  - composer.json
command:
- phpstan
- analyse
- --error-format=sarif
- '{files}'
scope: diff
parser: sarif
supports_fix: false
default_enabled: auto
version: 2.1.2
runtime: repo-native
timeout_s: 300
trust: trusted
severity_map:
  error: Major
  warning: Minor
  note: Trivial
provenance: {}
network_allowlist: []
exclusive_group: null
