id: mypy
category: lint
languages: ["python"]
detect:
  files:
    - "*.py"
command:
  - mypy
  - --show-error-codes
  - --no-error-summary
  - --no-color-output
  - -O
  - json
  - "{files}"
scope: diff
parser: mypy_json
supports_fix: false
default_enabled: auto
version: "1.20.2"
runtime: repo-native
timeout_s: 300
trust: trusted
severity_map:
  error: Major
  warning: Minor
  note: Trivial
provenance: {}
network_allowlist: []
exclusive_group: python-typecheck
