id: shopify-theme-check
category: lint
languages:
- liquid
detect:
  files:
  - '*.liquid'
  - .theme-check.yml
command:
- theme-check
- '{files}'
scope: diff
parser: sarif
supports_fix: false
default_enabled: auto
version: 1.15.0
runtime: repo-native
timeout_s: 120
trust: trusted
severity_map:
  error: Major
  warning: Minor
  note: Trivial
provenance: {}
network_allowlist: []
exclusive_group: null
declared_unavailable: manifest-only — Shopify Theme Check not bundled on Linux runners
  (C6 out of scope)
