id: htmlhint
category: lint
languages:
- html
detect:
  files:
  - '*.html'
  - .htmlhintrc
command:
- htmlhint
- --format
- json
- '{files}'
scope: diff
parser: htmlhint_json
supports_fix: false
default_enabled: auto
version: 1.1.4
runtime: repo-native
timeout_s: 60
trust: trusted
severity_map:
  error: Major
  warning: Minor
provenance: {}
network_allowlist: []
exclusive_group: null
