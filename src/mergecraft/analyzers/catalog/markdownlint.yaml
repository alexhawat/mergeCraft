id: markdownlint
category: lint
languages:
- markdown
detect:
  files:
  - '*.md'
  - .markdownlint.json
  - .markdownlint.yaml
command:
- markdownlint
- '{files}'
scope: diff
parser: sarif
supports_fix: false
default_enabled: false
version: 0.37.4
runtime: repo-native
timeout_s: 60
trust: trusted
severity_map:
  error: Major
  warning: Minor
  note: Trivial
provenance: {}
network_allowlist: []
exclusive_group: null
