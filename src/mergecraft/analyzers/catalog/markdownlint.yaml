id: markdownlint
category: lint
languages:
- markdown
detect:
  files:
  - '*.md'
  - .markdownlint.json
  - .markdownlint.yaml
command:
- markdownlint
- --json
- '{files}'
scope: diff
parser: markdownlint_json
supports_fix: false
default_enabled: auto
version: 0.37.4
runtime: repo-native
timeout_s: 60
trust: trusted
severity_map:
  error: Major
provenance: {}
network_allowlist: []
exclusive_group: null
