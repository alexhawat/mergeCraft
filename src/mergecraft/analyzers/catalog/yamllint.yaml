id: yamllint
category: lint
languages:
- yaml
detect:
  files:
  - '*.yaml'
  - '*.yml'
  - .yamllint
command:
- yamllint
- -f
- parsable
- '{files}'
scope: diff
parser: yamllint_parsable
supports_fix: false
default_enabled: auto
version: 1.35.1
runtime: managed
timeout_s: 120
trust: untrusted
severity_map:
  error: Major
  warning: Minor
provenance: {}
network_allowlist: []
exclusive_group: null
