id: detekt
category: lint
languages:
- kotlin
detect:
  files:
  - '*.kt'
  - '*.kts'
  - detekt.yml
command:
- detekt
- --input
- '{files}'
- --report
- sarif:/dev/stdout
scope: diff
parser: sarif
supports_fix: false
default_enabled: auto
version: 1.23.7
runtime: repo-native
timeout_s: 300
trust: trusted
severity_map:
  error: Major
  warning: Minor
  note: Trivial
provenance: {}
network_allowlist: []
exclusive_group: null
