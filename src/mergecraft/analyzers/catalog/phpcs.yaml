id: phpcs
category: lint
languages:
- php
detect:
  files:
  - '*.php'
  - phpcs.xml
  - phpcs.xml.dist
command:
- phpcs
- --report=json
- '{files}'
scope: diff
parser: sarif
supports_fix: false
default_enabled: false
version: 3.11.2
runtime: repo-native
timeout_s: 180
trust: trusted
severity_map:
  error: Major
  warning: Minor
  note: Trivial
provenance: {}
network_allowlist: []
exclusive_group: php-lint
