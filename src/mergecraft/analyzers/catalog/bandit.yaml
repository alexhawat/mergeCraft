id: bandit
category: security
languages:
  - python
detect:
  files:
    - "*.py"
command:
  - bandit
  - -r
  - --format
  - sarif
  - "{files}"
scope: diff
parser: sarif
supports_fix: false
default_enabled: auto
version: "1.9.4"
runtime: repo-native
timeout_s: 120
trust: trusted
severity_map:
  error: Major
  warning: Minor
  note: Trivial
provenance: {}
network_allowlist: []
exclusive_group: null
