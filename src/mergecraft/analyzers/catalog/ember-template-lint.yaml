id: ember-template-lint
category: lint
languages:
- ember
detect:
  files:
  - '*.hbs'
  - .template-lintrc.js
command:
- ember-template-lint
- --format
- json
- '{files}'
scope: diff
parser: ember_template_lint_json
supports_fix: true
default_enabled: auto
version: 6.0.0
runtime: repo-native
timeout_s: 120
trust: trusted
severity_map:
  error: Major
  warning: Minor
provenance: {}
network_allowlist: []
exclusive_group: null
