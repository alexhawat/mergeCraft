id: luacheck
category: lint
languages:
- lua
detect:
  files:
  - '*.lua'
  - .luacheckrc
command:
- luacheck
- --formatter
- plain
- '{files}'
scope: diff
parser: luacheck_text
supports_fix: false
default_enabled: auto
version: 1.2.0
runtime: repo-native
timeout_s: 60
trust: trusted
severity_map:
  error: Major
  warning: Minor
provenance: {}
network_allowlist: []
exclusive_group: null
