# mergeCraft repo-config for this repo's own self-review consumer workflow
# (.github/workflows/mergecraft.yml). See docs/REVIEW-DOCTRINE.md.
#
# prApproveEnabled alone does not let self-review submit a real GitHub APPROVE
# (D14, PR #200): create_pull_request_review_tool also requires the agent's own
# approved=true AND ctx.trust_tier == "trusted", which derive_trust_tier()
# (src/mergecraft/analyzers/trust.py) only grants to a genuine non-fork
# `pull_request` event or workflow_dispatch — never to pull_request_target,
# regardless of fork status. mergecraft.yml deliberately stays on
# pull_request_target only (see PR #200); the PAT-backed APPROVE lane lives in
# mergecraft-approve.yml.
#
# recallPass dogfood resumes after this PR merges to pre-0.0.1: pull_request_target
# runs the workflow + action pin from the base branch, so self-review PRs cannot
# enable review.recallPass until the schema lands on base.
prApproveEnabled: true

# Per-run token band (D9): tokenBudget is the soft *target*; tokenBudgetTolerance
# (default 0.10 in schema, omitted here) defines the hard *ceiling* as
# target × (1 + tolerance). Crossing the target warns once and the run may
# continue; crossing the ceiling raises BudgetExhausted. Set tolerance 0 to
# restore the pre-band cliff (fail exactly at target).
#
# Dogfood self-review on this sweep PR exhausted the 2M default
# (Codex: 2_196_957 tokens). Raised again after lane-A integration reviews
# reported ~4.25M input tokens on large PRs while the 3M cap still failed
# closed after a completed terminal verdict.
runBounds:
  tokenBudget: 5000000
  # tokenBudgetTolerance: 0.10

# CI SARIF as review evidence (#464 / D8, lane D W5 / #600). Artifact names
# must match the uploads in .github/workflows/ci.yml — not mergecraft.yml.
# trufflehog is omitted: JSONL-only parser, no SARIF emitter on this surface (D12).
ciEvidence:
  sarifArtifacts:
    - ruff-sarif
    - mypy-sarif
    - bandit-sarif
    - actionlint-sarif
    - zizmor-sarif
    - semgrep-sarif

# Operator trust knobs for same-repo pull_request_target (plan 13 D14–D16).
# Resolved from the BASE snapshot at run start — a PR-head edit cannot raise
# its own tier. Default when absent: off (today's untrusted posture).
#
# selfReview levels:
#   off       — no change from pre-knob behaviour
#   analyzers — trusted-tier analyzers on same-repo PRs; agent still cannot APPROVE
#   full      — authority trust too; requires mergecraft trust set-self-review full
#               --i-understand-this-grants-approval-authority (exceptional opt-out)
#
# agentSandbox decides whether MERGECRAFT_CODEX_SANDBOX=danger-full-access is honoured.
# Tiers (tightest first): never | merged-only | dispatch | same-repo.
# Fork heads always refuse — no tier lifts that floor.
# merged-only gives no working shell during open PR review (head not on default yet).
# "On the default branch" only implies reviewed where merging requires review.
# same-repo widens override to any non-fork head (including pull_request_target).
# Residual risks: a fork PR checked out locally, or adding a collaborator.
#
# Real PAT-backed APPROVE for self-review still flows through mergecraft-approve.yml
# when the structural mergecraft-approval check passes — see docs/trust-policy.md.
trust:
  selfReview: "analyzers"
  agentSandbox: "same-repo"
