# Agent Skills open standard — https://agentskills.io/specification
install_paths:
  - path: .agents/skills/mergecraft/
    harnesses: [codex, cursor, opencode, gemini-cli, openclaw]
    note: The cross-vendor standard path. Gemini CLI prefers it over .gemini/skills/.
  - path: .claude/skills/mergecraft/
    harnesses: [claude-code, opencode]
    note: >-
      Claude Code does not read .agents/skills/ (anthropics/claude-code#31005).
      OpenCode reads this path too.
  - path: .github/skills/mergecraft/
    harnesses: [copilot]
    note: >-
      GitHub Copilot project skill path (cloud agent, code review, Copilot CLI,
      and VS Code agent mode).
  - install_command: hermes skills install
    harnesses: [hermes]
    note: Hermes uses ~/.hermes/skills/ or a category-nested project skills/ tree.
harnesses:
  - id: codex
    alt_paths: []
    source: https://learn.chatgpt.com/docs/build-skills
    verified: 2026-08-21
  - id: cursor
    alt_paths: [.cursor/skills/mergecraft/]
    source: https://cursor.com/docs/skills
    verified: 2026-08-21
  - id: grok-bot
    alt_paths: []
    source: https://docs.x.ai/grok-bot/skills-routines-and-automations
    verified: 2026-09-01
  - id: opencode
    alt_paths: [.opencode/skills/mergecraft/, .claude/skills/mergecraft/]
    source: https://opencode.ai/docs/skills
    verified: 2026-08-21
    install_section: |
      ## OpenCode install

      OpenCode reads skills from ``.opencode/skills/``, ``.agents/skills/``, and
      ``.claude/skills/``. It also supports commands (``.opencode/commands/``),
      subagents (``.opencode/agents/``), and plugins (``.opencode/plugins/``).

      mergeCraft ships a first-class OpenCode integration under
      ``integrations/opencode/``: slash commands (``/mergecraft/review`` and its
      engine variants), a read-only ``mergecraft/reviewer`` subagent, a
      ``mergecraft/fixer`` subagent for the review-only loop, and a plugin that
      registers the public MCP server, the commands, the agent, and the skill
      automatically.

      Install it in one step:

      ```bash
      mergecraft opencode install
      ```

      The installer copies commands, subagents, and the plugin into ``.opencode/``,
      writes the ``mcp.servers.mergecraft`` block, and sets ``harness: opencode``.
      ``mergecraft opencode doctor --strict`` verifies the result. Manual
      alternative:

      ```bash
      git clone --depth 1 https://github.com/alexhawat/mergeCraft /tmp/mergecraft-src
      mkdir -p .opencode
      cp -R /tmp/mergecraft-src/integrations/opencode/commands .opencode/
      cp -R /tmp/mergecraft-src/integrations/opencode/agents   .opencode/
      cp -R /tmp/mergecraft-src/integrations/opencode/plugins  .opencode/
      mkdir -p .opencode/skills
      cp -R /tmp/mergecraft-src/skills/opencode/mergecraft .opencode/skills/mergecraft
      rm -rf /tmp/mergecraft-src
      ```

      Then add the ``mcp.servers.mergecraft`` block from
      ``integrations/opencode/opencode.jsonc`` to your ``opencode.jsonc``. OpenCode
      V2 nests servers under ``mcp.servers`` and uses ``disabled`` (not the V1
      top-level ``mcp`` map with ``enabled``). Or let the CLI write it:

      ```bash
      opencode mcp add mergecraft -- mergecraft mcp serve --role public --transport stdio
      opencode mcp list
      ```

      ``/mergecraft/review`` defaults to the native reviewer subagent (no mergecraft
      provider tokens). ``/mergecraft/review-deep`` runs the full engine —
      deterministic analyzers, JEV screen, verifier, and evidence packet. JEV and
      Logfire are configured with ``mergecraft jev enable`` and
      ``mergecraft auth logfire``; when a Logfire token is present the plugin also
      traces native reviews. See ``docs/opencode.md``.
  - id: gemini-cli
    alt_paths: [.gemini/skills/mergecraft/]
    source: https://geminicli.com/docs/cli/skills
    verified: 2026-08-21
  - id: openclaw
    alt_paths: []
    source: https://docs.openclaw.ai/tools/skills
    verified: 2026-08-21
  - id: hermes
    source: https://hermes-agent.nousresearch.com/docs/developer-guide/creating-skills
    verified: 2026-08-21
    required_environment_variables:
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - GEMINI_API_KEY
      - NOUS_API_KEY
      - CURSOR_API_KEY
    install_section: |
      ## Hermes install

      Hermes Agent reads skills from ``~/.hermes/skills/`` or a category-nested project
      ``skills/`` tree. Install this package with:

      ```bash
      hermes skills install https://github.com/alexhawat/mergeCraft/tree/<ref>/skills/hermes
      ```

      mergeCraft ships a Nous provider (``mergecraft provider auth nous --scope github``,
      ``nous/deepseek/deepseek-v4-flash``) — a Hermes user can run reviews entirely on
      Nous credentials when configured.
    skip_validate: true
  - id: claude-code
    source: https://code.claude.com/docs/en/skills
    verified: 2026-08-21
  - id: copilot
    alt_paths: [.github/skills/mergecraft/]
    source: https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/add-skills
    verified: 2026-09-08
