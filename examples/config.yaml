# Sample .mergecraft/config.yaml — copy to your repo root as `.mergecraft/config.yaml`
model: anthropic/claude-sonnet
push: restricted
shell: restricted
signedCommits: false
prApproveEnabled: false
autoMergeEnabled: false
# setupScript: |
#   npm ci
# postCheckoutScript: |
#   echo ready
# envAllowlist: NODE_ENV,CI
# Extra GitHub logins allowed to invoke mergeCraft by comment even though their
# `author_association` is outside {OWNER, MEMBER, COLLABORATOR}. Empty (the
# default) means the association gate alone decides. Matched case-insensitively
# against `comment.user.login`; does not re-open comment invocation under
# `pull_request_target` (that needs the `allow_pr_target_comments` action input).
# commentInvocationAllowlist: release-bot,dependabot[bot]
# modeInstructions:
#   Build: Prefer minimal diffs.
# Mechanical gates the reviewer runs over changed files (see REVIEW-CHECKS.md).
# Omit entirely and mergecraft discovers lint / typecheck targets in your Makefile.
# staticChecks:
#   - name: lint
#     command: make lint
#   - name: types
#     command: uv run mypy {files}   # {files} = the diff's changed paths
#     suffixes: [".py"]              # gate is skipped when no such file changed
# Deterministic analyzer catalog (see REVIEW-CHECKS.md). Omit for auto-detect.
# analyzers:
#   enabled: true
#   inlineBudget: 8
#   baseComparison: offline
#   overrides:
#     actionlint:
#       enabled: true
