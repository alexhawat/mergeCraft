# SPDX-License-Identifier: MIT
# Local composite: install uv (pinned) and run `make setup`.
name: Bootstrap mergecraft toolchain
description: Install uv (pinned) and run make setup.

inputs:
  python-version:
    description: Python version for the uv-managed virtualenv (CI matrix uses 3.11 and 3.14).
    required: false
    default: "3.14"
  uv-version:
    description: uv version to install (keep in sync across all jobs here).
    required: false
    # 0.6.9 only had 3.14 alphas and segfaulted under pre-commit; use current uv.
    default: "0.11.29"

runs:
  using: composite
  steps:
    - name: Ensure self-hosted runner tools
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v make >/dev/null 2>&1; then
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential make
        fi
        if ! command -v node >/dev/null 2>&1 || ! command -v npm >/dev/null 2>&1; then
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nodejs npm
        fi
        if ! command -v gh >/dev/null 2>&1; then
          TAG=$(curl -fsSL https://api.github.com/repos/cli/cli/releases/latest | sed -n 's/.*"tag_name": *"\(v[^"]*\)".*/\1/p' | head -1)
          curl -fsSL "https://github.com/cli/cli/releases/download/${TAG}/gh_${TAG#v}_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local --strip-components=1
          gh --version | head -1
        fi

    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        version: ${{ inputs.uv-version }}
        python-version: ${{ inputs.python-version }}
        enable-cache: true

    - name: Bootstrap toolchain (make setup)
      shell: bash
      env:
        # Prefer the uv just installed by setup-uv; skip git hooks in CI.
        CI: "true"
        MERGECRAFT_SKIP_PRECOMMIT: "1"
      run: |
        export PATH="$(dirname "$(command -v uv)"):$PATH"
        make setup UV="$(command -v uv)"
