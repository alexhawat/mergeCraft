# zizmor config for `make workflow-lint` (W12.3 / punch #27).
#
# Intentional ignores only — each entry is a documented product choice, not a
# blanket disable. Prefer fixing findings (pin hashes, job-scoped permissions,
# env-passed expressions) over adding ignores.
rules:
  dangerous-triggers:
    ignore:
      # Dogfood Action: must run with base-repo privileges to post reviews /
      # check-runs; never checks out or executes the PR head (SHA-pinned Action
      # image + push/shell disabled). See workflow header comments.
      - mergecraft.yml
      # Reads merged PR body via context.payload only — no checkout, no `run:`
      # interpolation of attacker-controlled text. Authorization = merge itself.
      - auto-close-fixed-issues.yml
      # Delegates to a SHA-pinned Craft reusable workflow; no PR-head checkout.
      - changelog-preview.yml
      # Sweeps a merged PR's unresolved findings into issues. Needs base-repo
      # privileges (`issues: write`) that a fork's `pull_request` token cannot
      # have. Checks out the base branch — never the PR head — and the PR
      # number reaches the CLI via `env:`, not a `run:` interpolation.
      # Authorization = the merge itself.
      - findings-carryover.yml
      # Submits a privileged PR approval as the distinct @sevn-one identity
      # (D14 gate 3, PR #200). No checkout of any kind — only a read of the
      # already-posted mergecraft-approval check-run conclusion (a pure
      # function of Finding severities, not the reviewing agent's narrative)
      # and, if it is "success", a `gh api` POST to /pulls/{n}/reviews pinned
      # to that exact commit_id. pull_requests[0] is empty for fork PRs by
      # GitHub's own documented behavior, so this never fires for them.
      - mergecraft-approve.yml
  cache-poisoning:
    ignore:
      # security job analyzer-cache: step runs only on push (not pull_request);
      # caches dev-tooling under .mergecraft/, not release artifacts.
      - ci.yml
      # security-scope job (npm audit + workflow lint): the flagged
      # actions/setup-node step's job-level `if:` restricts it to
      # pull_request/workflow_dispatch only; it never runs on the `push`
      # trigger this workflow's sibling integration-pr job needs (#647).
      # zizmor's audit reads the workflow-level `on:` block, not per-job
      # `if:` guards. Caches agent-clis/tools npm lockfiles, not release
      # artifacts.
      - integration.yml
