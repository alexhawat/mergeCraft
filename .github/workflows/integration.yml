# SPDX-License-Identifier: MIT
# W12.1 / #21 — integration gate + W12.3 workflow-lint / npm-audit.
#
# PR: mocked / self-skipping ``@pytest.mark.integration`` suite + coverage
# ratchet + npm audit + actionlint/zizmor.
# Schedule / dispatch: live-provider integration with secrets (release
# precondition — see CONTRIBUTING.md §Cut a release).
name: Integration

on:
  pull_request:
    branches: [main, pre-0.0.1]
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-pr:
    name: Integration (PR / mocked + self-skip)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ref-resolution checks ask git whether a tag or branch exists
          # (README Action pin D25, tests/docs/support.py). A shallow fetch
          # has neither, so they answer "no" on PR builds while passing on
          # tag builds. Full history is what makes those answers truthful.
          fetch-depth: 0
          # #432 / D6 — score the merge result, not the PR head branch alone.
          ref: >-
            ${{ github.event_name == 'pull_request'
                && format('refs/pull/{0}/merge', github.event.pull_request.number)
                || github.ref }}
      - uses: ./.github/actions/bootstrap
      - name: Integration suite
        run: make test-integration
      - name: Coverage ratchet
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}"
            git worktree add ../mergecraft-base-coverage "$base_ref"
            (
              cd ../mergecraft-base-coverage
              make coverage-gate
              cp coverage.json "$GITHUB_WORKSPACE/coverage-base.json"
            )
            git worktree remove ../mergecraft-base-coverage --force
          fi
          make coverage-gate
          if [ -f coverage-base.json ]; then
            uv run python scripts/check_coverage_delta.py coverage.json --base coverage-base.json
          fi

  security-scope:
    name: npm audit + workflow lint
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docker/agent-clis/package-lock.json
      - name: npm audit (agent-clis lockfile)
        run: make npm-audit
      - name: actionlint + zizmor
        run: make workflow-lint
      - name: Ruff advisory families (non-blocking)
        continue-on-error: true
        run: make lint-ruff-advisory

  otlp-collector-e2e:
    name: OTLP collector e2e (#143)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve collector image
        # Pin: otel/opentelemetry-collector@sha256:1daa4312b48312dbae2d543e67b77e897dd5d9c48e7651d1416cdb417026ad06
        # (canonical copy: scripts/otel_collector_image.txt)
        run: echo "MERGECRAFT_OTEL_COLLECTOR_IMAGE=$(tr -d '\n' < scripts/otel_collector_image.txt)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/bootstrap
      - name: OTLP collector integration
        run: make test-otlp-collector

  integration-live:
    name: Integration (nightly / live-provider)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        provider: [anthropic, openai, gemini, nous, github]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ref-resolution checks ask git whether a tag or branch exists
          # (README Action pin D25, tests/docs/support.py). A shallow fetch
          # has neither, so they answer "no" on PR builds while passing on
          # tag builds. Full history is what makes those answers truthful.
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap
      - name: Live-provider integration (${{ matrix.provider }})
        env:
          MERGECRAFT_LIVE: "1"
          MERGECRAFT_LIVE_PROVIDER: ${{ matrix.provider }}
          ANTHROPIC_API_KEY: ${{ matrix.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY: ${{ matrix.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
          GEMINI_API_KEY: ${{ matrix.provider == 'gemini' && secrets.GEMINI_API_KEY || '' }}
          NOUS_API_KEY: ${{ matrix.provider == 'nous' && secrets.NOUS_API_KEY || '' }}
          GITHUB_TOKEN: ${{ matrix.provider == 'github' && secrets.GITHUB_TOKEN || '' }}
        run: make test-integration-live
