# SPDX-License-Identifier: MIT
# W12.1 / #21 — integration gate + W12.3 workflow-lint / npm-audit.
#
# PR: mocked / self-skipping ``@pytest.mark.integration`` suite + coverage
# ratchet + npm audit + actionlint/zizmor.
# Schedule / dispatch: live-provider integration with secrets (release
# precondition — see CONTRIBUTING.md §Cut a release), plus a non-blocking
# unit-suite run with a per-run random seed (#776 / F9): a pinned seed fixes
# the permutation of a collection, not the collection itself.
#
# The nightly live-provider matrix exercises `github` only. The `anthropic`,
# `openai` and `gemini` legs are removed and named as not exercised: this
# repository holds no Anthropic, OpenAI or Gemini API key, and a subscription
# cannot call those HTTP endpoints. The `nous` leg was removed on 2026-10-16:
# the Nous Portal credits ran out and no free Nous model could answer it.
# Real-harness live coverage runs in the E2E workflow's live slice.
name: Integration

on:
  pull_request:
    branches: [main, pre-0.0.1]
  push:
    branches: [main, pre-0.0.1, "release/**"]
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify PR diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Docs-only vs code paths
        id: classify
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          python3 scripts/ci_pr_touches_code.py \
            --event "${{ github.event_name }}" \
            --base "${BASE_REF:-main}"

  integration-pr:
    name: Integration (PR / mocked + self-skip / py${{ matrix.python }})
    needs: changes
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - name: Docs-only skip
        if: github.event_name == 'pull_request' && needs.changes.outputs.code != 'true'
        run: echo "::notice title=Integration skipped::Docs-only PR — integration leg skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
        with:
          # Ref-resolution checks ask git whether a tag or branch exists
          # (README Action pin D25, tests/docs/support.py). A shallow fetch
          # has neither, so they answer "no" on PR builds while passing on
          # tag builds. Full history is what makes those answers truthful.
          fetch-depth: 0
          # #432 / D6 — score the merge result, not the PR head branch alone.
          ref: >-
            ${{ github.event_name == 'pull_request'
                && format('refs/pull/{0}/merge', github.event.pull_request.number)
                || github.ref }}
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
        with:
          python-version: ${{ matrix.python }}
        env:
          # Exporter unit tests run in coverage-measure (D14 / TH8).
          MERGECRAFT_UV_EXTRAS: tracing
      - name: Restore base coverage from main cache
        id: base_coverage_cache
        if: (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') && matrix.python == '3.14' && github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: coverage.json
          key: mergecraft-coverage-main-${{ github.event.pull_request.base.sha }}
      - name: Fetch base coverage (cache or ci-cd artifact)
        if: (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') && matrix.python == '3.14' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dest="${{ runner.temp }}/coverage-base.json"
          base_sha="${{ github.event.pull_request.base.sha }}"
          if [[ -f coverage.json ]]; then
            cp coverage.json "${dest}"
            echo "Using cached base coverage for ${base_sha} (coverage.json cache restore)"
            exit 0
          fi
          chmod +x scripts/ci_fetch_coverage_artifact.sh
          for attempt in $(seq 1 12); do
            if scripts/ci_fetch_coverage_artifact.sh "${base_sha}" "${dest}"; then
              echo "Base coverage artifact ready for ${base_sha} (attempt ${attempt})"
              exit 0
            fi
            echo "Base coverage artifact not ready for ${base_sha} (attempt ${attempt}/12); sleeping 5s…" >&2
            sleep 5
          done
          echo "Base coverage cache/artifact miss — coverage ratchet will measure base in a worktree" >&2
          exit 1
      - name: Fetch head coverage from ci.yml artifact
        if: (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') && matrix.python == '3.14' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x scripts/ci_fetch_coverage_artifact.sh
          dest="${{ runner.temp }}/coverage-head.json"
          # integration-pr often starts before ci.yml finishes; poll for the artifact.
          head_sha="${{ github.event.pull_request.head.sha }}"
          for attempt in $(seq 1 72); do
            if scripts/ci_fetch_coverage_artifact.sh "${head_sha}" "${dest}"; then
              echo "Head coverage artifact ready for ${head_sha} (attempt ${attempt})"
              exit 0
            fi
            echo "Head coverage artifact not ready for ${head_sha} (attempt ${attempt}/72); sleeping 5s…" >&2
            sleep 5
          done
          echo "Head coverage artifact never appeared — coverage ratchet will fall back to make coverage-gate" >&2
          exit 1
      - name: Integration suite
        if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
        run: make test-integration
      - name: Coverage ratchet
        if: (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') && matrix.python == '3.14'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          MERGECRAFT_BASE_COVERAGE_PATH: ${{ runner.temp }}/coverage-base.json
          MERGECRAFT_HEAD_COVERAGE_PATH: ${{ runner.temp }}/coverage-head.json
        run: bash scripts/ci_coverage_delta_gate.sh
      - name: Seed main base coverage cache
        if: >-
          (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') &&
          matrix.python == '3.14' &&
          github.event_name == 'pull_request' &&
          steps.base_coverage_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: coverage.json
          key: mergecraft-coverage-main-${{ github.event.pull_request.base.sha }}

  filtered-egress:
    name: Integration (filtered egress / privileged)
    # The netns + veth + iptables enforcement in
    # ``mergecraft.analyzers.egress`` needs CAP_NET_ADMIN and CAP_SYS_ADMIN,
    # which ``integration-pr`` does not have — its run of this test self-skips.
    # Without this job the only evidence for the filter would be
    # ``AllowlistConnectProxy``, a userspace stand-in production never uses
    # (#606 finding 2).
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # #432 / D6 — score the merge result, not the PR head branch alone.
          ref: >-
            ${{ github.event_name == 'pull_request'
                && format('refs/pull/{0}/merge', github.event.pull_request.number)
                || github.ref }}
      - uses: ./.github/actions/bootstrap
        with:
          python-version: "3.14"
      - name: Real firewall boundary in a disposable network namespace
        # The hosted runner is disposable. The inner namespace additionally
        # keeps forwarding and firewall changes off the runner's own network.
        run: sudo env MERGECRAFT_DISPOSABLE_LINUX=1 make test-filtered-egress
      - name: Sandbox write/network block on the disposable host lane
        # A default ``docker run`` lacks the namespace capability the sandbox
        # test needs, and a hosted runner cannot create the namespace
        # unprivileged. This root process on a disposable host is the lane the
        # test is written for; with the privileged-lane flag set it fails
        # rather than skips.
        run: sudo env MERGECRAFT_DISPOSABLE_LINUX=1 make test-sandbox-privileged

  security-scope:
    name: npm audit + workflow lint
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            docker/agent-clis/package-lock.json
            tools/package-lock.json
      - name: npm audit (agent-clis lockfile)
        run: make npm-audit
      - name: actionlint + zizmor
        run: make workflow-lint
      - name: Ruff advisory families (non-blocking)
        continue-on-error: true
        run: make lint-ruff-advisory

  otlp-collector-e2e:
    name: OTLP collector e2e (#143)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve collector image
        # Pin: otel/opentelemetry-collector@sha256:1daa4312b48312dbae2d543e67b77e897dd5d9c48e7651d1416cdb417026ad06
        # (canonical copy: scripts/otel_collector_image.txt)
        run: echo "MERGECRAFT_OTEL_COLLECTOR_IMAGE=$(tr -d '\n' < scripts/otel_collector_image.txt)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/bootstrap
      - name: OTLP collector integration
        run: make test-otlp-collector

  integration-live:
    name: Integration (nightly / live-provider)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        # Only the leg this repository can run: `github` (GITHUB_TOKEN). The
        # removed legs are named in the workflow header.
        provider: [github]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ref-resolution checks ask git whether a tag or branch exists
          # (README Action pin D25, tests/docs/support.py). A shallow fetch
          # has neither, so they answer "no" on PR builds while passing on
          # tag builds. Full history is what makes those answers truthful.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
      - name: Live-provider integration (${{ matrix.provider }})
        env:
          MERGECRAFT_LIVE: "1"
          MERGECRAFT_LIVE_PROVIDER: ${{ matrix.provider }}
          GITHUB_TOKEN: ${{ matrix.provider == 'github' && secrets.GITHUB_TOKEN || '' }}
        run: make test-integration-live

  # #776 / F9 — a pinned seed does not pin order. pytest-randomly shuffles the
  # *collected* set, and the collection changes with sharding, xdist placement,
  # platform skips and any added or deleted test, so order-dependent coupling is
  # only visible under a seed that varies.
  #
  # This job runs on the nightly cron only, which is what makes it non-blocking:
  # it adds no required PR check and cannot stop a merge. A coupling it surfaces
  # is a red nightly run — the signal, not a silenced pass. PR runs stay
  # deterministic: MERGECRAFT_PYTEST_RANDOM_SEED is set here and on no path a
  # pull_request run reaches, so `make test` keeps inheriting the pinned 424242.
  random-order:
    name: Unit tests (nightly / random order, non-blocking)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Unique per run, so each night shuffles the collected set differently.
      MERGECRAFT_PYTEST_RANDOM_SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ref-resolution checks ask git whether a tag or branch exists
          # (README Action pin D25, tests/docs/support.py). A shallow fetch
          # has neither, so those answers are untruthful without full history.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          python-version: "3.14"
        env:
          # Exporter unit tests need the tracing extra (ci.yml test job, D14 / TH8).
          MERGECRAFT_UV_EXTRAS: tracing
      - name: Unit tests (random order)
        run: make test
