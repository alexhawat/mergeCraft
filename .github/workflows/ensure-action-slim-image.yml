# SPDX-License-Identifier: MIT
# Reusable: ensure a slim GHCR image exists for a given Action SHA pin,
# building + pushing it if missing.
#
# Factored out of ci.yml's `action-slim-bootstrap` job (#526/#532) so
# `bump-action-pin.yml`'s workflow_dispatch bump flow can call the exact same
# body instead of a second "check GHCR, checkout that SHA, build, push"
# implementation drifting from it. ci.yml's own `action-slim-bootstrap` job
# now just resolves the SHA and calls this.
#
# Why this exists at all (the deadlock this escapes): action.yml's
# `runs.image` is a digest pin, and `scripts/check_action_image_digest.py`
# requires that digest to match what GHCR actually serves for the
# self-review Action SHA. The image for a SHA is normally published by
# ci-cd.yml's `build-images` job — but that job runs behind `Full verify`
# (ci-cd.yml's own `verify` job, i.e. `make ci`), which runs
# `action-pin-check` (`scripts/check_action_pin_freshness.py`), which reads
# the pin `action-image-digest-check` needs the image for. Promote the pin
# stale enough and `main`/`pre-0.0.1` goes red with no path to green: the
# check that would unblock it cannot run until the image it is blocked on
# exists.
#
# This workflow breaks that cycle by running earlier and independently: as a
# `pull_request` job into `pre-0.0.1` (ci.yml), before `Full verify` runs at
# all, and again here as a `workflow_call` any dispatch-driven bump can
# invoke directly — neither path depends on `Full verify` having passed.
name: Ensure action slim image

on:
  workflow_call:
    inputs:
      sha:
        description: >-
          Full 40-hex commit SHA to ensure ghcr.io/alexhawat/mergecraft:<sha>
          exists for. Builds from that commit's own Dockerfile when the tag
          is not already published.
        required: true
        type: string
    outputs:
      published:
        description: >-
          "true" if the tag was already on GHCR (no build ran), "false" if
          this call built and pushed it.
        value: ${{ jobs.ensure.outputs.published }}

permissions:
  contents: read
  packages: write

jobs:
  ensure:
    name: Ensure slim GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      published: ${{ steps.tag.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check whether slim image tag already exists on GHCR
        id: tag
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if docker manifest inspect "ghcr.io/alexhawat/mergecraft:${SHA}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Slim image tag already published — skipping rebuild"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Slim image tag missing — will build and push"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tag.outputs.exists != 'true'
        with:
          ref: ${{ inputs.sha }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        if: steps.tag.outputs.exists != 'true'
      - name: Build and push slim image for pinned Action SHA
        if: steps.tag.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/alexhawat/mergecraft:${{ inputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.sha }}
          cache-from: type=gha,scope=mergeCraft-slim-bootstrap
          cache-to: type=gha,mode=max,scope=mergeCraft-slim-bootstrap
