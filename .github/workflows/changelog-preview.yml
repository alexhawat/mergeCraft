# SPDX-License-Identifier: MIT
# Posts (or status-checks) a Craft changelog preview on pull requests.
# Dependabot (github-actions) owns bumps of the pinned Craft reusable workflow.
name: Changelog Preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: changelog-preview-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog-preview:
    # Craft installs its binary from GitHub releases, so a 5xx there can fail
    # this job. `continue-on-error` cannot express that here: a job that calls a
    # reusable workflow with `uses` accepts only name/uses/with/secrets/needs/
    # if/permissions, and actionlint rejects anything else. The preview stays
    # advisory because it is not in `require-ci-on-main`'s required contexts.
    # Pin: getsentry/craft changelog-preview@v2 → 2.30.1; dependabot owns bumps.
    uses: getsentry/craft/.github/workflows/changelog-preview.yml@55694f8bf3a0fd051e21a877f57b4c0dd8e946bb # v2
    # Pin the craft binary too: the upstream default ("latest") queries
    # api.github.com unauthenticated, which 403s on rate-limit and fails the job.
    with:
      craft-version: 2.30.1
    # No secrets pass through: the called workflow already receives the token GitHub grants every reusable workflow.
