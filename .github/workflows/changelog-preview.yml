# SPDX-License-Identifier: MIT
# Posts (or status-checks) a Craft changelog preview on pull requests.
# Dependabot (github-actions) owns bumps of the pinned Craft reusable workflow.
name: Changelog Preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: changelog-preview-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog-preview:
    # Dependabot exemption: a version bump carries no user-facing changelog
    # entry, so the preview has nothing to preview — it only ever asked
    # Dependabot for prose it cannot write. Skipping the job (rather than
    # dropping the workflow) keeps the check reported: GitHub records a
    # conditional skip as a completed, non-failing check, so a branch
    # protection rule requiring `changelog-preview / preview` still passes.
    # Gate on the PR author, not github.actor: after a maintainer rebases or
    # comments `@dependabot recreate`, the actor on the resulting synchronize
    # is the human, while user.login stays dependabot[bot].
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    # Pin: getsentry/craft changelog-preview@v2 → 2.30.1; dependabot owns bumps.
    uses: getsentry/craft/.github/workflows/changelog-preview.yml@cd1e8294061fd970b40d98b77aaa109cb1e00e78 # v2
    # Pin the craft binary too: the upstream default ("latest") queries
    # api.github.com unauthenticated, which 403s on rate-limit and fails the job.
    with:
      craft-version: 2.30.1
    secrets: inherit
