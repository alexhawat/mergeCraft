# SPDX-License-Identifier: MIT
# Craft prepare + workflow publish (PyPI Trusted Publishing, GitHub release, GHCR
# retag, merge-back PR). Image build / SBOM / scan / sign / promote live in
# ci-cd.yml (build-once → digest → attest → retag). Dependabot (github-actions)
# owns bumps of the pinned Craft / checkout SHAs below.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (semver, major/minor/patch, or auto)'
        required: false
        default: auto
      force:
        description: Force release despite release-blocker label
        required: false
        type: boolean
        default: false

# Least privilege: no top-level write; each job declares its own permissions.
permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # W8.2 prepare — contents/issues only; named GITHUB_TOKEN via env (no blanket inherit).
  prepare:
    name: Prepare release branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.craft.outputs.version }}
      branch: ${{ steps.craft.outputs.branch }}
      sha: ${{ steps.packages.outputs.sha }}
      issue_url: ${{ steps.craft.outputs.issue_url }}
    steps:
      # The one checkout here that keeps its credential, on purpose: Craft pushes
      # the release branch with it. Nothing in this job uploads the workspace.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Prepare release (Craft)
        id: craft
        # Pin: getsentry/craft@v2 → 2.30.1; dependabot owns bumps.
        uses: getsentry/craft@9567926a606072678ef367b02445c4f99f374795 # v3.11.2
        with:
          version: ${{ inputs.version }}
          force: ${{ inputs.force && 'true' || 'false' }}
          publish_repo: self
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/bootstrap
      # Craft bumps `docs/consumer-release.json`, but the generated agent packages
      # keep rendering the *previous* tag: `scripts/consumer_install_pins.py`
      # rewrites the install pins and `tree/v<release>/docs` links, while
      # `scripts/gen_agent_packages.py` also resolves the `{{DOCUMENTATION_REF}}`
      # prose and every `blob/v<release>/` documentation link. `make
      # agent-packages-check` therefore failed on the release branch only:
      # `docs/consumer-release.json` never changes on a pull request, so PR CI
      # renders against the published tag and cannot see the drift. Regenerating
      # here, on the branch Craft just pushed, keeps the prepared branch equal to
      # its own generator output and leaves the release commit as the source of
      # the dist that CPython publishes.
      - name: Regenerate agent packages for the release tag
        id: packages
        env:
          RELEASE_BRANCH: ${{ steps.craft.outputs.branch }}
          RELEASE_VERSION: ${{ steps.craft.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin "${RELEASE_BRANCH}"
          git checkout "${RELEASE_BRANCH}"
          uv run python scripts/gen_agent_packages.py
          if git diff --quiet; then
            echo "Agent packages already match the release tag." >> "$GITHUB_STEP_SUMMARY"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          git -c user.name="mergecraft-release" \
              -c user.email="noreply@users.noreply.github.com" \
              commit -m "chore(release): regenerate agent packages for ${RELEASE_VERSION}"
          git push origin "${RELEASE_BRANCH}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Regenerated agent packages for ${RELEASE_VERSION}." >> "$GITHUB_STEP_SUMMARY"
      # Craft's "Request publish" step always runs and opens
      # `publish: <owner>/<repo>@<version>`. Nothing in this repository acts on
      # that issue — the approval is the `pypi` environment deployment review — so
      # leaving it open reads as a pending approval nobody can give (#1005). It is closed here, with the real instruction in
      # the comment, and its URL is recorded for the publish gate below.
      - name: Close the informational publish issue
        if: ${{ steps.craft.outputs.issue_url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_URL: ${{ steps.craft.outputs.issue_url }}
          RELEASED_VERSION: ${{ steps.craft.outputs.version }}
        run: |
          set -euo pipefail
          gh issue close "${ISSUE_URL}" --reason "not planned" \
            --comment "Informational only: the Release workflow publishes ${RELEASED_VERSION} after the pypi environment approval; nothing acts on this issue (docs/release-process.md)."
          echo "Publish-request issue (closed automatically, informational only): ${ISSUE_URL}" \
            >> "$GITHUB_STEP_SUMMARY"

  # Dispatch the CI/CD build on the branch `prepare` just pushed. That push is made
  # with the workflow's own GITHUB_TOKEN, and GitHub does not start workflows from
  # such a push, so CI/CD (and with it the dist artifact the publish step needs)
  # would never run for the release branch (#1004). A workflow_dispatch event
  # created with GITHUB_TOKEN is the documented exception, so the workflow path and
  # the local path (prepare, then push from contributor credentials) converge on
  # the same artifact. This job holds only `actions: write`: it starts a workflow,
  # it reads no secret and writes no repository content.
  dispatch-build:
    name: Dispatch CI/CD on the release branch
    needs: prepare
    if: ${{ needs.prepare.outputs.branch != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch CI/CD
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREPARED_BRANCH: ${{ needs.prepare.outputs.branch }}
        run: |
          set -euo pipefail
          gh workflow run ci-cd.yml --ref "${PREPARED_BRANCH}"
          echo "Dispatched CI/CD on ${PREPARED_BRANCH}; its build-dist job uploads artifact-python-dist." >> "$GITHUB_STEP_SUMMARY"

  # EV3 eval regression gate — structural replay of the eval bank compared
  # against the committed baseline with the declared tolerance band
  # (mergecraft.evals.gate.DEFAULT_GATE_TOLERANCE). Blocking: a metric that
  # regresses beyond the band fails the release before publish.
  eval-gate:
    name: Eval regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
      - name: Replay eval bank (candidate)
        run: |
          set -euo pipefail
          uv run mergecraft eval replay-bank \
            --results-dir "$RUNNER_TEMP/eval-gate" \
            --json > "$RUNNER_TEMP/candidate.json"
      # A baseline that carries a detection half needs a detection leg in this
      # job: the candidate above is a structural replay and never carries one.
      # --require-halves therefore makes every release fail until this job also
      # produces the detection half the baseline carries.
      - name: Release regression gate
        run: |
          set -euo pipefail
          uv run mergecraft eval gate \
            --baseline evals/results/latest.json \
            --candidate "$RUNNER_TEMP/candidate.json" \
            --tolerance 0.02 \
            --require-halves
        # NOTE: the committed baseline is currently perfect
        # (unsafe_approval_rate 0.0 / clean_block_rate 0.0 over ~46 cases), so
        # a single case flipping can exceed the 0.02 band. When the eval bank
        # changes, regenerate the baseline from the same commit
        # (`mergecraft eval replay-bank` → `evals/results/latest.json`) so the
        # gate measures drift, not corpus edits.

  # The only publisher. The `pypi` environment's required reviewers are the
  # approval; PyPI uses Trusted Publishing (OIDC, no token), and the GitHub
  # release, GHCR version tags and merge-back PR follow in the same job.
  publish:
    name: Publish release
    needs: [prepare, dispatch-build, eval-gate]
    if: ${{ needs.prepare.outputs.branch != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: pypi
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: read
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_BRANCH: ${{ needs.prepare.outputs.branch }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      # The merge-back PR and GitHub release use the App token, so the PR runs
      # the required checks (a job-token PR triggers none).
      - name: Mint the App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.MERGECRAFT_APP_ID }}
          private-key: ${{ secrets.MERGECRAFT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.branch }}
          token: ${{ steps.app-token.outputs.token }}
          # The post-release bump is committed and pushed on the merge-back branch.
          persist-credentials: true

      - uses: ./.github/actions/bootstrap

      - name: Wait for CI/CD on the release SHA
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 100); do
            row="$(gh run list --workflow ci-cd.yml --branch "$RELEASE_BRANCH" --limit 30 \
              --json databaseId,headSha,status,conclusion \
              --jq ".[] | select(.headSha == \"$RELEASE_SHA\") | [.databaseId, .status, .conclusion] | @tsv" \
              | head -1)"
            if [ -n "$row" ]; then
              IFS=$'\t' read -r run_id status conclusion <<< "$row"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "::error::CI/CD on $RELEASE_SHA concluded $conclusion"
                  exit 1
                fi
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 30
          done
          echo "::error::CI/CD did not finish on $RELEASE_SHA within the wait window"
          exit 1

      - name: Download and verify the dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.build.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -n artifact-python-dist -D dist
          # The build-provenance stamp travels with the artifact but is not a
          # distribution; keep only the wheel and sdist for the upload.
          find dist -mindepth 1 -maxdepth 1 ! -name '*.whl' ! -name '*.tar.gz' -exec rm -rf {} +
          uv run python scripts/release_publish.py verify-dist --dist dist --version "$RELEASE_VERSION"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          # A later step can fail after PyPI accepted the files (for example a
          # transient registry issue). The re-run must finish the release, not
          # die on an existing version.
          skip-existing: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          uv run python scripts/release_publish.py notes --changelog CHANGELOG.md \
            --version "$RELEASE_VERSION" > "$notes"
          args=(--title "v$RELEASE_VERSION" --notes-file "$notes")
          if [[ "$RELEASE_VERSION" =~ (a|b|rc)[0-9]+$ ]]; then
            args+=(--prerelease)
          fi
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "release v$RELEASE_VERSION already exists; leaving it in place"
          else
            gh release create "v$RELEASE_VERSION" --target "$RELEASE_SHA" "${args[@]}"
          fi

      - name: Retag the signed images
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create -t "$repo:$RELEASE_VERSION" "$repo:$RELEASE_SHA"
          docker buildx imagetools create -t "$repo:analyzers-$RELEASE_VERSION" "$repo:analyzers-$RELEASE_SHA"
          for pair in "$RELEASE_VERSION:$RELEASE_SHA" "analyzers-$RELEASE_VERSION:analyzers-$RELEASE_SHA"; do
            target="${pair%%:*}"
            source="${pair##*:}"
            src_digest="$(docker buildx imagetools inspect "$repo:$source" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            dst_digest="$(docker buildx imagetools inspect "$repo:$target" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            if [ "$src_digest" != "$dst_digest" ]; then
              echo "::error::retagging $source changed the digest ($src_digest -> $dst_digest)"
              exit 1
            fi
          done

      - name: Bump to the next development version
        id: post
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          branch="chore/release-merge-back-$RELEASE_VERSION"
          git switch -c "$branch"
          bash scripts/post-release.sh "" "$RELEASE_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml server.json uv.lock
          if git diff --cached --quiet; then
            echo "branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(release): start the next development version"
          # Workflow-owned branch: a re-run recreates the same tree with a new
          # commit date, so a plain push would be non-fast-forward.
          git push --force-with-lease origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open the merge-back PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          MERGE_BACK_BRANCH: ${{ steps.post.outputs.branch }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --base main --head "$MERGE_BACK_BRANCH" --state open --json url -q '.[0].url // empty')"
          if [ -n "$existing" ]; then
            echo "merge-back PR already open: $existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          body="$(mktemp)"
          {
            echo "Merges \`$RELEASE_VERSION\` back into \`main\`."
            echo
            echo "Published by the release workflow: PyPI (Trusted Publishing), the GitHub"
            echo "release at \`$RELEASE_SHA\`, and the GHCR version tags."
            echo
            echo "Merge with a **merge commit**."
          } > "$body"
          gh pr create --base main --head "$MERGE_BACK_BRANCH" \
            --title "chore(release): merge $RELEASE_VERSION back" --body-file "$body"

      - name: Summarise the release
        env:
          MERGE_BACK_BRANCH: ${{ steps.post.outputs.branch }}
        run: |
          {
            echo "### Released \`$RELEASE_VERSION\`"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| source | \`$RELEASE_SHA\` |"
            echo "| PyPI | published from the CI/CD dist artifact |"
            echo "| GitHub release | \`v$RELEASE_VERSION\` |"
            echo "| merge-back | PR from \`$MERGE_BACK_BRANCH\` |"
            echo
            echo "Merge the merge-back PR with a merge commit."
          } >> "$GITHUB_STEP_SUMMARY"
