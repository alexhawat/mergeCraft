# SPDX-License-Identifier: MIT
# PR/push verify gate (adapted from sevn@pre-0.0.1; no mergecraft.yml).
name: CI

on:
  pull_request:
    branches: [main, pre-0.0.1]
  push:
    branches: [main, pre-0.0.1, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    name: Verify (toolchain py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ref-resolution checks ask git whether a tag or branch exists
          # (README Action pin D25, tests/docs/support.py). A shallow fetch
          # has neither, so they answer "no" on PR builds while passing on
          # tag builds. Full history is what makes those answers truthful.
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap
        with:
          python-version: ${{ matrix.python }}
      - name: Lockfile check
        run: make lockcheck

  test:
    name: Verify (tests py${{ matrix.python }} ${{ matrix.group }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
        group: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ref-resolution checks ask git whether a tag or branch exists
          # (README Action pin D25, tests/docs/support.py). A shallow fetch
          # has neither, so they answer "no" on PR builds while passing on
          # tag builds. Full history is what makes those answers truthful.
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap
        with:
          python-version: ${{ matrix.python }}
        env:
          # Tracing extra only on the test job: exporter unit tests need logfire/otel
          # installed, but static/toolchain jobs must not pay the sync cost (D14 / TH8).
          MERGECRAFT_UV_EXTRAS: tracing
      - name: Unit tests (shard ${{ matrix.group }} of 2)
        env:
          MERGECRAFT_TEST_SPLITS: "2"
          MERGECRAFT_TEST_GROUP: ${{ matrix.group }}
        run: make test

  coverage-gate:
    name: Verify (coverage gate py3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Merge-base ratchet (check_coverage_ratchet.py) needs full history.
          fetch-depth: 0
      - name: Fetch base branch for merge-base ratchet
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "$BASE_REF"
      - uses: ./.github/actions/bootstrap
        with:
          python-version: "3.14"
        env:
          # Tracing extra: exporter unit tests are part of coverage-measure (D14 / TH8).
          MERGECRAFT_UV_EXTRAS: tracing
      - name: Coverage floors and ratchet
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: make coverage-gate

  action-slim-bootstrap:
    name: Bootstrap slim GHCR image for Action SHA pin
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'pre-0.0.1' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve self-review Action SHA pin
        id: pin
        run: |
          set -euo pipefail
          SHA=$(grep -E '^\s*MERGECRAFT_ACTION_SHA:\s*"' .github/workflows/mergecraft.yml | head -1 | sed -E 's/.*"([0-9a-f]{40})".*/\1/')
          test -n "${SHA}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check whether slim image tag already exists on GHCR
        id: tag
        env:
          SHA: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          if docker manifest inspect "ghcr.io/alexhawat/mergecraft:${SHA}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Slim image tag already published — skipping bootstrap rebuild"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Slim image tag missing — will build and push"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tag.outputs.exists != 'true'
        with:
          ref: ${{ steps.pin.outputs.sha }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        if: steps.tag.outputs.exists != 'true'
      - name: Build and push slim image for pinned Action SHA
        if: steps.tag.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/alexhawat/mergecraft:${{ steps.pin.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.pin.outputs.sha }}
          cache-from: type=gha,scope=mergeCraft-slim-bootstrap
          cache-to: type=gha,mode=max,scope=mergeCraft-slim-bootstrap

  static:
    name: Verify (static + build py${{ matrix.python }})
    needs: action-slim-bootstrap
    if: >-
      always() &&
      (needs.action-slim-bootstrap.result == 'success' ||
       needs.action-slim-bootstrap.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ref-resolution checks ask git whether a tag or branch exists
          # (README Action pin D25, tests/docs/support.py). A shallow fetch
          # has neither, so they answer "no" on PR builds while passing on
          # tag builds. Full history is what makes those answers truthful.
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap
        with:
          python-version: ${{ matrix.python }}
      - name: Static, typecheck, build tier
        run: make ci-static
      - name: Action pin freshness
        if: matrix.python == '3.14'
        run: |
          # No --depth here. A depth-limited fetch marks origin/main as a
          # shallow boundary, so rev-list stops at the graft and the staleness
          # check under-reports the product lag (measured on this repo: 5
          # commits -> 1), silently defanging the guard in the only job that
          # runs it. The checkout above is fetch-depth: 0, so the objects are
          # already local and a full fetch is near-free.
          git fetch --no-tags origin main:refs/remotes/origin/main || true
          make action-pin-check
      # First-wave CI SARIF for mergeCraft ingest (#464 / D8). Upload even when
      # the static tier failed so the review still sees the tool's findings.
      - name: Emit ruff and mypy SARIF
        if: always() && matrix.python == '3.14'
        env:
          # Makefile bootstrap installs dev tools into .venv-dev (AG8); bare
          # `uv run` would create a base-only .venv and fail to spawn ruff/mypy.
          UV_PROJECT_ENVIRONMENT: .venv-dev
        run: |
          mkdir -p .sarif
          uv run ruff check src tests scripts --output-format sarif --output-file .sarif/ruff.sarif || true
          set +e
          uv run mypy src/mergecraft --output json --no-error-summary > .sarif/mypy.json
          mypy_rc=$?
          set -e
          if [ ! -s .sarif/mypy.json ]; then
            if [ "$mypy_rc" -eq 0 ]; then
              printf '%s\n' '[]' > .sarif/mypy.json
            else
              echo "mypy produced no JSON (exit ${mypy_rc})" >&2
              exit 1
            fi
          fi
          uv run python scripts/native_output_to_sarif.py mypy .sarif/mypy.json .sarif/mypy.sarif
      - name: Upload ruff SARIF
        if: always() && matrix.python == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ruff-sarif
          path: .sarif/ruff.sarif
          if-no-files-found: warn
      - name: Upload mypy SARIF
        if: always() && matrix.python == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mypy-sarif
          path: .sarif/mypy.sarif
          if-no-files-found: warn
      # W5 extended SARIF (lane D / #600): actionlint + zizmor for sandbox-blocked
      # workflow analyzers. trufflehog omitted — JSONL-only, no SARIF emitter (D12).
      # SARIF uploads run on Python 3.14 only — one canonical artifact set per PR.
      - name: Emit actionlint and zizmor SARIF
        if: always() && matrix.python == '3.14'
        env:
          MERGECRAFT_WORKFLOW_SARIF_DIR: .sarif
        run: ./scripts/workflow_lint.sh
      - name: Upload actionlint SARIF
        if: always() && matrix.python == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: actionlint-sarif
          path: .sarif/actionlint.sarif
          if-no-files-found: warn
      - name: Upload zizmor SARIF
        if: always() && matrix.python == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zizmor-sarif
          path: .sarif/zizmor.sarif
          if-no-files-found: warn

  security:
    name: Verify (security audit py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ref-resolution checks ask git whether a tag or branch exists
          # (README Action pin D25, tests/docs/support.py). A shallow fetch
          # has neither, so they answer "no" on PR builds while passing on
          # tag builds. Full history is what makes those answers truthful.
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        if: github.event_name == 'push'
        with:
          path: .mergecraft/analyzer-cache
          key: analyzer-cache-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            analyzer-cache-${{ runner.os }}-py${{ matrix.python }}-
      - name: bandit + pip-audit (OSV.dev)
        env:
          BANDIT_JSON: .sarif/bandit.json
        run: |
          mkdir -p .sarif
          make security
      - name: Convert bandit SARIF
        if: always() && matrix.python == '3.14'
        env:
          UV_PROJECT_ENVIRONMENT: .venv-dev
        run: uv run python scripts/native_output_to_sarif.py bandit .sarif/bandit.json .sarif/bandit.sarif
      - name: Upload bandit SARIF
        if: always() && matrix.python == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bandit-sarif
          path: .sarif/bandit.sarif
          if-no-files-found: warn
      # W5 extended SARIF (lane D / #600): semgrep for sandbox-blocked pattern scan.
      # Python 3.14 matrix leg only — one canonical semgrep-sarif artifact per PR.
      - name: Emit semgrep SARIF
        if: always() && matrix.python == '3.14'
        env:
          UV_PROJECT_ENVIRONMENT: .venv-dev
        run: uv run python scripts/ci_extended_sarif.py .sarif/semgrep.sarif
      - name: Upload semgrep SARIF
        if: always() && matrix.python == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: semgrep-sarif
          path: .sarif/semgrep.sarif
          if-no-files-found: warn

  integration:
    name: Verify (integration py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ref-resolution checks ask git whether a tag or branch exists
          # (README Action pin D25, tests/docs/support.py). A shallow fetch
          # has neither, so they answer "no" on PR builds while passing on
          # tag builds. Full history is what makes those answers truthful.
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap
        with:
          python-version: ${{ matrix.python }}
      - name: Integration suite (self-skips without live secrets)
        run: make test-integration

  privilege-root:
    name: Verify (root container privilege py3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build action image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: mergecraft:lane-a
          cache-from: type=gha,scope=mergeCraft-slim-privilege
          cache-to: type=gha,mode=max,scope=mergeCraft-slim-privilege
      - name: Privilege identity + trust-ordering (root and uid 65534)
        run: |
          chmod +x docker/e2e/run_in_image_privilege.sh
          docker/e2e/run_in_image_privilege.sh mergecraft:lane-a

  mutation-advisory:
    name: Verify (mutation advisory py3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap
        with:
          python-version: "3.14"
      - name: Decision-module mutation harness (advisory)
        env:
          MUTATION_ESCAPE_THRESHOLD_PCT: "45"
        run: make mutation-test-decisions
