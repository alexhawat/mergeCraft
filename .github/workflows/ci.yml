# SPDX-License-Identifier: MIT
# PR/push verify gate (adapted from sevn@pre-0.0.1; no mergecraft.yml).
name: CI

on:
  pull_request:
    branches: [main, pre-0.0.1]
  push:
    branches: [main, pre-0.0.1, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    name: Verify (toolchain py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ref-resolution checks ask git whether a tag or branch exists
          # (README Action pin D25, tests/docs/support.py). A shallow fetch
          # has neither, so they answer "no" on PR builds while passing on
          # tag builds. Full history is what makes those answers truthful.
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap
        with:
          python-version: ${{ matrix.python }}
      - name: Lockfile check
        run: make lockcheck

  test:
    name: Verify (tests py${{ matrix.python }} ${{ matrix.group }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
        group: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ref-resolution checks ask git whether a tag or branch exists
          # (README Action pin D25, tests/docs/support.py). A shallow fetch
          # has neither, so they answer "no" on PR builds while passing on
          # tag builds. Full history is what makes those answers truthful.
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap
        with:
          python-version: ${{ matrix.python }}
        env:
          # Tracing extra only on the test job: exporter unit tests need logfire/otel
          # installed, but static/toolchain jobs must not pay the sync cost (D14 / TH8).
          MERGECRAFT_UV_EXTRAS: tracing
      - name: Unit tests (shard ${{ matrix.group }} of 2)
        env:
          MERGECRAFT_TEST_SPLITS: "2"
          MERGECRAFT_TEST_GROUP: ${{ matrix.group }}
        run: make test

  coverage-gate:
    name: Verify (coverage gate py3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Merge-base ratchet (check_coverage_ratchet.py) needs full history.
          fetch-depth: 0
      - name: Fetch base branch for merge-base ratchet
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "$BASE_REF"
      - uses: ./.github/actions/bootstrap
        with:
          python-version: "3.14"
        env:
          # Tracing extra: exporter unit tests are part of coverage-measure (D14 / TH8).
          MERGECRAFT_UV_EXTRAS: tracing
      - name: Coverage floors and ratchet
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: make coverage-gate

  static:
    name: Verify (static + build py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ref-resolution checks ask git whether a tag or branch exists
          # (README Action pin D25, tests/docs/support.py). A shallow fetch
          # has neither, so they answer "no" on PR builds while passing on
          # tag builds. Full history is what makes those answers truthful.
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap
        with:
          python-version: ${{ matrix.python }}
      - name: Static, typecheck, build tier
        run: make ci-static
      # Reports self-review Action-pin drift (#450). Advisory on purpose: the
      # stale pin lives on the default branch, so it is not a defect in the PR
      # being checked, and failing here would block every unrelated change
      # until someone bumps main. The annotation is what makes the skew
      # visible instead of silent -- which is how it reached 687 commits.
      - name: Action pin freshness (advisory)
        if: matrix.python == '3.14'
        run: |
          # No --depth here. A depth-limited fetch marks origin/main as a
          # shallow boundary, so rev-list stops at the graft and the staleness
          # check under-reports the product lag (measured on this repo: 5
          # commits -> 1), silently defanging the guard in the only job that
          # runs it. The checkout above is fetch-depth: 0, so the objects are
          # already local and a full fetch is near-free.
          git fetch --no-tags origin main:refs/remotes/origin/main || true
          if out="$(make action-pin-check 2>&1)"; then
            echo "$out"
          else
            echo "$out"
            detail="$(printf '%s' "$out" | grep -m1 -- '  - ' | sed 's/^  - //')"
            echo "::warning title=mergecraft action pin drift::${detail:-see log}"
          fi
      # First-wave CI SARIF for mergeCraft ingest (#464 / D8). Upload even when
      # the static tier failed so the review still sees the tool's findings.
      - name: Emit ruff and mypy SARIF
        if: always() && matrix.python == '3.14'
        env:
          # Makefile bootstrap installs dev tools into .venv-dev (AG8); bare
          # `uv run` would create a base-only .venv and fail to spawn ruff/mypy.
          UV_PROJECT_ENVIRONMENT: .venv-dev
        run: |
          mkdir -p .sarif
          uv run ruff check src tests scripts --output-format sarif --output-file .sarif/ruff.sarif || true
          set +e
          uv run mypy src/mergecraft --output json --no-error-summary > .sarif/mypy.json
          mypy_rc=$?
          set -e
          if [ ! -s .sarif/mypy.json ]; then
            if [ "$mypy_rc" -eq 0 ]; then
              printf '%s\n' '[]' > .sarif/mypy.json
            else
              echo "mypy produced no JSON (exit ${mypy_rc})" >&2
              exit 1
            fi
          fi
          uv run python scripts/native_output_to_sarif.py mypy .sarif/mypy.json .sarif/mypy.sarif
      - name: Upload ruff SARIF
        if: always() && matrix.python == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ruff-sarif
          path: .sarif/ruff.sarif
          if-no-files-found: warn
      - name: Upload mypy SARIF
        if: always() && matrix.python == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mypy-sarif
          path: .sarif/mypy.sarif
          if-no-files-found: warn

  security:
    name: Verify (security audit py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ref-resolution checks ask git whether a tag or branch exists
          # (README Action pin D25, tests/docs/support.py). A shallow fetch
          # has neither, so they answer "no" on PR builds while passing on
          # tag builds. Full history is what makes those answers truthful.
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap
        with:
          python-version: ${{ matrix.python }}
      - name: bandit + pip-audit (OSV.dev)
        env:
          BANDIT_JSON: .sarif/bandit.json
        run: |
          mkdir -p .sarif
          make security
      - name: Convert bandit SARIF
        if: always() && matrix.python == '3.14'
        env:
          UV_PROJECT_ENVIRONMENT: .venv-dev
        run: uv run python scripts/native_output_to_sarif.py bandit .sarif/bandit.json .sarif/bandit.sarif
      - name: Upload bandit SARIF
        if: always() && matrix.python == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bandit-sarif
          path: .sarif/bandit.sarif
          if-no-files-found: warn

  integration:
    name: Verify (integration py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ref-resolution checks ask git whether a tag or branch exists
          # (README Action pin D25, tests/docs/support.py). A shallow fetch
          # has neither, so they answer "no" on PR builds while passing on
          # tag builds. Full history is what makes those answers truthful.
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap
        with:
          python-version: ${{ matrix.python }}
      - name: Integration suite (self-skips without live secrets)
        run: make test-integration

  mutation-advisory:
    name: Verify (mutation advisory py3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap
        with:
          python-version: "3.14"
      - name: Decision-module mutation harness (advisory)
        env:
          MUTATION_ESCAPE_THRESHOLD_PCT: "45"
        run: make mutation-test-decisions
