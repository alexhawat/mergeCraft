# SPDX-License-Identifier: MIT
# Lean post-merge delivery (adapted from sevn; no mergecraft review job).
# W8 supply chain: build once → SBOM+scan → cosign+attest → promote digests
# (no second rebuild of :latest / :analyzers). Dependabot owns action SHA bumps.
name: CI/CD

on:
  push:
    branches: [main, pre-0.0.1, "release/**"]
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: no top-level write; each job declares its own permissions.
permissions: {}

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_SLIM: ghcr.io/alexhawat/mergecraft
  IMAGE_ANALYZERS: ghcr.io/alexhawat/mergecraft

jobs:
  verify:
    name: Full verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bootstrap
      - name: make ci
        run: make ci

  e2e-gate:
    name: Action-image E2E (release gate)
    needs: verify
    # Required: the top-level `permissions: {}` grants this job nothing, and a
    # called workflow may not request more than its caller holds. `e2e.yml`
    # declares `contents: read`, so without this the whole run is rejected
    # before any job starts (startup_failure), release included.
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  build-dist:
    name: Build Python dist
    needs: verify
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bootstrap
      - name: uv build
        run: uv build
      - name: Upload Python dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifact-python-dist
          path: dist/*
          if-no-files-found: error

  # W8.3 — build once; push immutable SHA tags only; capture digests for promote.
  build-images:
    name: Build GHCR images (once)
    needs: [verify, e2e-gate]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/pre-0.0.1' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      slim_digest: ${{ steps.build-slim.outputs.digest }}
      analyzers_digest: ${{ steps.build-analyzers.outputs.digest }}
      slim_ref: ${{ steps.meta.outputs.slim_ref }}
      analyzers_ref: ${{ steps.meta.outputs.analyzers_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image refs
        id: meta
        run: |
          set -euo pipefail
          echo "slim_ref=${IMAGE_SLIM}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "analyzers_ref=${IMAGE_ANALYZERS}:analyzers-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and push slim (SHA tag only)
        id: build-slim
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE_SLIM }}:${{ github.sha }}
          cache-from: type=gha,scope=mergeCraft-slim
          cache-to: type=gha,mode=max,scope=mergeCraft-slim
      - name: Build and push analyzers (SHA tag only)
        id: build-analyzers
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.analyzers
          push: true
          tags: ${{ env.IMAGE_ANALYZERS }}:analyzers-${{ github.sha }}
          cache-from: type=gha,scope=mergeCraft-analyzers
          cache-to: type=gha,mode=max,scope=mergeCraft-analyzers

  # W8.4 — SBOM (syft) + vulnerability scan (trivy); gate on release branches/tags.
  sbom-scan:
    name: SBOM + vulnerability scan
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject expired .trivyignore waivers
        run: python3 scripts/check_trivyignore_expiry.py
      - name: Resolve scan gate
        id: gate
        run: |
          set -euo pipefail
          # Invariant: every ref that reaches sbom-scan can publish a digest (see
          # build-images.if and promote.if) — all are blocking, not advisory.
          echo "exit_code=1" >> "$GITHUB_OUTPUT"
          echo "severity=CRITICAL,HIGH" >> "$GITHUB_OUTPUT"
      - name: SBOM slim (syft via anchore/sbom-action)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ needs.build-images.outputs.slim_ref }}
          format: spdx-json
          output-file: sbom-slim.spdx.json
          upload-artifact: false
      - name: SBOM analyzers (syft via anchore/sbom-action)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ needs.build-images.outputs.analyzers_ref }}
          format: spdx-json
          output-file: sbom-analyzers.spdx.json
          upload-artifact: false
      - name: Trivy scan slim
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.build-images.outputs.slim_ref }}
          format: sarif
          output: trivy-slim.sarif
          severity: ${{ steps.gate.outputs.severity }}
          exit-code: ${{ steps.gate.outputs.exit_code }}
          ignore-unfixed: true
          trivyignores: .trivyignore
      - name: Trivy scan analyzers
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.build-images.outputs.analyzers_ref }}
          format: sarif
          output: trivy-analyzers.sarif
          severity: ${{ steps.gate.outputs.severity }}
          exit-code: ${{ steps.gate.outputs.exit_code }}
          ignore-unfixed: true
          trivyignores: .trivyignore
      - name: Upload SBOM + scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-scan-reports
          path: |
            sbom-slim.spdx.json
            sbom-analyzers.spdx.json
            trivy-slim.sarif
            trivy-analyzers.sarif
          if-no-files-found: warn

  # W8.5 — cosign keyless sign + build-provenance + SBOM attestation (same digests).
  sign-attest:
    name: Sign and attest digests
    needs: [build-images, sbom-scan]
    runs-on: ubuntu-latest
    # Sigstore/rekor occasionally times out; retries below absorb transient outages.
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Cosign sign slim
        run: |
          set -euo pipefail
          ref="${IMAGE_SLIM}@${{ needs.build-images.outputs.slim_digest }}"
          for attempt in 1 2 3; do
            if cosign sign --yes "$ref"; then
              exit 0
            fi
            echo "cosign sign slim failed (attempt ${attempt}/3); retrying in 15s…" >&2
            sleep 15
          done
          echo "cosign sign slim failed after retries" >&2
          exit 1
      - name: Cosign sign analyzers
        run: |
          set -euo pipefail
          ref="${IMAGE_ANALYZERS}@${{ needs.build-images.outputs.analyzers_digest }}"
          for attempt in 1 2 3; do
            if cosign sign --yes "$ref"; then
              exit 0
            fi
            echo "cosign sign analyzers failed (attempt ${attempt}/3); retrying in 15s…" >&2
            sleep 15
          done
          echo "cosign sign analyzers failed after retries" >&2
          exit 1
      - name: Attest build provenance (slim)
        id: attest-provenance-slim
        continue-on-error: true
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE_SLIM }}
          subject-digest: ${{ needs.build-images.outputs.slim_digest }}
          push-to-registry: true
      - name: Attest build provenance (slim) retry
        if: steps.attest-provenance-slim.outcome == 'failure'
        id: attest-provenance-slim-retry
        continue-on-error: true
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE_SLIM }}
          subject-digest: ${{ needs.build-images.outputs.slim_digest }}
          push-to-registry: true
      - name: Attest build provenance (analyzers)
        id: attest-provenance-analyzers
        continue-on-error: true
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE_ANALYZERS }}
          subject-digest: ${{ needs.build-images.outputs.analyzers_digest }}
          push-to-registry: true
      - name: Attest build provenance (analyzers) retry
        if: steps.attest-provenance-analyzers.outcome == 'failure'
        id: attest-provenance-analyzers-retry
        continue-on-error: true
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE_ANALYZERS }}
          subject-digest: ${{ needs.build-images.outputs.analyzers_digest }}
          push-to-registry: true
      - name: Download SBOM + scan reports
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: image-scan-reports
          path: reports
      - name: Attest SBOM (slim)
        id: attest-sbom-slim
        continue-on-error: true
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-name: ${{ env.IMAGE_SLIM }}
          subject-digest: ${{ needs.build-images.outputs.slim_digest }}
          sbom-path: reports/sbom-slim.spdx.json
          push-to-registry: true
      - name: Attest SBOM (slim) retry
        if: steps.attest-sbom-slim.outcome == 'failure'
        id: attest-sbom-slim-retry
        continue-on-error: true
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-name: ${{ env.IMAGE_SLIM }}
          subject-digest: ${{ needs.build-images.outputs.slim_digest }}
          sbom-path: reports/sbom-slim.spdx.json
          push-to-registry: true
      - name: Attest SBOM (analyzers)
        id: attest-sbom-analyzers
        continue-on-error: true
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-name: ${{ env.IMAGE_ANALYZERS }}
          subject-digest: ${{ needs.build-images.outputs.analyzers_digest }}
          sbom-path: reports/sbom-analyzers.spdx.json
          push-to-registry: true
      - name: Attest SBOM (analyzers) retry
        if: steps.attest-sbom-analyzers.outcome == 'failure'
        id: attest-sbom-analyzers-retry
        continue-on-error: true
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-name: ${{ env.IMAGE_ANALYZERS }}
          subject-digest: ${{ needs.build-images.outputs.analyzers_digest }}
          sbom-path: reports/sbom-analyzers.spdx.json
          push-to-registry: true
      - name: Require Sigstore attestations
        if: always()
        run: |
          set -euo pipefail
          failed=0
          check() {
            local label="$1" first="$2" retry="$3"
            if [[ "$first" == "success" || "$retry" == "success" ]]; then
              return 0
            fi
            echo "::error title=Sigstore attestation failed::${label} failed after retry (rekor.sigstore.dev may have timed out)." >&2
            failed=1
          }
          check "build provenance (slim)" "${{ steps.attest-provenance-slim.outcome }}" "${{ steps.attest-provenance-slim-retry.outcome }}"
          check "build provenance (analyzers)" "${{ steps.attest-provenance-analyzers.outcome }}" "${{ steps.attest-provenance-analyzers-retry.outcome }}"
          check "SBOM (slim)" "${{ steps.attest-sbom-slim.outcome }}" "${{ steps.attest-sbom-slim-retry.outcome }}"
          check "SBOM (analyzers)" "${{ steps.attest-sbom-analyzers.outcome }}" "${{ steps.attest-sbom-analyzers-retry.outcome }}"
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi

  # W8.3 — promote mutable tags by retagging the signed digests (no rebuild).
  promote:
    name: Promote digests to mutable tags
    needs: [build-images, sign-attest]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/pre-0.0.1' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # :latest / :analyzers are the production mutable tags — main only. A
      # pre-release branch build must never win that race against main's own
      # build just by finishing later (both had independent per-ref
      # concurrency groups and no ordering guarantee between them). Actual
      # version releases retag :latest separately via Craft (.craft.yml,
      # triggered off refs/tags/v*), which is a distinct promotion path, not
      # this branch-push one.
      - name: Retag slim digest → :latest
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_SLIM}:latest" \
            "${IMAGE_SLIM}@${{ needs.build-images.outputs.slim_digest }}"
      - name: Retag analyzers digest → :analyzers
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_ANALYZERS}:analyzers" \
            "${IMAGE_ANALYZERS}@${{ needs.build-images.outputs.analyzers_digest }}"
      # pre-0.0.1 (the active pre-release/staging branch) gets its own mutable
      # channel instead, so pre-release testers have a moving tag to pull
      # without ever touching the production :latest / :analyzers.
      - name: Retag slim digest → :rc
        if: github.ref == 'refs/heads/pre-0.0.1'
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_SLIM}:rc" \
            "${IMAGE_SLIM}@${{ needs.build-images.outputs.slim_digest }}"
      - name: Retag analyzers digest → :analyzers-rc
        if: github.ref == 'refs/heads/pre-0.0.1'
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_ANALYZERS}:analyzers-rc" \
            "${IMAGE_ANALYZERS}@${{ needs.build-images.outputs.analyzers_digest }}"
      - name: Record digests for Craft SHA→version retag
        run: |
          set -euo pipefail
          cat <<EOF
          slim digest:       ${{ needs.build-images.outputs.slim_digest }}
          analyzers digest:  ${{ needs.build-images.outputs.analyzers_digest }}
          slim SHA tag:      ${{ needs.build-images.outputs.slim_ref }}
          analyzers SHA tag: ${{ needs.build-images.outputs.analyzers_ref }}

          Craft publish (.craft.yml) retags {{{revision}}} → {{{version}}} /
          :latest / :analyzers-* from these same digests — no rebuild.
          EOF
