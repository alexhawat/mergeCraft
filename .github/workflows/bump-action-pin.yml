# SPDX-License-Identifier: MIT
# The S -> D -> C -> P pin cycle (#641). It is two commits and they cannot be
# one PR: the consumer pin P must name manifest commit C, and C's SHA is not
# known until it merges. This workflow automates C and prepares P for a human.
#
#   stage=manifest  Resolve main's tip as source S, verify the published image D
#                   against GHCR, run `make action-manifest-prepare`, and push
#                   the one-line action.yml change on a branch. This stage can
#                   push — action.yml is not a workflow file, so the job's
#                   `contents: write` scope is sufficient.
#   stage=pin       Given the merged MANIFEST_COMMIT, run `make
#                   action-pin-prepare`, verify and rewrite the four consumer
#                   references, keep the preparation in the runner, and print
#                   the exact local command for a human to land.
#
# stage=pin cannot push, by construction. It must edit `.github/workflows/
# mergecraft.yml`, and GitHub refuses a GITHUB_TOKEN push that touches
# `.github/workflows/`:
#
#   (refusing to allow a GitHub App to create or update workflow
#    `.github/workflows/mergecraft.yml` without `workflows` permission)
#
# `workflows` is not a GITHUB_TOKEN `permissions:` scope, so adding it to the
# block changes nothing; and a `uses:` reference cannot read a variable, so the
# rungs must carry literal SHAs. Advertising a push GitHub rejects would fail at
# the last step after looking like it worked, so this stage documents the manual
# step instead. No PAT is introduced to route around it.
#
# The manifest branch is left for a human too: a PR opened with GITHUB_TOKEN
# does not trigger `pull_request` workflows, so it would arrive carrying zero
# required checks — the pin is exactly the change that must not merge unchecked.
#
# What this removes is the error-prone part, not the judgement: resolving the
# digest, keeping S/D/C consistent, and retyping 40-hex SHAs by hand. Merging
# stays manual, and manifest PRs must be merged with a merge commit — a squash
# orphans C and leaves nothing for P to name (#684).
name: Bump action pin

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "manifest = commit C (action.yml digest); pin = commit P (consumer references)"
        required: true
        default: manifest
        type: choice
        options:
          - manifest
          - pin
      manifest_commit:
        description: >-
          stage=pin only. The 40-hex SHA that manifest commit C actually landed
          as on main — not the PR's merge commit, which differs from the image
          source in more than action.yml and is rejected by verify_manifest.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: bump-action-pin
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - uses: ./.github/actions/bootstrap
        with:
          python-version: "3.14"

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      # stage=manifest only. The pin stage must not resolve from main's tip: by
      # then main has advanced to the manifest PR's own merge commit, which is
      # never the source the image was built from, so this always resolved an
      # empty digest and failed. It is redundant there anyway —
      # `action-pin-prepare` runs verify_manifest(manifest_commit) internally,
      # which verifies the digest against GHCR for the correct source.
      - name: Resolve and verify the published image
        id: image
        if: inputs.stage == 'manifest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          echo "source=$source_sha" >> "$GITHUB_OUTPUT"
          echo "short=${source_sha:0:8}" >> "$GITHUB_OUTPUT"
          # Fails closed when the image for this source is missing or unsigned,
          # so a stage that cannot produce a verifiable manifest stops here
          # rather than committing a digest nobody checked.
          resolved="$(SOURCE_REVISION="$source_sha" make action-images-resolve | tail -n 1)"
          echo "$resolved"
          digest="$(printf '%s' "$resolved" | python3 -c 'import json,sys; print(json.load(sys.stdin)["slim_digest"])')"
          if [ -z "$digest" ]; then
            echo "::error::no published slim image for $source_sha — wait for CI/CD to finish"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Prepare the change
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ inputs.stage }}
          MANIFEST_COMMIT: ${{ inputs.manifest_commit }}
          SOURCE_REVISION: ${{ steps.image.outputs.source }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SHORT: ${{ steps.image.outputs.short }}
          # Empty for stage=pin, where the source is derived from the manifest
          # commit by action-pin-prepare rather than from main's tip.
        run: |
          set -euo pipefail
          if [ "$STAGE" = "manifest" ]; then
            branch="chore/action-manifest-$SHORT"
            make action-manifest-prepare
            # Keep the Conventional-Commit subject inside the 72-character cap;
            # the full 64-hex digest would make it 111 characters.
            digest_short="${IMAGE_DIGEST#sha256:}"
            title="chore(action): prepare verified image manifest ${digest_short:0:8}"
          else
            if [ -z "$MANIFEST_COMMIT" ]; then
              echo "::error::stage=pin requires manifest_commit (the SHA C landed as on main)"
              exit 1
            fi
            branch="chore/action-pin-${MANIFEST_COMMIT:0:8}"
            RELEASE_BASE_BRANCH=main make action-pin-prepare
            title="chore(action): pin self-review to verified manifest ${MANIFEST_COMMIT:0:8}"
          fi
          if git diff --quiet; then
            echo "::error::nothing to commit — the change is already present on main"
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      # stage=manifest only. Only C can be pushed: stage=pin rewrites
      # `.github/workflows/` files, which GitHub refuses to accept from a
      # GITHUB_TOKEN push.
      - name: Push the branch
        if: inputs.stage == 'manifest'
        env:
          BRANCH: ${{ steps.prepare.outputs.branch }}
          TITLE: ${{ steps.prepare.outputs.title }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "$TITLE"
          git push origin "$BRANCH"

      - name: Summarise the next step
        env:
          BRANCH: ${{ steps.prepare.outputs.branch }}
          TITLE: ${{ steps.prepare.outputs.title }}
          STAGE: ${{ inputs.stage }}
          MANIFEST_COMMIT: ${{ inputs.manifest_commit }}
          SOURCE_REVISION: ${{ steps.image.outputs.source }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            if [ "$STAGE" = "manifest" ]; then
              echo "### Branch pushed: \`$BRANCH\` (manifest C)"
            else
              echo "### Prepared locally — no push (pin P)"
            fi
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| stage | \`$STAGE\` |"
            if [ -n "$SOURCE_REVISION" ]; then
              echo "| source S | \`$SOURCE_REVISION\` |"
              echo "| image D | \`$IMAGE_DIGEST\` |"
            else
              echo "| manifest C | \`$MANIFEST_COMMIT\` |"
            fi
            echo
            if [ "$STAGE" = "manifest" ]; then
              echo "Open the PR yourself — a GITHUB_TOKEN-opened PR carries no required checks:"
              echo
              echo '```bash'
              echo "gh pr create --base main --head $BRANCH --title \"$TITLE\""
              echo '```'
              echo
              echo "**Merge it with a merge commit, not a squash** — a squash orphans the"
              echo "manifest commit and leaves nothing for the pin stage to name (#684)."
              echo "Then re-run this workflow with \`stage=pin\` and that commit's SHA."
            else
              echo "No branch was pushed and no PR was opened, because this stage cannot"
              echo "push. Run the exact preparation in a clean isolated worktree, then"
              echo "review and merge it yourself:"
              echo
              echo '```bash'
              echo "MANIFEST_COMMIT=$MANIFEST_COMMIT RELEASE_BASE_BRANCH=main make action-pin-prepare"
              echo '```'
              echo
              echo "The worktree must be clean: \`_prepared_state\` rejects **any** untracked"
              echo "file, not just the files it expects to change, and it also rejects staged"
              echo "or mode-changing edits. An untracked scratch file in the checkout is"
              echo "enough for the preparation to refuse."
              echo
              echo "**Why the push cannot happen here.** The pin rewrites the \`uses:\` rungs"
              echo "and \`MERGECRAFT_ACTION_SHA\` in \`.github/workflows/mergecraft.yml\`, and"
              echo "GitHub refuses a \`GITHUB_TOKEN\` push that touches \`.github/workflows/\`:"
              echo
              echo '```'
              echo "(refusing to allow a GitHub App to create or update workflow"
              echo " \`.github/workflows/mergecraft.yml\` without \`workflows\` permission)"
              echo '```'
              echo
              echo "\`workflows\` is not a \`GITHUB_TOKEN\` \`permissions:\` scope, so widening the"
              echo "block changes nothing, and a \`uses:\` reference cannot read a variable, so"
              echo "the rungs must carry literal SHAs. This stage does everything it can — it"
              echo "runs \`verify_manifest\`, rewrites the four references and shows the diff —"
              echo "and stops where GitHub stops it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
