# SPDX-License-Identifier: MIT
# Automates the self-review Action pin bump (#450/#526/#532/#562) that used
# to be a hand-run, error-prone checklist: rewrite MERGECRAFT_ACTION_SHA +
# three uses: rungs in mergecraft.yml, rewrite action.yml's runs.image digest,
# and keep both consistent — splitting those two edits across separate PRs is
# exactly what turned five checks red at once on PR #562.
#
# === ORDER MATTERS — read this before running it ===
# Bump `pre-0.0.1`'s own pin to `pre-0.0.1`'s own tip FIRST (this workflow's
# default: `base_branch: pre-0.0.1`, `sha` left blank so it resolves that same
# branch's tip). Only AFTER that bump has merged into `pre-0.0.1` should
# `pre-0.0.1` be promoted into `main` (an ordinary merge/PR — not this
# workflow). Reversing the order — promoting to `main` first, then pinning
# main's merge commit — measured a staleness lag of 35 src-touching commits
# against `check_action_pin_freshness.py`'s ceiling of 5 (MAX_PRODUCT_LAG) and
# deadlocked `main` with no path to green: the only fix (bump the pin) needs
# an image that only publishes after `Full verify` passes, which cannot pass
# while the pin is this stale. Pinning `pre-0.0.1` to its own tip first
# measured a lag of 0. See docs/workflows.md "Action pin and evidence
# artifacts" for the full account.
#
# Why this doesn't build the image itself: it calls
# ensure-action-slim-image.yml (the same reusable workflow ci.yml's
# `action-slim-bootstrap` job calls) rather than re-implementing "build a
# Dockerfile, push it to GHCR" a second time — one body, two callers.
#
# Why this pushes a branch and stops, rather than opening a PR: a PR opened
# with the default GITHUB_TOKEN does not trigger `pull_request` workflows
# (a deliberate GitHub anti-recursion rule), so a bot-opened PR here would
# carry zero required checks and could never satisfy branch protection. A
# human opens the PR from the pushed branch instead — see the job summary
# this workflow writes, and docs/workflows.md. This restriction lifts once
# issue #550's GitHub App exists: an App-authored PR *does* trigger
# `pull_request` workflows, so a future revision of this job could open the
# PR itself once an App token is available here the way mergecraft.yml and
# mergecraft-approve.yml already prefer one. No PAT is used to work around
# this in the meantime — see that issue's discussion of why a PAT is not an
# acceptable substitute for either problem it would nominally solve.
name: Bump action pin

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: >-
          Branch whose own workflow pin gets bumped, and that the pushed
          branch is based on / will be PR'd against. Follow the ORDER note
          above: bump pre-0.0.1 to its own tip before ever promoting to main.
        required: false
        default: pre-0.0.1
      sha:
        description: >-
          Full 40-hex commit SHA to pin. Leave blank to resolve base_branch's
          own current tip (the common case — see the ORDER note above).
        required: false
        default: ""

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve target SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.base_branch }}
          # Read-only job — no push happens here, so don't leave the token
          # sitting in .git/config (unlike the `bump` job below, which needs
          # it for `git push`).
          persist-credentials: false
      - name: Resolve target SHA
        id: resolve
        env:
          INPUT_SHA: ${{ inputs.sha }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_SHA}" ]; then
            SHA="${INPUT_SHA}"
            git cat-file -e "${SHA}^{commit}" || {
              echo "::error::sha input ${SHA} is not a commit reachable from this checkout" >&2
              exit 1
            }
          else
            SHA="$(git rev-parse HEAD)"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved target SHA: ${SHA} (base_branch=${BASE_BRANCH})"

  ensure-image:
    name: Ensure GHCR image exists
    needs: resolve
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ensure-action-slim-image.yml
    with:
      sha: ${{ needs.resolve.outputs.sha }}

  bump:
    name: Bump pin, verify, push branch
    needs: [resolve, ensure-image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Only contents: write — this job pushes a branch and nothing else. No
      # PAT, no App token: the default job token is sufficient for a branch
      # push, and (per the header comment) opening the PR is a human step.
      contents: write
    env:
      UV_PROJECT_ENVIRONMENT: .venv-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.base_branch }}
      - uses: ./.github/actions/bootstrap
      - name: Bump the pin
        id: bump
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          uv run python scripts/bump_action_pin.py "${SHA}" --ref HEAD
      - name: Verify — action pin freshness
        run: uv run python scripts/check_action_pin_freshness.py
      - name: Verify — action image digest
        run: uv run python scripts/check_action_image_digest.py
      - name: Create + push the bump branch
        id: branch
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          set -euo pipefail
          SHORT="${SHA:0:12}"
          BRANCH="bump-action-pin/${SHORT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- .github/workflows/mergecraft.yml action.yml; then
            echo "::notice::No changes after bump — pin was already current. Nothing to push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -b "${BRANCH}"
          git add .github/workflows/mergecraft.yml action.yml
          git commit \
            -m "chore(ci): bump self-review action pin to ${SHORT}" \
            -m "Bumped by the bump-action-pin workflow (base_branch=${BASE_BRANCH}, target sha=${SHA})."
          git push origin "HEAD:refs/heads/${BRANCH}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Summary
        if: always()
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          PUSHED: ${{ steps.branch.outputs.pushed }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          {
            echo "### Action pin bump"
            echo
            if [ "${PUSHED}" = "true" ]; then
              echo "Pushed \`${BRANCH}\` (target SHA \`${SHA}\`)."
              echo
              echo "**A human must open the PR** — a bot-pushed branch is deliberate here:"
              echo "a PR opened with the default \`GITHUB_TOKEN\` does not trigger"
              echo "\`pull_request\` workflows, so a bot-opened PR would carry zero required"
              echo "checks. Open a PR from \`${BRANCH}\` against \`${BASE_BRANCH}\` manually."
              echo
              echo "Remember the ORDER: only promote \`pre-0.0.1\` into \`main\` after this"
              echo "bump has merged into \`pre-0.0.1\` — never pin main's merge commit first."
            else
              echo "Pin was already current for \`${BASE_BRANCH}\` — nothing pushed."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
