# SPDX-License-Identifier: MIT
# The S -> D -> C -> P pin cycle (#641), end to end.
#
#   stage=manifest  Resolve main's tip as source S, verify the published image D
#                   against GHCR, run `make action-manifest-prepare`, push the
#                   one-line action.yml branch and open the manifest PR (C).
#   stage=pin       Given the merged manifest commit C, run `make
#                   action-pin-prepare`, push the consumer pin branch and open
#                   the pin PR (P). This stage fires automatically when the
#                   manifest PR merges, or by `workflow_dispatch`.
#
# Both stages push and open PRs with a GitHub App token rather than the job
# token. A `GITHUB_TOKEN` push cannot touch `.github/workflows/` (the pin
# rewrites `mergecraft.yml`), and a `GITHUB_TOKEN`-opened PR arrives with no
# required checks. The App needs `contents: write`, `pull_requests: write` and
# `workflows: write`; the secrets are the reviewer App's
# (`MERGECRAFT_APP_ID` / `MERGECRAFT_APP_PRIVATE_KEY`).
#
# What stays human: merging. The workflow never merges, never enables
# auto-merge and never uses `--admin`. Manifest and pin PRs must be merged with
# a merge commit, never a squash: a squashed manifest orphans C and leaves
# nothing for P to name (#684).
#
# The automatic stage only listens for a merged manifest PR from this
# repository; it never checks out or executes pull-request code (the checkout is
# `main`), so a fork cannot drive it.
name: Bump action pin

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "manifest = commit C (action.yml digest); pin = commit P (consumer references)"
        required: true
        default: manifest
        type: choice
        options:
          - manifest
          - pin
      manifest_commit:
        description: >-
          stage=pin only. The 40-hex SHA that the manifest PR landed as on main.
        required: false
        default: ""
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: bump-action-pin
  cancel-in-progress: false

jobs:
  prepare:
    # The automatic path speaks only for a merged manifest PR from this
    # repository whose head is the manifest branch this workflow creates.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'chore/action-manifest-'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      # The App token is the only identity that can push a workflow file and
      # whose opened PRs still run required checks.
      - name: Mint the App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.MERGECRAFT_APP_ID }}
          private-key: ${{ secrets.MERGECRAFT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-packages: read
          permission-pull-requests: write
          permission-workflows: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - uses: ./.github/actions/bootstrap
        with:
          python-version: "3.14"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # The manifest PR's head commit is C: its diff from the image source is
      # only action.yml. The merge commit is not C — it also carries whatever
      # main gained while the manifest PR was open, which verify_manifest
      # rejects (and a squash would orphan C entirely).
      - name: Resolve the stage and its inputs
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          INPUT_STAGE: ${{ inputs.stage }}
          INPUT_MANIFEST: ${{ inputs.manifest_commit }}
          MANIFEST_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            stage=pin
            manifest_commit="$MANIFEST_SHA"
          else
            stage="$INPUT_STAGE"
            manifest_commit="$INPUT_MANIFEST"
          fi
          if [ "$stage" = "pin" ] && [ -z "$manifest_commit" ]; then
            echo "::error::stage=pin needs the merged manifest commit"
            exit 1
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "manifest_commit=$manifest_commit" >> "$GITHUB_OUTPUT"

      # stage=manifest only. The pin stage must not resolve from main's tip: by
      # then main has advanced to the manifest PR's own merge commit, which is
      # never the source the image was built from. `action-pin-prepare` verifies
      # the manifest/digest pair internally there.
      - name: Resolve and verify the published image
        id: image
        if: steps.mode.outputs.stage == 'manifest'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          echo "source=$source_sha" >> "$GITHUB_OUTPUT"
          echo "short=${source_sha:0:8}" >> "$GITHUB_OUTPUT"
          # Fails closed when the image for this source is missing or unsigned,
          # so a stage that cannot produce a verifiable manifest stops here
          # rather than committing a digest nobody checked.
          resolved="$(SOURCE_REVISION="$source_sha" make action-images-resolve | tail -n 1)"
          echo "$resolved"
          digest="$(printf '%s' "$resolved" | python3 -c 'import json,sys; print(json.load(sys.stdin)["slim_digest"])')"
          if [ -z "$digest" ]; then
            echo "::error::no published slim image for $source_sha — wait for CI/CD to finish"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Prepare the change
        id: prepare
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STAGE: ${{ steps.mode.outputs.stage }}
          MANIFEST_COMMIT: ${{ steps.mode.outputs.manifest_commit }}
          SOURCE_REVISION: ${{ steps.image.outputs.source }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SHORT: ${{ steps.image.outputs.short }}
        run: |
          set -euo pipefail
          if [ "$STAGE" = "manifest" ]; then
            branch="chore/action-manifest-$SHORT"
            make action-manifest-prepare
            # Keep the Conventional-Commit subject inside the 72-character cap;
            # the full 64-hex digest would make it 111 characters.
            digest_short="${IMAGE_DIGEST#sha256:}"
            title="chore(action): prepare verified image manifest ${digest_short:0:8}"
          else
            branch="chore/action-pin-${MANIFEST_COMMIT:0:8}"
            RELEASE_BASE_BRANCH=main make action-pin-prepare
            title="chore(action): pin self-review to verified manifest ${MANIFEST_COMMIT:0:8}"
          fi
          if git diff --quiet; then
            echo "::error::nothing to commit — the change is already present on main"
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Push the branch
        env:
          BRANCH: ${{ steps.prepare.outputs.branch }}
          TITLE: ${{ steps.prepare.outputs.title }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "$TITLE"
          # This workflow owns the branch; a re-run after a partial failure
          # replaces it rather than failing on a non-fast-forward push.
          git push --force-with-lease origin "$BRANCH"

      - name: Open the pull request
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
          TITLE: ${{ steps.prepare.outputs.title }}
          STAGE: ${{ steps.mode.outputs.stage }}
          MANIFEST_COMMIT: ${{ steps.mode.outputs.manifest_commit }}
          SOURCE_REVISION: ${{ steps.image.outputs.source }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "$BRANCH" --state open --json url -q '.[0].url // empty')"
          if [ -n "$existing" ]; then
            echo "url=$existing" >> "$GITHUB_OUTPUT"
            echo "reused=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          body_file="$(mktemp)"
          {
            echo "## What"
            echo
            if [ "$STAGE" = "manifest" ]; then
              echo "Points \`action.yml\` at the signed slim image built from \`$SOURCE_REVISION\` (\`$IMAGE_DIGEST\`). Only \`action.yml\` changes. This is the manifest commit (C) the consumer pin will reference."
            else
              echo "Pins the self-review Action to \`$MANIFEST_COMMIT\`, the merged manifest commit. \`MERGECRAFT_ACTION_SHA\` and the three \`uses:\` review rungs move together."
            fi
            echo
            echo "## Merge"
            echo
            echo "Merge with a **merge commit**, not a squash."
            if [ "$STAGE" = "manifest" ]; then
              echo "Do not merge any product-side PR between this and the pin PR."
            fi
            echo
            echo "Opened by the pin-cycle workflow; the merge stays human."
          } > "$body_file"
          url="$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$body_file")"
          rm -f "$body_file"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summarise the next step
        env:
          BRANCH: ${{ steps.prepare.outputs.branch }}
          STAGE: ${{ steps.mode.outputs.stage }}
          MANIFEST_COMMIT: ${{ steps.mode.outputs.manifest_commit }}
          SOURCE_REVISION: ${{ steps.image.outputs.source }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          {
            echo "### Stage \`$STAGE\` — \`$BRANCH\`"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| pull request | ${PR_URL:-already open} |"
            if [ -n "$SOURCE_REVISION" ]; then
              echo "| source S | \`$SOURCE_REVISION\` |"
              echo "| image D | \`$IMAGE_DIGEST\` |"
            else
              echo "| manifest C | \`$MANIFEST_COMMIT\` |"
            fi
            echo
            echo "**Merge it with a merge commit, not a squash.**"
            if [ "$STAGE" = "manifest" ]; then
              echo "When it merges, this workflow opens the pin PR automatically;"
              echo "hold product-side merges until that pin PR lands."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
