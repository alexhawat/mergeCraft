# SPDX-License-Identifier: MIT
# Action-image E2E gate + compatibility matrix (W11 / #3 / #36 / D6).
#
# PR job: build the production image from the PR, docker-run the Action against
# fixture event payloads with a fake provider CLI shim (no live LLMs), assert
# structured result + check-run shape, then run the W4 adversarial suite
# inside the built image (the real containment boundary).
#
# Nightly / workflow_dispatch: same security slice, plus a secrets-gated live
# slice. With no live model configured it emits a warning and records the
# result as unavailable in the step summary; a configured-but-broken run fails.
name: E2E

on:
  pull_request:
    branches: [main, pre-0.0.1]
  schedule:
    # Nightly broad + live-provider slice (UTC).
    - cron: "17 5 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      required-security:
        description: Run the required image security slice for a release caller
        required: false
        default: false
        type: boolean
      ref:
        description: Git ref under test (defaults to the caller ref)
        required: false
        type: string
      sha:
        description: Commit SHA under test (defaults to the caller SHA)
        required: false
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false

permissions:
  contents: read

concurrency:
  # Include event_name so a workflow_call release gate (ci-cd push/tag) does not
  # cancel a simultaneous standalone PR e2e run that shares github.ref.
  group: e2e-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  E2E_IMAGE: mergecraft:e2e
  E2E_MOCK_PORT: "8765"
  E2E_CHECK_RUNS_DIR: docker/e2e/fixtures/check-runs/live

jobs:
  e2e-pr:
    name: Action-image E2E (PR / security slice)
    if: inputs.required-security || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build production image (PR artifact)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.E2E_IMAGE }}
          cache-from: type=gha,scope=mergeCraft-e2e
          cache-to: type=gha,mode=max,scope=mergeCraft-e2e

      - name: Prepare E2E helpers
        run: |
          mkdir -p "${E2E_CHECK_RUNS_DIR}"
          chmod +x docker/e2e/run_action_e2e.sh \
            docker/e2e/run_in_image_adversarial.sh \
            docker/e2e/fake-provider-cli/*

      - name: Start mock GitHub API
        run: |
          python3 docker/e2e/mock_github_api.py \
            --host 0.0.0.0 \
            --port "${E2E_MOCK_PORT}" \
            --check-runs-dir "${E2E_CHECK_RUNS_DIR}" \
            --ready-file /tmp/mock-github-ready &
          echo "MOCK_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            if [[ -f /tmp/mock-github-ready ]]; then
              break
            fi
            sleep 0.2
          done
          test -f /tmp/mock-github-ready

      - name: Action E2E — pull_request fixture
        env:
          E2E_GITHUB_API_URL: http://host.docker.internal:${{ env.E2E_MOCK_PORT }}
        run: |
          rm -f "${E2E_CHECK_RUNS_DIR}"/*.json
          docker/e2e/run_action_e2e.sh "${E2E_IMAGE}" pull_request

      - name: Action E2E — pull_request_target fixture
        env:
          E2E_GITHUB_API_URL: http://host.docker.internal:${{ env.E2E_MOCK_PORT }}
        run: |
          rm -f "${E2E_CHECK_RUNS_DIR}"/*.json
          docker/e2e/run_action_e2e.sh "${E2E_IMAGE}" pull_request_target

      - name: In-image W4 adversarial suite (shell × push)
        run: docker/e2e/run_in_image_adversarial.sh "${E2E_IMAGE}"

      - name: Stop mock GitHub API
        if: always()
        run: |
          if [[ -n "${MOCK_PID:-}" ]]; then
            kill "${MOCK_PID}" 2>/dev/null || true
          fi

  e2e-nightly:
    name: Action-image E2E (nightly / broad + live)
    if: ${{ !inputs.required-security && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Codex rotates the ChatGPT session's refresh token during use, so two
    # concurrent runs sharing one credential can retire each other's session.
    # Serialize this job against other consumers of the same subscription.
    concurrency:
      group: codex-subscription-auth
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.E2E_IMAGE }}
          cache-from: type=gha,scope=mergeCraft-e2e
          cache-to: type=gha,mode=max,scope=mergeCraft-e2e

      - name: Prepare E2E helpers
        run: |
          mkdir -p "${E2E_CHECK_RUNS_DIR}"
          chmod +x docker/e2e/run_action_e2e.sh \
            docker/e2e/run_in_image_adversarial.sh \
            docker/e2e/fake-provider-cli/*

      - name: Security slice (fixture + fake CLI)
        env:
          E2E_GITHUB_API_URL: http://host.docker.internal:${{ env.E2E_MOCK_PORT }}
        run: |
          python3 docker/e2e/mock_github_api.py \
            --host 0.0.0.0 \
            --port "${E2E_MOCK_PORT}" \
            --check-runs-dir "${E2E_CHECK_RUNS_DIR}" \
            --ready-file /tmp/mock-github-ready &
          MOCK_PID=$!
          for _ in $(seq 1 30); do
            [[ -f /tmp/mock-github-ready ]] && break
            sleep 0.2
          done
          rm -f "${E2E_CHECK_RUNS_DIR}"/*.json
          docker/e2e/run_action_e2e.sh "${E2E_IMAGE}" pull_request
          rm -f "${E2E_CHECK_RUNS_DIR}"/*.json
          docker/e2e/run_action_e2e.sh "${E2E_IMAGE}" pull_request_target
          docker/e2e/run_in_image_adversarial.sh "${E2E_IMAGE}"
          kill "${MOCK_PID}" 2>/dev/null || true

      - name: Live installed-harness smoke (explicit model required)
        env:
          MERGECRAFT_E2E_LIVE_MODEL: ${{ vars.MERGECRAFT_E2E_LIVE_MODEL }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${MERGECRAFT_E2E_LIVE_MODEL:-}" ]]; then
            message="live slice unavailable: set MERGECRAFT_E2E_LIVE_MODEL to enable the bounded real-harness smoke"
            echo "::warning title=Live slice unavailable::${message}"
            echo "${message}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "${MERGECRAFT_E2E_LIVE_MODEL}" in
            openai/*)
              # The ChatGPT/Codex subscription credential outranks the API key:
              # both reach the same Codex harness inside the image.
              if [[ -n "${CODEX_AUTH_JSON:-}" ]]; then
                credential_name=CODEX_AUTH_JSON
              else
                credential_name=OPENAI_API_KEY
              fi
              ;;
            anthropic/*) credential_name=ANTHROPIC_API_KEY ;;
            google/*|gemini/*) credential_name=GEMINI_API_KEY ;;
            *) echo "unsupported live-smoke provider" >&2; exit 2 ;;
          esac
          if [[ -z "${!credential_name:-}" ]]; then
            echo "missing credential for the selected live-smoke provider" >&2
            exit 2
          fi
          # The helper requires a real accepted terminal review. Missing credentials,
          # provider failure or timeout fails the step; --help is not acceptance.
          # Only the credential's *name* is passed in; its value never rides argv.
          run_log="$(mktemp)"
          set +e
          docker run --rm --user 10001:10001 \
            --entrypoint /opt/mergecraft/.venv/bin/python \
            -e HOME=/home/mergecraft -e XDG_CACHE_HOME=/home/mergecraft/.cache \
            -e MERGECRAFT_E2E_LIVE_MODEL -e "${credential_name}" \
            -v "$PWD/scripts/live_image_smoke.py:/smoke.py:ro" \
            "${E2E_IMAGE}" /smoke.py 2>&1 | tee "$run_log"
          status="${PIPESTATUS[0]}"
          set -e
          if [[ "${status}" -ne 0 ]]; then
            # An expired or rejected subscription credential is not a product
            # failure: name it unable to run, so a red night is not misread as a
            # review defect. Recovery: re-mint with `mergecraft auth codex`.
            if grep -Eqi 'refresh token|invalid_grant|401' "$run_log"; then
              echo "::error title=Live slice unavailable::unavailable credential — the Codex subscription credential was rejected or expired; re-mint it with 'mergecraft auth codex'"
            else
              echo "::error title=Live slice failed::the live harness smoke did not produce an accepted terminal review" >&2
            fi
            exit "${status}"
          fi
