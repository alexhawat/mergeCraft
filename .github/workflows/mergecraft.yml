# mergeCraft PR review (BYOK; https://github.com/alexhawat/mergeCraft).
#
# === THIS IS THE mergeCraft REPO'S OWN CONSUMER WORKFLOW ===
# Mirrored from https://raw.githubusercontent.com/sevn-bot/sevn/main/.github/workflows/mergecraft.yml
# (the workflow that actually runs in sevn-bot/sevn). A reader should NOT
# confuse the two:
#   - sevn-bot/sevn/.github/workflows/mergecraft.yml — the live copy that runs
#     in the sevn-bot/sevn repo.
#   - THIS FILE — the mergeCraft repo's own self-review workflow, kept in
#     sync with the sevn copy so the cascade shape stays consistent.
# Edits land first here (and any future `MERGECRAFT_REF` Makefile rule in this
# repo, when added), then mirror to the sevn copy.
#
# Auto-reviews PRs on open / ready / new commits, posting inline comments
# plus a summary as github-actions[bot], and opt-in `mergecraft` /
# `mergecraft-approval` check-runs.
# The `approval-gate` job fails unless `mergecraft-approval` is a confirmed
# "success" (outstanding feedback, no check posted at all, and an unreachable
# check-runs API after retries all fail closed — see that job's step). It
# `needs:` the review-attempts job so Codex fallback can finish before the gate
# samples check-runs (#433).
#
# Provider priority: Tencent HY3 via the Nous Portal is primary; OpenAI
# (Codex) is the one-shot fallback when Nous is absent or its review posts no
# verdict; Anthropic (Claude) is the cross-vendor backstop when an earlier rung
# fails RETRYABLY (quota ceiling, timeout, transport death) without posting a
# verdict. The two fallbacks route on different signals on purpose — see the
# comments on each decide step.
#
# Codex reviews previously posted mergecraft-approval=neutral because every tool
# call failed with "MCP server 'mergecraft' was not ready for this step". Root
# cause was in mergeCraft, not Codex: its MCP endpoint answered the
# `notifications/initialized` NOTIFICATION with a JSON-RPC response object
# carrying `"id": null`, which Codex's rmcp client cannot deserialize — the
# transport worker quit fatally mid-handshake, so the server was never ready for
# the rest of the session. Fixed upstream in alexhawat/mergeCraft#78 (the
# endpoint now returns 202 with no body for notification-only POSTs).
#
# Tencent HY3 (`nous/tencent/hy3`) runs through the Nous Portal OpenAI-compatible
# endpoint via MERGECRAFT_CUSTOM_PROVIDER_BASE_URL + NOUS_API_KEY. It reaches
# mergeCraft's `opencode` harness, not the Codex one: mergeCraft routes any model
# whose provider isn't anthropic/openai/google/cursor to opencode
# (src/mergecraft/utils/agent_resolve.py resolve_runtime_agent()), and the Codex
# harness cannot stand in because Codex 0.146 dropped `wire_api = "chat"`
# ("no longer supported; set wire_api = \"responses\"") while Nous Portal serves
# only chat-completions. Both blockers are fixed upstream in
# alexhawat/mergeCraft#79 (closes #57 and #71): the image now installs
# `opencode-ai`, and the harness registers a custom OpenAI-compatible provider
# from MERGECRAFT_CUSTOM_PROVIDER_BASE_URL + MERGECRAFT_CUSTOM_PROVIDER_API_KEY.
# The provider id comes from the model prefix, so `nous/tencent/hy3` registers
# provider `nous` serving `tencent/hy3`.
#
# mergeCraft reads the native GITHUB_EVENT_PATH, so the workflow just passes a
# prompt — no ~mergecraft JSON payload needed.
#
# Auth (same-repo only — forks skip):
# - NOUS_API_KEY — Nous Portal API key — primary (Tencent HY3 via nous/tencent/hy3)
# - CODEX_AUTH_JSON — ChatGPT/Codex subscription (`mergecraft auth codex`) — fallback
# - OPENAI_API_KEY — OpenAI API key (same Codex harness as CODEX_AUTH_JSON)
# - CLAUDE_CODE_OAUTH_TOKEN — Claude Pro/Max subscription (`mergecraft auth claude`) — backstop
# - ANTHROPIC_API_KEY — Anthropic API key (same claude harness as CLAUDE_CODE_OAUTH_TOKEN)
# The job skips gracefully when none are set (e.g. fork PRs). Without
# NOUS_API_KEY the primary is inert and Codex is the only reviewer; without
# CODEX_AUTH_JSON / OPENAI_API_KEY, Nous is the only reviewer.
#
# Trigger: pull_request_target (not pull_request). GitHub skips pull_request
# workflows when refs/pull/N/merge cannot be built (merge conflicts), so the
# ruleset check require-mergecraft-review sits unreported for as long as the
# conflict lasts. pull_request_target always fires on synchronize even with
# merge conflicts, so the review still lands while the PR is conflicted.
#
# That gap is the conflicted window, not a permanent block: pushing the conflict
# fix to the PR branch fires synchronize and would clear a pull_request check
# too. It outlasts the conflict only when the conflict disappears WITHOUT a push
# to the head branch (the base moved), because nothing then re-triggers the run.
# A conflicted PR is unmergeable on its own account anyway, so weigh this
# against running with repository secrets in scope rather than treating it as
# decisive. Full rationale: README "Workflow-placement gotchas".
#
# Workflow resolution (GitHub Nov 2025 policy, effective 2025-12-08): pull_request_target
# definitions are read from the repository default branch (`main`), not the PR base.
# Therefore a PR that edits this file cannot review itself with its own changes;
# they take effect on the next PR after merge.
#
# The bootstrap `pull_request` trigger has been removed: running BOTH triggers made
# each synchronize fire two runs that resolved to the SAME concurrency group (see
# below) — with cancel-in-progress they cancelled each other, and a cancelled
# `mergecraft review` is a non-success on the required check. Do not re-add it.
#
# 2026-08-14 (PR #200): a same-repo `pull_request` trigger was tried here as a way
# to earn derive_trust_tier() == "trusted" for self-review (D14 gate 3) and got a
# same-day CHANGES_REQUESTED revert: `pull_request` resolves the workflow
# *definition* from the PR's own branch (unlike pull_request_target, which always
# reads it from the default branch), so that lane would have handed
# MERGECRAFT_REVIEWER_PAT, provider credentials, OIDC, and a write-scoped token to
# PR-controlled code — any same-repo collaborator could edit this file on their
# branch to self-approve or exfiltrate the PAT. Do not re-add a `pull_request`
# trigger to this workflow for that purpose. The actual fix lives in the sibling
# `mergecraft-approve.yml` workflow: a `workflow_run` trigger, which (like
# pull_request_target, and more unconditionally so) always resolves its
# definition from the default branch, runs on its own runner with no PR checkout
# at all, and — via `workflow_run.pull_requests` being empty for forks by
# GitHub's own documented behavior — naturally never fires for fork PRs. It only
# reads the already-posted `mergecraft-approval` check-run conclusion (a pure
# function of Finding severities, immune to the agent's own narrative) and, if
# it is "success", submits the PAT-backed APPROVE itself.
#
# Same-repo guard below keeps fork PRs from receiving secrets (prior pull_request
# behavior). mergeCraft uses checkout_pr + API with push/shell disabled — no
# PR-controlled scripts run in CI.
#
# Merge gate: ruleset `require-mergecraft-review` requires the **mergeCraft
# review** job check only — not the raw `mergecraft` completion check (which goes
# red on agent infra failures). That name is on the `approval-gate` job (which
# `needs:` review attempts); the attempts job is `mergecraft review attempts`.
# The gate fails closed on every non-success `mergecraft-approval` outcome (no
# fail-open path remains).
#
# === ACTION PIN ===
# The action is pinned to a FULL SHA on both review steps. This is MANDATORY,
# not a preference: enforcement expects every `uses:` ref for third-party
# actions to resolve to a full-length commit SHA. A branch ref like
# `@pre-0.0.1` is rejected at action-resolution time before the review step
# runs. When bumping the action in this repo, mirror the change to the
# corresponding step in the sevn-side workflow so the two stay in sync. If a
# future `MERGECRAFT_REF` parity rule is added to this repo's Makefile
# (modelled on sevn's `make mergecraft-ref-check`), bump the action SHA and
# `MERGECRAFT_REF` together there — a one-sided bump in this file is
# invisible to that gate.
# 2026-08-07: rolled back from 88c6f419 to 8d747f39 — Codex stdin hang regression. See PR #246.
# 2026-08-14: re-bumped to 0ab5388 (pre-0.0.1 tip), then to f951af0 (#186: action.yml
# load-breaking secrets.* expression in description text), then to a1c10ef (#190: setpriv
# never resets $HOME) — see the per-step comments below.
name: mergecraft

on:
  pull_request_target:
    # `pre-*` glob keeps every release-staging branch (pre-0.0.1, pre-0.0.2, …)
    # auto-reviewed without editing this list each cut (matches the old
    # .coderabbit.yaml `pre-.*` coverage).
    branches: [main, develop, test-pre, "pre-*"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt for the agent (workflow_dispatch only)
        required: false
        type: string

permissions:
  contents: read

env:
  # Single per-attempt review budget (D8 / #465). Nous + Codex steps and the
  # review job timeout-minutes derive from this — do not shorten per-attempt for
  # retry headroom.
  MERGECRAFT_REVIEW_ATTEMPT_TIMEOUT_MINUTES: "25"
  # Single Action SHA for all three review rungs (D10 / #532). Bump here only;
  # every `uses: alexhawat/mergeCraft@…` below must match — enforced by
  # `make action-pin-check`.
  MERGECRAFT_ACTION_SHA: "2a943ce9724e454944dabf695f2eab2c676b3dcb"

concurrency:
  # pull_request_target resolves github.ref to the default branch; key on PR number
  # so concurrent reviews do not cancel each other (GitHub Nov 2025 policy).
  group: mergecraft-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Hold the review until mergeCraft's own CI has finished on the PR head SHA, so the
  # reviewer can read real lint/typecheck/test outcomes instead of guessing.
  # `needs:` cannot reference another workflow file, so this polls the check-runs
  # API for ci.yml's `Verify (…)` jobs.
  #
  # ALWAYS fail-open (`exit 0` on every path): mergecraft review is a required
  # check, so a wait that could fail would convert a slow or absent CI run into a
  # permanent merge block. Timing out just means the review proceeds without CI
  # context, which is the pre-existing behavior.
  wait-for-ci:
    name: mergecraft wait for CI
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false) &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    timeout-minutes: 25
    outputs:
      # complete | timeout | absent | skipped
      state: ${{ steps.wait.outputs.state || 'skipped' }}
      failed_count: ${{ steps.wait.outputs.failed_count || '0' }}
      failed_names: ${{ steps.wait.outputs.failed_names || '' }}
      check_suite_id: ${{ steps.wait.outputs.check_suite_id || '' }}
    steps:
      - name: Wait for CI checks on the PR head SHA
        id: wait
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Total budget. ci.yml runs ~12-15 min; 20 leaves headroom without
          # pinning a runner for the job's full 25.
          WAIT_BUDGET_SECONDS: "1200"
          # If no Verify job has even appeared by then, assume CI is not running
          # for this PR and stop waiting.
          APPEAR_BUDGET_SECONDS: "300"
        run: |
          set -uo pipefail
          # Selector for ci.yml's jobs — all of them are named "Verify (…)".
          jq_verify='[.check_runs[]? | select(.name | startswith("Verify ("))]'
          started="$(date +%s)"
          state="timeout"
          failed_count=0
          failed_names=""
          check_suite_id=""

          while :; do
            now="$(date +%s)"
            elapsed=$(( now - started ))

            if runs="$(gh api "/repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100")"; then
              total="$(printf '%s' "${runs}" | jq "${jq_verify} | length")"
              pending="$(printf '%s' "${runs}" | jq "${jq_verify} | map(select(.status != \"completed\")) | length")"

              if [ "${total}" -gt 0 ] && [ "${pending}" -eq 0 ]; then
                state="complete"
                failed_count="$(printf '%s' "${runs}" | jq "${jq_verify} | map(select(.conclusion != \"success\" and .conclusion != \"neutral\" and .conclusion != \"skipped\")) | length")"
                failed_names="$(printf '%s' "${runs}" | jq -r "${jq_verify} | map(select(.conclusion != \"success\" and .conclusion != \"neutral\" and .conclusion != \"skipped\") | .name) | join(\", \")")"
                # Any failing Verify job carries the check_suite id the reviewer
                # needs for get_check_suite_logs().
                check_suite_id="$(printf '%s' "${runs}" | jq -r "${jq_verify} | map(select(.conclusion != \"success\" and .conclusion != \"neutral\" and .conclusion != \"skipped\") | .check_suite.id) | first // \"\"")"
                break
              fi

              if [ "${total}" -eq 0 ] && [ "${elapsed}" -ge "${APPEAR_BUDGET_SECONDS}" ]; then
                state="absent"
                break
              fi
            else
              echo "check-runs query failed (elapsed ${elapsed}s) — retrying" >&2
            fi

            if [ "${elapsed}" -ge "${WAIT_BUDGET_SECONDS}" ]; then
              state="timeout"
              break
            fi
            sleep 10
          done

          {
            echo "state=${state}"
            echo "failed_count=${failed_count}"
            echo "failed_names=${failed_names}"
            echo "check_suite_id=${check_suite_id}"
          } >> "${GITHUB_OUTPUT}"
          echo "CI wait finished: state=${state} failed=${failed_count} suite=${check_suite_id:-none}"
          case "${state}" in
            timeout) echo "::notice title=mergecraft CI wait::CI did not finish within ${WAIT_BUDGET_SECONDS}s — reviewing without CI context." ;;
            absent) echo "::notice title=mergecraft CI wait::No Verify checks appeared for ${HEAD_SHA} — reviewing without CI context." ;;
          esac
          exit 0

  review:
    name: mergecraft review attempts
    needs: wait-for-ci
    # Write scopes stay on the review job only (zizmor excessive-permissions).
    permissions:
      contents: read
      # Post inline PR review + comments.
      pull-requests: write
      issues: write
      # Post mergecraft / mergecraft-approval check-runs.
      checks: write
      statuses: write
      # mergeCraft can mint short-lived tokens via OIDC when configured.
      id-token: write
    # `always()` keeps the required check reporting even if the (fail-open) wait
    # job errors out on a runner fault; a skipped wait job still skips the review,
    # because the draft/dispatch condition below is the same one it uses.
    #
    # Dependabot exemption (2026-08-19): a `mergecraft review` on a version bump
    # is a 60-minute Docker run over a one-line diff, and it failed *closed* on
    # every one of them. Two independent reasons, neither fixable from the PR:
    #   - the reviewer graded the bumps `request_changes` in shadow mode and
    #     posted no `mergecraft-approval` check-run at all, so the enforce step
    #     below hit its "no check posted" branch and exited 1 by design;
    #   - a lockfile bump has no logic to review, so even a completed review
    #     carries no signal the CI matrix (which does run, and does gate) is not
    #     already providing.
    # The result was ten open PRs blocked on a gate that could not go green.
    # Supply-chain safety does not rest on this gate: ci.yml, codeql.yml, the
    # `security audit` Verify job, and pinned SHAs all still run on these PRs.
    #
    # Skipping the job rather than deleting the trigger is deliberate — GitHub
    # records a conditionally skipped job as a completed, non-failing check, so
    # a branch protection rule that requires `mergecraft review` is satisfied.
    # Removing the PR from the workflow's trigger instead would leave the check
    # never reported and block the PR permanently.
    #
    # Gate on the PR author, not github.actor: a maintainer rebase or an
    # `@dependabot recreate` makes the human the actor on the resulting
    # synchronize, while user.login stays dependabot[bot].
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false) &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # > 3× MERGECRAFT_REVIEW_ATTEMPT_TIMEOUT_MINUTES + checkout/setup slack (D8).
    # Three rungs now (Nous -> Codex -> Claude). This is a worst-case ceiling,
    # not an expected cost: the Claude rung only runs when an earlier rung
    # failed retryably, and a rung that dies on a quota ceiling returns in
    # seconds rather than consuming its budget.
    timeout-minutes: 95
    env:
      IS_SAME_REPO: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
      # Nous/DeepSeek primary; Codex fallback when Nous auth is absent or the
      # Nous review does not post a mergecraft-approval verdict.
      HAS_CODEX: ${{ (secrets.CODEX_AUTH_JSON != '' || secrets.OPENAI_API_KEY != '') && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
      HAS_NOUS: ${{ secrets.NOUS_API_KEY != '' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
      # Claude is the cross-vendor backstop. Nous and Codex can go down together
      # for reasons that have nothing to do with this repo — a shared account
      # quota ceiling is the common one — and when they do, the cascade posts no
      # verdict and the approval gate fails closed on every PR at once. Anthropic
      # credentials fail independently of both.
      HAS_CLAUDE: ${{ (secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '') && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
      # Duplicated verbatim as `approval-gate.env.HAS_AUTH` (jobs cannot share an
      # `env` expression). Adding a provider here without updating that copy
      # fails the required gate OPEN — see the comment there.
      HAS_AUTH: ${{ (secrets.CODEX_AUTH_JSON != '' || secrets.OPENAI_API_KEY != '' || secrets.NOUS_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '') && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
      # MERGECRAFT_REVIEWER_PAT is deliberately absent from this job. The
      # default github.token cannot submit an "Approve" review — GitHub
      # silently downgrades any attempt to a comment — and a PAT from a
      # distinct account (sevn-one, a collaborator + CODEOWNERS entry) can.
      # But a PAT also cannot create the check-run the approval gate reads, so
      # handing it to the review steps disabled the gate and the approval both.
      # The approve lane lives in mergecraft-approve.yml, which holds its own
      # copy of the PAT and never re-reads PR content — see the review steps'
      # `token:` comment and PR #200.

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          # MUST stay false. actions/checkout persists its token as
          # `http.https://github.com/.extraheader = AUTHORIZATION: basic ...` in
          # .git/config, and mergeCraft's git layer adds its own
          # `Authorization` header (utils/git_setup.py, lane A D5).
          # `extraHeader` is multi-valued in git, so the second does not replace
          # the first — both go on the same request and GitHub answers
          # 400 "Duplicate header: Authorization". checkout_pr then fails, review
          # scope is never established, and every terminal verdict is rejected.
          #
          # The old comment here claimed persistence was required for
          # checkout_pr / git_fetch to authenticate. That stopped being true when
          # lane A gave those tools header-based auth of their own: checkout.py
          # passes `env=_git_env(ctx.git_token)`, so the action authenticates
          # from its `token:` input and needs nothing in .git/config.
          persist-credentials: false

      - name: Ensure PR base ref exists locally
        if: github.event_name == 'pull_request_target'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          base="${BASE_REF}"
          git fetch --no-tags origin "${base}:refs/remotes/origin/${base}"
          # pull_request_target checks out the default branch (`main`). When the
          # PR targets `main`, `git branch -f main …` fails because that branch
          # is the active worktree — origin/main is already fetched above.
          if [ "$(git rev-parse --abbrev-ref HEAD)" != "${base}" ]; then
            git branch -f "${base}" "origin/${base}"
          fi

      - name: Skip when provider auth is not configured
        if: env.HAS_AUTH != 'true'
        run: |
          if [ "${IS_SAME_REPO}" != "true" ]; then
            echo "::notice title=mergecraft skipped::Fork PR — review skipped (same as before)."
          else
            echo "::notice title=mergecraft skipped::Configure CODEX_AUTH_JSON (mergecraft auth codex), OPENAI_API_KEY, NOUS_API_KEY, or CLAUDE_CODE_OAUTH_TOKEN (mergecraft auth claude) to enable mergeCraft reviews."
          fi

      - name: Resolve PR for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        id: dispatch_pr
        env:
          GH_TOKEN: ${{ github.token }}
          # Never interpolate these into the script body. A branch name is
          # attacker-influenced text and can carry shell syntax; expanded by
          # `${{ }}` it would run as code under this job's write-scoped token.
          # Passed as env and quoted, it stays one literal argv element.
          DISPATCH_REPO: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Same-repo dispatch: the ref is the head branch. An empty number is a
          # real outcome (no open PR) — Compose then falls back to the bare
          # string rather than failing the job (#529).
          pr_json="$(gh pr list --repo "${DISPATCH_REPO}" \
                --head "${DISPATCH_REF}" --state open \
                --json number,baseRefName --jq '.[0] // {}')"
          n="$(printf '%s' "${pr_json}" | jq -r '.number // ""')"
          base="$(printf '%s' "${pr_json}" | jq -r '.baseRefName // ""')"
          {
            echo "number=${n}"
            echo "base_ref=${base}"
          } >> "${GITHUB_OUTPUT}"

      # Composed in a step rather than inline in `with:` so the CI-context clause
      # stays readable. Every interpolated value is repo-controlled (PR number,
      # base ref, our own wait-job outputs) — no PR-authored free text reaches the
      # prompt. pull_request_target and workflow_dispatch share one prompt shape
      # (#529): an explicit inputs.prompt stays verbatim; a resolved PR number
      # gets the checkout_pr + CI-context text; no matching PR falls back to the
      # bare string.
      - name: Compose review prompt
        id: prompt
        if: env.HAS_AUTH == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || steps.dispatch_pr.outputs.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref || steps.dispatch_pr.outputs.base_ref }}
          DISPATCH_PROMPT: ${{ inputs.prompt }}
          CI_STATE: ${{ needs.wait-for-ci.outputs.state }}
          CI_FAILED_COUNT: ${{ needs.wait-for-ci.outputs.failed_count }}
          CI_FAILED_NAMES: ${{ needs.wait-for-ci.outputs.failed_names }}
          CI_CHECK_SUITE_ID: ${{ needs.wait-for-ci.outputs.check_suite_id }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_PROMPT:-}" ]; then
            # Operator override: pass through unchanged (#529).
            text="${DISPATCH_PROMPT}"
          elif [ -z "${PR_NUMBER:-}" ]; then
            text="Review the current pull request."
          else
            # Codex presents mergeCraft MCP tools as mergecraft_. Naming the
            # bare tool (checkout_pr) makes Codex request a GitHub *plugin* that is
            # never installed in the Action image, then abort with
            # mergecraft-approval=neutral (alexhawat/mergeCraft#40).
            text="Review pull request #${PR_NUMBER}. First call the mergecraft MCP tool mergecraft_checkout_pr (the checkout_pr tool on the mergecraft MCP server — already configured). Do NOT install, request, or wait for any GitHub plugin. For base-side file reads use origin/${BASE_REF}:path, not bare branch names. If prior mergeCraft threads are resolved and the latest commits address them, submit approved:true with a short summary. Focus on correctness, security, regressions, missing tests, and maintainability. Leave concise, actionable comments only for issues that should be addressed before merge."
            # The Action runs with `shell: disabled`, so the reviewer cannot run
            # lint/typecheck/tests itself. Hand it the CI outcome instead — and the
            # check_suite id, because no MCP tool can discover one. wait-for-ci
            # outputs are available on workflow_dispatch too (#529).
            case "${CI_STATE}" in
              complete)
                if [ "${CI_FAILED_COUNT}" -gt 0 ] 2>/dev/null && [ -n "${CI_CHECK_SUITE_ID}" ]; then
                  text="${text} CI has finished on this head commit and ${CI_FAILED_COUNT} job(s) FAILED (${CI_FAILED_NAMES}). Call mergecraft_get_check_suite_logs with check_suite_id ${CI_CHECK_SUITE_ID} and ground your review in those failures — report the underlying defect, not the log line."
                else
                  text="${text} CI has finished green on this head commit, so lint, typecheck, and the full test suite already pass; do not speculate about mechanical failures those gates would have caught, and spend the review on logic, design, and missing coverage."
                fi
                ;;
              *)
                text="${text} CI results are NOT available for this head commit (wait state: ${CI_STATE}), so no lint/typecheck/test signal informs this review. Do not assert that the change passes or fails those gates."
                ;;
            esac
          fi
          {
            echo "text<<MERGECRAFT_PROMPT_EOF"
            echo "${text}"
            echo "MERGECRAFT_PROMPT_EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Record mergecraft-approval baseline before the review cascade
        id: approval_baseline
        # Every fallback below must judge THIS run's attempts, not a verdict an
        # earlier run left on the same head SHA (a re-run, or the enforce step's
        # own retry loop). Capturing the newest check-run id first makes "did
        # this attempt post a verdict?" answerable by identity rather than by
        # recency.
        #
        # Gated on HAS_AUTH rather than on a specific provider pair: the Claude
        # rung needs this baseline even when Nous is absent, and reading it is
        # cheap. Narrowing it to HAS_NOUS && HAS_CODEX left BASELINE_ID empty on
        # a Codex-only repo, which would make a stale verdict from a previous
        # run look like a fresh one and silently skip the backstop.
        if: >-
          env.HAS_AUTH == 'true' &&
          github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          id=""
          for attempt in $(seq 1 3); do
            if id="$(gh api "/repos/${REPO}/commits/${HEAD_SHA}/check-runs" \
              --jq '[.check_runs[]? | select(.name == "mergecraft-approval")]
              | sort_by(.completed_at // .started_at) | last | .id // ""')"; then
              break
            fi
            echo "check-runs baseline query failed (attempt ${attempt}/3); retrying in 3s…" >&2
            sleep 3
          done
          echo "baseline mergecraft-approval check-run: ${id:-none}"
          echo "id=${id}" >> "${GITHUB_OUTPUT}"

      - name: mergeCraft PR review (Nous Tencent HY3)
        if: env.HAS_NOUS == 'true'
        id: mergecraft_nous
        continue-on-error: true
        # 2026-08-07: rolled back from 88c6f419 to 8d747f39 — Codex stdin hang regression. See PR #246.
        # 2026-08-14: re-bumped to pre-0.0.1 tip (0ab5388). The stale 8d747f39 pin predates
        # a git-tool fix (src/mergecraft/mcp/git.py — tolerate a redundant subcommand in
        # args[0] instead of erroring) that self-review PRs were tripping over, crashing
        # the review before it could post a mergecraft-approval verdict at all. The Codex
        # stdin-hang class of bug this pin originally dodged was traced to blocking I/O in
        # the Codex driver; 889c1f0 (`feat(agents): migrate codex driver to streaming NDJSON
        # read loop`) replaced that read path months ago, well before this SHA.
        # 2026-08-14 (later same day): re-bumped again to f951af0. 0ab5388's action.yml had
        # an unrelated, more severe bug: three input `description:` fields contained a
        # literal `${{ secrets.X }}` example, which GitHub evaluates wherever it lexically
        # appears — including inside plain documentation prose — and `secrets` is not a
        # valid named-value in a composite action's own metadata. That failed the action's
        # *load* step outright ("Unrecognized named-value: 'secrets'") for every consumer
        # pinning past 0ab5388, self-review included. Fixed in #186; f951af0 is #186 merged
        # into pre-0.0.1. See tests/action/test_action_yml_contract.py::TestActionYmlHygiene
        # ::test_no_secrets_expression_in_manifest_text for the regression guard.
        # 2026-08-14 (yet later same day): re-bumped a third time to a1c10ef. f951af0's
        # action.yml *loaded* fine but the agent subprocess itself failed post-privilege-drop:
        # setpriv never resets $HOME, so the unprivileged mergecraft user inherited GitHub's
        # /github/home mount it doesn't own, and opencode/Codex both hit EACCES writing
        # dotfiles on startup. Fixed in #190 (src/mergecraft/utils/privilege.py,
        # agent_subprocess_env); a1c10ef is #190 merged into pre-0.0.1. Lesson for whoever
        # bumps this next: landing a fix on pre-0.0.1/main does NOT update this pin — it is a
        # literal SHA and must be re-bumped explicitly every time, even right after a sync PR.
        # 2026-08-14 (fourth bump, same day): #190's fix only redirected $HOME; Codex uses
        # its own $CODEX_HOME (and Gemini/Claude their own .gemini/.claude), each created
        # root-owned by write_mcp_config()/_setup_codex_auth() before the setpriv drop —
        # same bug shape, different path, still EACCES ("Permission denied (os error 13)"
        # initializing the Codex app-server). Fixed in #194 (prepare_workspace_for_agent()
        # chown as the last step); f5b070b is #194 merged into pre-0.0.1, synced to main
        # via #195. Lesson holds: re-bump this SHA explicitly, every time.
        # 2026-08-14 (fifth bump, same day): re-bumped to 3bf6d7b — checkout_pr failed
        # when re-run against a shared workspace within one job: a Nous review, then a
        # Codex fallback, both call checkout_pr against the same /github/workspace, and
        # the second call's fetch failed outright ("refusing to fetch into branch
        # 'refs/heads/pr-<n>' checked out at '/github/workspace'"). Reproduced on both
        # PR #201 and PR #202 — Nous timed out (Nous Portal flakiness, unrelated), the
        # Codex fallback then hit this, and neither posted a mergecraft-approval verdict
        # before running out of budget. Fixed in #204 (src/mergecraft/mcp/checkout.py —
        # detach HEAD before the fetch). Unlike every prior bump above, this SHA is
        # #204's own branch-tip commit, pinned before merge: #204 cannot review itself
        # with its own fix (the same self-review limitation the top-of-file comment
        # describes for mergecraft.yml edits), so bumping only after merge would need a
        # second PR just to consume the first. 3bf6d7b survives merge intact — this repo
        # merges PRs with a merge commit, never squash — so once #204 lands this pin is
        # already correct; no follow-up bump needed.
        # 2026-08-17 (sixth bump): re-bumped to 0592d72 — prep treated a skipped
        # Python install (`shell: disabled`) as a hard failure, so this repo's own
        # self-review job (which sets `shell: disabled`) never reached a verdict.
        # Fixed in #231 (src/mergecraft/prep/). Same self-review limitation as #204:
        # pull_request_target is resolved from `main`, so #231 cannot consume this
        # pin until it lands there; pin the product-fix commit now so a follow-up
        # bump PR is not required after merge. 0592d72 survives merge intact.
        # 2026-08-23 (ninth bump, PR #457): re-bumped to 5b9ded9f so the reviewer
        # runs the provider-failover fixes it is meant to exercise — retryable
        # provider timeouts, drained opencode serve pipes, quota classification,
        # and a single retryability decision path (#444, #445, #446, #447, #449).
        # pull_request_target resolves this workflow and action pin from the repo
        # default branch (main), not the PR head — self-review PRs cannot bump the
        # pin until after merge.
        # 2026-08-27 (tenth bump, PR #533): re-bumped to b34e9f25 — the ninth pin
        # had drifted 107 commits on src/mergecraft/, so every review since
        # 2026-08-23 ran product code that stale. Two concrete costs: the image at
        # 5b9ded9f has no `[tracing]` extra, so #531's Logfire wiring resolves to a
        # NullSink and exports nothing; and analyzer defects already fixed by #458 /
        # #459 still appeared in Action logs, which is how #527 came to be filed
        # against bugs that no longer existed. `make action-pin-check` detects this
        # correctly but is wired into no gate — see #532, which fixes the guard.
        # b34e9f25 was the pre-0.0.1 tip promoted by #533; it carried the
        # Dockerfile `--extra tracing` line and the lane A hardening from #519.
        # 2026-08-28 (eleventh bump, PR #546): re-bumped to b3638ea7 so the
        # reviewer can authenticate at all. Every rung at b34e9f25 brokered the
        # GitHub token to git as `Authorization: Bearer`, which GitHub's git
        # transport rejects, so `checkout_pr` failed on every review and the
        # scope guard then refused the terminal verdict — a review that reached
        # "approve" on PR #545 could not publish it, and the approval gate failed
        # closed with no mergecraft-approval check at all. Fixed in #545
        # (utils/git_setup.py — basic auth on the documented `x-access-token`
        # username). b3638ea7 is #545's merge commit.
        uses: alexhawat/mergeCraft@2a943ce9724e454944dabf695f2eab2c676b3dcb # env.MERGECRAFT_ACTION_SHA / PR #562
        with:
          prompt: ${{ steps.prompt.outputs.text }}
          timeout: ${{ env.MERGECRAFT_REVIEW_ATTEMPT_TIMEOUT_MINUTES }}m
          # Provider prefix `nous/` selects the opencode harness and names the
          # provider registered from the MERGECRAFT_CUSTOM_PROVIDER_* env vars.
          # 2026-08-23: moved off deepseek-v4-flash, which repeatedly failed to
          # reach a terminal verdict or ran out the 25m ceiling (runs
          # 32649874241, 32647074137). hy3 completed a full local review of the
          # same diff and calls tools correctly. Both models are served by the
          # same Nous Portal key, so no secret changes are needed.
          model: nous/tencent/hy3
          push: disabled
          shell: disabled
          status_checks: enabled
          # The workflow job token, NOT MERGECRAFT_REVIEWER_PAT. mergeCraft
          # posts the `mergecraft` / `mergecraft-approval` check-runs from this
          # input, and `POST /repos/{owner}/{repo}/check-runs` answers any
          # classic or OAuth user token with `403 You must authenticate via a
          # GitHub App` — no scope unlocks it. GITHUB_TOKEN *is* an App
          # installation token, and this job already grants checks: write.
          #
          # Under the PAT neither check-run had EVER posted (verified across
          # #519, #524, #533, #534, #542, #545, #546, #548), so `mergecraft
          # review` failed closed on every PR AND mergecraft-approve.yml, which
          # gates on reading that conclusion, could never submit its approval.
          # The PAT bought only the comment byline; it cost the whole gate.
          #
          # MERGECRAFT_REVIEWER_PAT stays where it works: mergecraft-approve.yml
          # holds its own copy and submits the sevn-one APPROVE from there.
          # Restoring a distinct byline here needs a GitHub App, not a PAT.
          token: ${{ github.token }}
          tracing: "true"
          tracing-to: logfire
          logfire-token: ${{ secrets.LOGFIRE_TOKEN }}
        env:
          MERGECRAFT_CUSTOM_PROVIDER_BASE_URL: https://inference-api.nousresearch.com/v1
          MERGECRAFT_CUSTOM_PROVIDER_API_KEY: ${{ secrets.NOUS_API_KEY }}
          MERGECRAFT_TRACING_PROJECT: ${{ vars.LOGFIRE_PROJECT }}
          MERGECRAFT_TRACING_REGION: eu

      - name: Persist evidence packet (Nous)
        if: always()
        env:
          PACKET: ${{ steps.mergecraft_nous.outputs.evidence_packet }}
        run: printf '%s' "$PACKET" > packet-nous.json

      - name: Upload packet artifact (Nous)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mergecraft-evidence-nous
          path: packet-nous.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Decide Codex fallback after Nous
        id: fallback
        # Deliberately NOT gated on steps.mergecraft_nous.outcome. The failure
        # this fallback exists for — mergecraft-approval=neutral, the MCP
        # handshake symptom — leaves the action exiting 0 while posting no
        # usable verdict. Gating on a non-success outcome would skip the
        # fallback in exactly that case and hand the enforce step a
        # fail-closed no-verdict. Route on the verdict itself instead.
        if: >-
          env.HAS_NOUS == 'true' &&
          env.HAS_CODEX == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          BASELINE_ID: ${{ steps.approval_baseline.outputs.id }}
          NOUS_OUTCOME: ${{ steps.mergecraft_nous.outcome }}
          NOUS_PACKET: ${{ steps.mergecraft_nous.outputs.evidence_packet }}
        run: |
          set -euo pipefail
          need="false"
          if [ -n "${NOUS_PACKET:-}" ]; then
            verdict="$(printf '%s' "$NOUS_PACKET" | jq -r '.decision.verdict // empty')"
            case "${verdict}" in
              failure|success)
                echo "packet decision.verdict=${verdict} — Nous review posted a verdict; not falling back to Codex."
                ;;
              *)
                need="true"
                echo "::notice title=mergecraft Codex fallback::Nous review posted no verdict in evidence packet (action outcome: ${NOUS_OUTCOME}); retrying with openai/gpt-codex."
                ;;
            esac
          elif [ "${EVENT_NAME}" = "pull_request_target" ]; then
            latest=""
            for attempt in $(seq 1 3); do
              if latest="$(gh api "/repos/${REPO}/commits/${HEAD_SHA}/check-runs" \
                --jq '[.check_runs[]? | select(.name == "mergecraft-approval")]
                | sort_by(.completed_at // .started_at) | last
                | "\(.id // "")|\(.conclusion // "")"')"; then
                break
              fi
              echo "check-runs query failed (attempt ${attempt}/3); retrying in 3s…" >&2
              sleep 3
            done
            id="${latest%%|*}"
            conclusion="${latest#*|}"
            # A verdict only counts when the check-run is NOT the one that was
            # already there before this Nous attempt ran.
            if [ -n "${id}" ] && [ "${id}" = "${BASELINE_ID}" ]; then
              echo "mergecraft-approval ${id} predates this Nous attempt — treating as no verdict."
              conclusion=""
            fi
            case "${conclusion}" in
              failure|success)
                echo "mergecraft-approval=${conclusion} — Nous review posted a verdict; not falling back to Codex."
                ;;
              *)
                need="true"
                echo "::notice title=mergecraft Codex fallback::Nous review posted no verdict (action outcome: ${NOUS_OUTCOME}); retrying with openai/gpt-codex."
                ;;
            esac
          elif [ "${NOUS_OUTCOME}" != "success" ]; then
            need="true"
            echo "::notice title=mergecraft Codex fallback::Nous review failed; retrying with openai/gpt-codex."
          fi
          echo "need=${need}" >> "${GITHUB_OUTPUT}"

      - name: mergeCraft PR review (Codex)
        if: >-
          env.HAS_CODEX == 'true' &&
          (
            env.HAS_NOUS != 'true' ||
            steps.fallback.outputs.need == 'true'
          )
        id: mergecraft_codex
        continue-on-error: true
        # mergeCraft — full SHA pinned to the alexhawat/mergeCraft `pre-0.0.1` head.
        # The pin is MANDATORY, not a preference: a branch ref like `@pre-0.0.1`
        # is rejected at action-resolution time before the review step runs.
        # Bump this SHA and the corresponding step in the sevn-side workflow
        # together; if a future `MERGECRAFT_REF` parity rule is added to this
        # repo's Makefile, bump that var in unison.
        # 2026-08-07: rolled back from 88c6f419 to 8d747f39 — Codex stdin hang regression. See PR #246.
        # 2026-08-14: re-bumped to pre-0.0.1 tip (0ab5388), then to f951af0 (#186: action.yml
        # load-breaking `${{ secrets.X }}` in description text), then to a1c10ef (#190:
        # setpriv never resets $HOME, agent subprocess EACCES post-privilege-drop), then to
        # f5b070b (#194: $CODEX_HOME/.gemini/.claude also created root-owned before the
        # drop, same bug shape), then to 3bf6d7b (#204: checkout_pr fetch failure on a
        # shared workspace when Nous falls back to Codex, fixed by detaching HEAD before
        # the fetch), then to 0592d72 (#231: skipped Python install under `shell:
        # disabled` must not fail prep) — see the matching comment on the Nous step
        # above for why.
        # 2026-08-23 (ninth bump, PR #457): re-bumped to 5b9ded9f so the reviewer
        # runs the provider-failover fixes it is meant to exercise — retryable
        # provider timeouts, drained opencode serve pipes, quota classification,
        # and a single retryability decision path (#444, #445, #446, #447, #449).
        # pull_request_target resolves this workflow and action pin from the repo
        # default branch (main), not the PR head — self-review PRs cannot bump the
        # pin until after merge.
        # 2026-08-27 (tenth bump, PR #533): re-bumped to b34e9f25 — the ninth pin
        # had drifted 107 commits on src/mergecraft/, so every review since
        # 2026-08-23 ran product code that stale. Two concrete costs: the image at
        # 5b9ded9f has no `[tracing]` extra, so #531's Logfire wiring resolves to a
        # NullSink and exports nothing; and analyzer defects already fixed by #458 /
        # #459 still appeared in Action logs, which is how #527 came to be filed
        # against bugs that no longer existed. `make action-pin-check` detects this
        # correctly but is wired into no gate — see #532, which fixes the guard.
        # b34e9f25 was the pre-0.0.1 tip promoted by #533; it carried the
        # Dockerfile `--extra tracing` line and the lane A hardening from #519.
        # 2026-08-28 (eleventh bump, PR #546): re-bumped to b3638ea7 so the
        # reviewer can authenticate at all. Every rung at b34e9f25 brokered the
        # GitHub token to git as `Authorization: Bearer`, which GitHub's git
        # transport rejects, so `checkout_pr` failed on every review and the
        # scope guard then refused the terminal verdict — a review that reached
        # "approve" on PR #545 could not publish it, and the approval gate failed
        # closed with no mergecraft-approval check at all. Fixed in #545
        # (utils/git_setup.py — basic auth on the documented `x-access-token`
        # username). b3638ea7 is #545's merge commit.
        uses: alexhawat/mergeCraft@2a943ce9724e454944dabf695f2eab2c676b3dcb # env.MERGECRAFT_ACTION_SHA / PR #562
        with:
          prompt: ${{ steps.prompt.outputs.text }}
          # Must stay BELOW the job's timeout-minutes: when GitHub kills the job
          # first, the action never posts its `mergecraft` completion check and the
          # only diagnostic is lost. Job timeout-minutes is composed from the same
          # per-attempt budget (D8) so both attempts can finish before the ceiling.
          timeout: ${{ env.MERGECRAFT_REVIEW_ATTEMPT_TIMEOUT_MINUTES }}m
          model: openai/gpt-codex
          push: disabled
          shell: disabled
          status_checks: enabled
          # Job token, not the PAT — see the matching comment on the Nous step.
          token: ${{ github.token }}
          tracing: "true"
          tracing-to: logfire
          logfire-token: ${{ secrets.LOGFIRE_TOKEN }}
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MERGECRAFT_TRACING_PROJECT: ${{ vars.LOGFIRE_PROJECT }}
          MERGECRAFT_TRACING_REGION: eu

      - name: Persist evidence packet (Codex)
        if: always()
        env:
          PACKET: ${{ steps.mergecraft_codex.outputs.evidence_packet }}
        run: printf '%s' "$PACKET" > packet-codex.json

      - name: Upload packet artifact (Codex)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mergecraft-evidence-codex
          path: packet-codex.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Decide Claude backstop after the provider cascade
        id: claude_fallback
        # Gated on a RETRYABLE provider failure, not on "no verdict posted".
        #
        # That is deliberately the opposite rule from the Nous -> Codex fallback
        # above, because the two rungs exist for different failures. Codex backs
        # up a Nous run that exits 0 while posting nothing usable (the
        # mergecraft-approval=neutral / MCP handshake symptom), so it MUST route
        # on verdict absence. Claude backs up a provider that could not run at
        # all — quota ceiling, timeout, transport death — which the action
        # surfaces by exiting non-zero, i.e. a step outcome of `failure` under
        # continue-on-error.
        #
        # Routing Claude on verdict absence too would spend a third full attempt
        # (and a third provider's quota) every time a reviewer legitimately
        # declines to post one. Routing it on outcome keeps the backstop for the
        # case it was added for: every earlier rung was unable to review.
        #
        # The verdict re-check below is a safety net, not the trigger: a rung can
        # exit non-zero *after* posting a good verdict (the exhaustion arrives on
        # a later retry), and re-reviewing then would overwrite a real verdict.
        if: >-
          env.HAS_CLAUDE == 'true' &&
          (
            steps.mergecraft_nous.outcome == 'failure' ||
            steps.mergecraft_codex.outcome == 'failure'
          )
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          BASELINE_ID: ${{ steps.approval_baseline.outputs.id }}
          NOUS_OUTCOME: ${{ steps.mergecraft_nous.outcome }}
          CODEX_OUTCOME: ${{ steps.mergecraft_codex.outcome }}
          NOUS_PACKET: ${{ steps.mergecraft_nous.outputs.evidence_packet }}
          CODEX_PACKET: ${{ steps.mergecraft_codex.outputs.evidence_packet }}
        run: |
          set -euo pipefail
          need="true"
          packet="${CODEX_PACKET:-${NOUS_PACKET:-}}"
          if [ -n "${packet}" ]; then
            verdict="$(printf '%s' "$packet" | jq -r '.decision.verdict // empty')"
            case "${verdict}" in
              failure|success)
                need="false"
                echo "packet decision.verdict=${verdict} — a rung posted a verdict despite failing later; not spending the Claude backstop."
                ;;
            esac
          elif [ "${EVENT_NAME}" = "pull_request_target" ]; then
            latest=""
            for attempt in $(seq 1 3); do
              if latest="$(gh api "/repos/${REPO}/commits/${HEAD_SHA}/check-runs" \
                --jq '[.check_runs[]? | select(.name == "mergecraft-approval")]
                | sort_by(.completed_at // .started_at) | last
                | "\(.id // "")|\(.conclusion // "")"')"; then
                break
              fi
              echo "check-runs query failed (attempt ${attempt}/3); retrying in 3s…" >&2
              sleep 3
            done
            id="${latest%%|*}"
            conclusion="${latest#*|}"
            # Same identity rule as the Codex fallback: a verdict only counts
            # when it is NOT the one that was already on this SHA beforehand.
            if [ -n "${id}" ] && [ "${id}" = "${BASELINE_ID}" ]; then
              echo "mergecraft-approval ${id} predates this run — treating as no verdict."
              conclusion=""
            fi
            case "${conclusion}" in
              failure|success)
                need="false"
                echo "mergecraft-approval=${conclusion} — a rung posted a verdict despite failing later; not spending the Claude backstop."
                ;;
            esac
          fi
          if [ "${need}" = "true" ]; then
            echo "::notice title=mergecraft Claude backstop::A provider failed retryably (nous=${NOUS_OUTCOME:-skipped}, codex=${CODEX_OUTCOME:-skipped}) and no verdict was posted; retrying with anthropic/claude-sonnet."
          fi
          echo "need=${need}" >> "${GITHUB_OUTPUT}"

      - name: mergeCraft PR review (Claude)
        # Two ways in: as the backstop after a retryable provider failure, or as
        # the sole reviewer when Claude is the only credential this repo has.
        # Without the second clause, a Claude-only repo would satisfy HAS_AUTH,
        # skip the "not configured" notice, run no review at all, and fail the
        # gate closed with no diagnostic.
        if: >-
          env.HAS_CLAUDE == 'true' &&
          (
            steps.claude_fallback.outputs.need == 'true' ||
            (env.HAS_NOUS != 'true' && env.HAS_CODEX != 'true')
          )
        id: mergecraft_claude
        continue-on-error: true
        # Same mandatory full-SHA pin as the rungs above — keep all three in
        # lockstep when bumping, and mirror to the sevn-side workflow. This rung
        # was authored against the pre-#533 pin; carried forward on each bump so
        # all three rungs run the same product code (#532). Now b3638ea7 (#545).
        uses: alexhawat/mergeCraft@2a943ce9724e454944dabf695f2eab2c676b3dcb # env.MERGECRAFT_ACTION_SHA / PR #562
        with:
          prompt: ${{ steps.prompt.outputs.text }}
          timeout: ${{ env.MERGECRAFT_REVIEW_ATTEMPT_TIMEOUT_MINUTES }}m
          model: anthropic/claude-sonnet
          push: disabled
          shell: disabled
          status_checks: enabled
          # Job token, not the PAT — see the matching comment on the Nous step.
          token: ${{ github.token }}
          tracing: "true"
          tracing-to: logfire
          logfire-token: ${{ secrets.LOGFIRE_TOKEN }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MERGECRAFT_TRACING_PROJECT: ${{ vars.LOGFIRE_PROJECT }}
          MERGECRAFT_TRACING_REGION: eu

      - name: Persist evidence packet (Claude)
        if: always()
        env:
          PACKET: ${{ steps.mergecraft_claude.outputs.evidence_packet }}
        run: printf '%s' "$PACKET" > packet-claude.json

      - name: Upload packet artifact (Claude)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mergecraft-evidence-claude
          path: packet-claude.json
          retention-days: 30
          if-no-files-found: ignore

      - name: mergeCraft review incomplete (non-fatal)
        if: >-
          env.HAS_AUTH == 'true' &&
          (
            (
              env.HAS_NOUS == 'true' &&
              steps.mergecraft_nous.outcome != 'success' &&
              steps.fallback.outputs.need != 'true'
            ) ||
            (
              env.HAS_NOUS == 'true' &&
              steps.fallback.outputs.need == 'true' &&
              steps.mergecraft_codex.outcome != 'success'
            ) ||
            (
              env.HAS_NOUS != 'true' &&
              steps.mergecraft_codex.outcome != 'success'
            )
          ) &&
          steps.mergecraft_claude.outcome != 'success'
        run: |
          echo "::notice title=mergecraft incomplete::Review step did not finish successfully (see its log — e.g. provider session limit or a runtime error). Approval enforcement in the approval-gate job will fail closed on this."

  approval-gate:
    name: mergecraft review
    needs: review
    # Same draft/dispatch/dependabot guard as the attempts job. `always()` keeps
    # the required check reporting when the attempts job errors on a runner fault;
    # a skipped attempts job still skips the gate.
    if: >-
      always() &&
      needs.review.result != 'skipped' &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false) &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    env:
      # Must stay character-for-character identical to the `review` job's
      # HAS_AUTH. GitHub has no way to share one `env` expression across jobs,
      # so the predicate is duplicated — and it drifted once already: Claude was
      # added to the review job's copy and not to this one, which fails the gate
      # OPEN on a Claude-only repo (the review runs, this job's only real step
      # is skipped, and the required check goes green with no
      # `mergecraft-approval=success` anywhere). When adding a provider, update
      # both copies. `tests/ci/test_approval_gate_auth_predicate.py` pins them.
      HAS_AUTH: ${{ (secrets.CODEX_AUTH_JSON != '' || secrets.OPENAI_API_KEY != '' || secrets.NOUS_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '') && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Fail when mergeCraft would not approve
        # Gate directly on the `mergecraft-approval` check-run, decoupled from the
        # review step's own exit code (which can be non-zero on a benign output
        # hiccup even when the review + approval check posted fine). Runs on every
        # PR where auth is present.
        #
        # This job `needs:` the review-attempts job so the gate cannot sample
        # check-runs until every attempt in that job (including Codex fallback)
        # has finished — fixing the #433 race where a legitimate Codex approval
        # read as "review did not complete".
        #
        # FAIL CLOSED on every non-success outcome. PR #194 showed the review can
        # fail outright (there, a bwrap sandbox namespace failure), posting no
        # `mergecraft-approval` check at all — the prior version treated that
        # ("no check posted") and a check-runs API
        # outage identically as fail-open, so a PR could merge with zero review
        # signal and nothing visibly red. The only passing outcome now is a
        # definitive conclusion=success: a review that actually ran and approved.
        # Retries below only smooth over a single transient API blip; once
        # retries are exhausted without success, this step exits 1.
        if: >-
          github.event_name == 'pull_request_target' &&
          env.HAS_AUTH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The action posts a `mergecraft-approval` check-run on the PR head SHA:
          # conclusion=success => no outstanding feedback; anything else (failure,
          # no check posted at all, or the query itself failing after retries)
          # means the review was never confirmed successful, so none of those
          # paths may pass this gate.
          conclusion=""; queried=""
          for attempt in $(seq 1 5); do
            if conclusion="$(gh api "/repos/${REPO}/commits/${HEAD_SHA}/check-runs" \
              --jq '[.check_runs[]? | select(.name == "mergecraft-approval")]
              | sort_by(.completed_at // .started_at) | last | .conclusion // ""')"; then
              queried="yes"; break
            fi
            echo "check-runs query failed (attempt ${attempt}/5); retrying in 5s…" >&2
            sleep 5
          done
          if [ -z "${queried}" ]; then
            # FAIL CLOSED: an unreachable check-runs API after retries is not
            # evidence a review ran and approved, so it cannot pass the gate.
            # This deliberately accepts that a sustained GitHub API outage blocks
            # merges on gated branches until the query succeeds (or someone
            # re-runs the job) — "the review actually ran and approved" is the
            # only condition that may pass, full stop.
            echo "::error title=mergecraft approval unknown::Could not query check-runs for ${HEAD_SHA} after retries — cannot confirm mergecraft-approval. Failing closed."
            exit 1
          fi
          case "${conclusion}" in
            success)
              echo "mergecraft approval: no outstanding review feedback."
              ;;
            failure)
              echo "::error title=mergecraft requested changes::mergecraft-approval check failed — address the review feedback on this PR."
              exit 1
              ;;
            *)
              # No mergecraft-approval check at all: the review failed to produce
              # any verdict — e.g. PR #194, where a Codex sandbox crash left zero
              # review signal. Fail closed rather than merge unreviewed.
              echo "::error title=mergecraft review incomplete::No mergecraft-approval check on ${HEAD_SHA} — the review did not complete (see the review job's logs). Failing closed: this gate only passes once mergeCraft has actually reviewed and approved."
              exit 1
              ;;
          esac
