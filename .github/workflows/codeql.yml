# SPDX-License-Identifier: MIT
#
# CodeQL semantic code scanning for Python.
# Results publish to code scanning on the events whose token can write
# security-events: pushes to the protected branches, the weekly schedule, and
# pull requests opened from this repository. Fork and Dependabot pull requests
# still analyse, but skip the upload because their token is read-only.
# An analysis failure fails this job on every event. This workflow is not a
# required status check.
name: CodeQL

on:
  push:
    branches: [main, pre-0.0.1]
  pull_request:
    branches: [main, pre-0.0.1]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f58f0d11ebf5dedd870fab2f999275f7602cfa46 # codeql-bundle-v2.26.0
        with:
          languages: python
          build-mode: none
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f58f0d11ebf5dedd870fab2f999275f7602cfa46 # codeql-bundle-v2.26.0
        with:
          category: "/language:python"
          # Publish only where the token can write security-events; fork and
          # Dependabot pull requests keep the upload disabled.
          upload: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && 'always' || 'never' }}
