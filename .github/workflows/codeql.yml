# SPDX-License-Identifier: MIT
#
# CodeQL semantic code scanning for Python.
# Requires code scanning to be enabled in repo settings for upload to succeed.
name: CodeQL

on:
  push:
    branches: [main, pre-0.0.1]
  pull_request:
    branches: [main, pre-0.0.1]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Private repos without code scanning enabled fail on SARIF upload;
    # keep the job green until scanning is turned on in Settings → Security.
    continue-on-error: true
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f58f0d11ebf5dedd870fab2f999275f7602cfa46 # codeql-bundle-v2.26.0
        with:
          languages: python
          build-mode: none
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f58f0d11ebf5dedd870fab2f999275f7602cfa46 # codeql-bundle-v2.26.0
        with:
          category: "/language:python"
          # Avoid hard-fail when Advanced Security / code scanning is not enabled.
          upload: never
