# Privileged approval reads only trusted default-branch code and API metadata.
# The reviewer job never receives this approval job's token or private key.
name: mergecraft-approve
on:
  workflow_run:
    workflows: [mergecraft]
    types: [completed]
permissions:
  contents: read
jobs:
  approve:
    name: mergecraft privileged approve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_target' &&
      github.event.workflow_run.pull_requests[0] != null
    env:
      HAS_APP: ${{ secrets.MERGECRAFT_APP_ID != '' && secrets.MERGECRAFT_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Check out trusted approval helper
        if: env.HAS_APP == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Mint approval App token
        if: env.HAS_APP == 'true'
        id: app_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.MERGECRAFT_APP_ID }}
          private-key: ${{ secrets.MERGECRAFT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: read
          permission-pull-requests: write
      - name: Verify provenance and submit privileged APPROVE
        if: env.HAS_APP == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          EXPECTED_APP_ID: ${{ secrets.MERGECRAFT_APP_ID }}
        run: python3 scripts/approve_app_review.py
