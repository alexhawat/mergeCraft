# Approval is an explicit maintainer decision, never a reviewer-triggered event.
# Its separate App credentials never enter the review action.
name: mergecraft-approve
on:
  workflow_dispatch:
    inputs:
      review-run-id:
        description: Successful mergecraft run explicitly accepted by the maintainer
        required: true
        type: string
      reviewed-head:
        description: Full PR head SHA explicitly approved by the maintainer
        required: true
        type: string
permissions:
  contents: read
jobs:
  approve:
    name: mergecraft privileged approve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    env:
      HAS_APP: ${{ secrets.MERGECRAFT_APP_ID != '' && secrets.MERGECRAFT_APPROVAL_APP_ID != '' && secrets.MERGECRAFT_APPROVAL_APP_PRIVATE_KEY != '' && secrets.MERGECRAFT_APP_ID != secrets.MERGECRAFT_APPROVAL_APP_ID }}
    steps:
      - name: Check out trusted approval helper
        if: env.HAS_APP == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Mint distinct approval App token
        if: env.HAS_APP == 'true'
        id: app_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.MERGECRAFT_APPROVAL_APP_ID }}
          private-key: ${{ secrets.MERGECRAFT_APPROVAL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-checks: read
          permission-pull-requests: write
      - name: Verify accepted run and submit privileged APPROVE
        if: env.HAS_APP == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          EXPECTED_APP_ID: ${{ secrets.MERGECRAFT_APP_ID }}
          APPROVAL_APP_ID: ${{ secrets.MERGECRAFT_APPROVAL_APP_ID }}
        run: python3 scripts/approve_app_review.py
