# SPDX-License-Identifier: MIT
name: Docker

on:
  pull_request:
    branches: [main, pre-0.0.1]
    paths:
      - Dockerfile
      - Dockerfile.analyzers
      - docker-entrypoint.sh
      - pyproject.toml
      - uv.lock
      - src/**
      - .github/workflows/docker.yml
  push:
    branches: [main, pre-0.0.1]
    paths:
      - Dockerfile
      - Dockerfile.analyzers
      - docker-entrypoint.sh
      - pyproject.toml
      - uv.lock
      - src/**
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build slim
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: |
            ghcr.io/alexhawat/mergecraft:latest
            ghcr.io/alexhawat/mergecraft:${{ github.sha }}
            mergecraft:ci
          cache-from: type=gha,scope=mergeCraft-slim
          cache-to: type=gha,mode=max,scope=mergeCraft-slim
      - name: Build analyzers
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.analyzers
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: |
            ghcr.io/alexhawat/mergecraft:analyzers
            ghcr.io/alexhawat/mergecraft:analyzers-${{ github.sha }}
            mergecraft-analyzers:ci
          cache-from: type=gha,scope=mergeCraft-analyzers
          cache-to: type=gha,mode=max,scope=mergeCraft-analyzers
      - name: Entrypoint smoke (slim)
        if: github.event_name != 'push'
        run: docker run --rm mergecraft:ci --help
      - name: Entrypoint smoke (analyzers)
        if: github.event_name != 'push'
        run: |
          docker run --rm mergecraft-analyzers:ci --help
          docker run --rm mergecraft-analyzers:ci which actionlint zizmor shellcheck hadolint
