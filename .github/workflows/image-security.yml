# SPDX-License-Identifier: MIT
name: Image security
on:
  pull_request:
    branches: [main, pre-0.0.1]
    paths:
      - Dockerfile
      - Dockerfile.analyzers
      - docker/**
      - pyproject.toml
      - uv.lock
      - Makefile
      - .trivyignore
      - .github/workflows/image-security.yml
      - .github/workflows/ci-cd.yml
permissions:
  contents: read
concurrency:
  group: image-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    name: Image scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: slim
            dockerfile: Dockerfile
          - image: analyzers
            dockerfile: Dockerfile.analyzers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: mergecraft:scan-${{ matrix.image }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=image-security-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=image-security-${{ matrix.image }}
      - name: Runtime toolchain smoke test
        env:
          IMAGE_SCAN_REF: mergecraft:scan-${{ matrix.image }}
        run: make image-toolchain-check
      - name: Reject expired scan waivers
        run: python3 scripts/check_trivyignore_expiry.py
      - name: Scan built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: mergecraft:scan-${{ matrix.image }}
          format: json
          output: trivy-image.json
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
      - name: Convert scan report
        if: always() && hashFiles('trivy-image.json') != ''
        run: make image-scan-sarif
      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-security-${{ matrix.image }}
          path: |
            trivy-image.json
            trivy-image.sarif
          if-no-files-found: warn
