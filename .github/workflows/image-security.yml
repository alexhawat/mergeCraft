# SPDX-License-Identifier: MIT
name: Image security
on:
  pull_request:
    branches: [main, pre-0.0.1, codex/audit-remediation]
    # Always evaluate PRs: source, entrypoint, build hooks and future COPY
    # inputs all affect the shipped image, not just dependency manifests.
permissions:
  contents: read
concurrency:
  group: image-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    uses: ./.github/workflows/classify-pr.yml

  scan:
    needs: changes
    if: needs.changes.outputs.image_only != 'true'
    name: Image scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: slim
            dockerfile: docker/Dockerfile
          - image: analyzers
            dockerfile: docker/Dockerfile.analyzers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space for image build and scan
        # These hosted-runner SDKs are unused: the toolchain is built in Docker.
        # Trivy also needs space for Docker's temporary image export.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: mergecraft:scan-${{ matrix.image }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=image-security-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=image-security-${{ matrix.image }}
      - name: Runtime toolchain smoke test
        env:
          IMAGE_SCAN_REF: mergecraft:scan-${{ matrix.image }}
        run: make image-toolchain-check
      - name: Release build cache before scanning
        # The cache is already exported to GHA; the loaded, tagged Docker image
        # survives pruning the separate BuildKit cache.
        run: |
          docker buildx prune --all --force
          df -h /
      - name: Reject expired scan waivers
        run: python3 scripts/check_trivyignore_expiry.py
      - name: Scan built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: mergecraft:scan-${{ matrix.image }}
          format: json
          output: trivy-image.json
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
      - name: List blocking image findings
        if: failure() && hashFiles('trivy-image.json') != ''
        run: |
          jq -r '.Results[] | .Target as $target |
            (.Vulnerabilities[]? | [$target, .VulnerabilityID, .PkgName, .InstalledVersion, .FixedVersion]),
            (.Secrets[]? | [$target, .RuleID, .Severity]) | @tsv' trivy-image.json
      - name: Convert scan report
        if: always() && hashFiles('trivy-image.json') != ''
        run: make image-scan-sarif
      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-security-${{ matrix.image }}
          path: |
            trivy-image.json
            trivy-image.sarif
          if-no-files-found: warn
