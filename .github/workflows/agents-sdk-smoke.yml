name: agents-sdk-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/mergecraft/agents_sdk/**"
      - "examples/agents-sdk/**"
      - "tests/agents_sdk/**"
      - ".github/workflows/agents-sdk-smoke.yml"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      GH_EVENT_NAME: ${{ github.event_name }}
      IS_SAME_REPO: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap

      - name: Sync agents + dev extras
        run: uv sync --extra dev --extra agents

      - name: Unit tests (agents_sdk)
        run: uv run pytest tests/agents_sdk -q -m "not live"

      - name: Live example (OpenCode Go when secret present)
        id: live
        continue-on-error: true
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          MERGECRAFT_AGENTS_SDK_MODEL: opencode-go/deepseek-v4.1-flash
          MERGECRAFT_AGENTS_SDK_MAX_ROUNDS: "2"
        run: |
          set -euo pipefail
          if [[ "${GH_EVENT_NAME}" == "pull_request" && "${IS_SAME_REPO}" != "true" ]]; then
            echo "::notice title=agents-sdk smoke skipped::fork PR — no repository secrets"
            exit 0
          fi
          if [[ -z "${OPENCODE_GO_API_KEY:-}" ]]; then
            echo "::notice title=agents-sdk smoke skipped::OPENCODE_GO_API_KEY not configured"
            exit 0
          fi
          uv run python examples/agents-sdk/review_loop.py 2>&1 | tee /tmp/agents-sdk-smoke.log
          echo "---- redacted tail ----"
          tail -n 20 /tmp/agents-sdk-smoke.log | sed -E 's/(ghp_|sk-)[A-Za-z0-9_-]+/<redacted>/g'

      - name: Live smoke outcome
        run: |
          set -euo pipefail
          if [[ "${{ steps.live.outcome }}" == "success" || "${{ steps.live.outcome }}" == "skipped" ]]; then
            exit 0
          fi
          if [[ -f /tmp/agents-sdk-smoke.log ]] && grep -qE '402|Insufficient account funds' /tmp/agents-sdk-smoke.log; then
            echo "::warning title=agents-sdk live smoke::OpenCode Go returned 402 insufficient funds; unit tests still gate this workflow"
            exit 0
          fi
          echo "::error title=agents-sdk live smoke::example failed (see live step log)"
          exit 1
