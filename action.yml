name: "mergeCraft Action (Python)"
description: "Execute coding agents with a prompt (standalone BYOK Python runtime)"
author: "Alex Hawat"

inputs:
  prompt:
    description: "Prompt to send to the agent (string or JSON payload)"
    required: false
  prompt_file:
    description: "Path to a file (relative to GITHUB_WORKSPACE) whose contents are used as the prompt. Set exactly one of prompt or prompt_file."
    required: false
  timeout:
    description: "Maximum run duration (e.g., 10m, 1h30m). Default: 1h"
    required: false
  model:
    description: >-
      Model to use — a curated slug (e.g. anthropic/claude-opus, tokenhub/hy3,
      nous/deepseek/deepseek-v4-flash) or a raw models.dev specifier. Overrides
      repo settings. OpenAI-compatible gateways: set NOUS_API_KEY or
      TOKENHUB_API_KEY (or MERGECRAFT_CUSTOM_PROVIDER_*).

      Default behaviour (#37 / W4): the supplied `model:` becomes the **head**
      of the configured chain — the repo's `models:` list (and any
      `modelFallbacks:`) is retained as the tail and walked on credential
      miss or retryable failure. To restore the legacy "use exactly this
      model, suppress the chain" semantics, set `model_pin: enabled`.
    required: false
  model_pin:
    description: >-
      #37 / W4 / D8 — opt into the legacy "use exactly this model" semantics
      for the `model:` input. Default `disabled`: `model:` becomes the chain
      head; the configured `models:` / `modelFallbacks:` tail is walked on
      credential miss or retryable failure. Set to `enabled` to collapse the
      chain to `[model]` (suppress fallbacks). Wire this through `.mergecraft/
      config.yaml`'s `modelPin: true` for repo-wide default; the action input
      wins.
    required: false
    default: "disabled"
  cwd:
    description: "Working directory for the agent (defaults to GITHUB_WORKSPACE)"
    required: false
  push:
    description: "Git push permission: disabled, restricted, or enabled. Default: restricted"
    required: false
  shell:
    description: "Shell permission: disabled, restricted, or enabled."
    required: false
  status_checks:
    description: "Post mergecraft and mergecraft-approval commit-status checks: disabled (default) or enabled."
    required: false
  analyzers:
    description: >-
      Analyzer execution tier: off (disabled), auto (detect + provision), full (baked image tools),
      or untrusted-only (trust-aware: run only analyzers that need no secrets, no network and no
      PR-authored command construction — trusted-tier and repo-native manifests are skipped with a
      named reason rather than failing). Under `pull_request_target` and fork-head pull requests,
      `auto` resolves to `untrusted-only`. An unrecognised value also resolves to `untrusted-only`,
      with a warning. Default: auto
    required: false
    default: auto
  sarif_upload:
    description: >-
      Upload catalog-analyzer findings to GitHub code scanning as SARIF 2.1.0:
      disabled (default) or enabled. Complementary evidence for when the review
      narrative is thin or findings overflow the inline comment budget — never a
      gate: an upload failure is logged and the run still completes. Requires
      `security-events: write` on the job, and code scanning to be available on
      the repository. Only findings from catalog analyzers that this run's trust
      tier, shell policy and `analyzers:` mode actually admitted are uploaded,
      after secret redaction. CI-sourced and agent-sourced findings are never
      uploaded. An unrecognised value resolves to disabled, with a warning. When
      unset, `.mergecraft/config.yaml`'s `analyzers.sarifUpload` decides
      (default false). See issue #39.
    required: false
    default: disabled
  allow_pr_target_comments:
    description: "Opt-in to comment-driven invocation under `pull_request_target`. Default: false (refused). When set to `true`, comments from authors in {OWNER, MEMBER, COLLABORATOR} dispatch the agent even under `pull_request_target`. Set this only on workflows whose `if:` already gates comment triggers to trusted authors; leave it off everywhere else. See issue #72 / D6."
    required: false
    default: "false"
  codex_sandbox:
    description: >-
      Request Codex platform-sandbox policy for this run. Set to danger-full-access
      to ask mergeCraft to skip Codex's nested bubblewrap/Landlock sandbox when
      the runner is already isolated (for example inside a Docker container action).
      This input is a request only: trust.agentSandbox in the consuming repo's
      .mergecraft/config.yaml decides whether it is granted. Fork heads always
      refuse regardless of tier. mergeCraft's own shell/push controls are unaffected.
      See issue #70 and docs/trust-policy.md.
    required: false
  provider_base_url:
    description: >-
      Custom OpenAI-compatible base URL for the singleton provider
      (`MERGECRAFT_CUSTOM_PROVIDER_BASE_URL`, PR #79 / D7). Use this to point
      Codex or OpenCode at a third-party OpenAI-compatible gateway without
      committing env-var names in workflow YAML. The indexed multi-provider
      form (`MERGECRAFT_CUSTOM_PROVIDER_{API_KEY,BASE_URL}_<N>` for `N >= 1`)
      is env-only and not exposed here — that path is for advanced
      multi-provider setups where `with:` cannot enumerate multiple entries.
      See issue #71.
    required: false
  provider_api_key_env:
    description: >-
      Name of an environment variable that holds the singleton provider's API
      key (e.g. `MY_PROVIDER_API_KEY`). mergeCraft reads this env var's value
      and exposes it to the harness as `MERGECRAFT_CUSTOM_PROVIDER_API_KEY`.
      Never inline the API key value here — reference the env-var *name*
      only (convention 7). Wire the secret via the workflow's `env:` block
      from a GitHub Actions secret named `MY_PROVIDER_API_KEY` (interpolated
      in your workflow YAML, not written literally here — a literal
      `secrets.*` expression inside this file's own description text fails
      action.yml validation, since `secrets` isn't a valid context for a
      composite action's metadata). See issue #71.
    required: false
  output_schema:
    description: "JSON Schema (draft-07) for structured output validation."
    required: false
  token:
    description: "GitHub-provided token with job-scoped permissions."
    required: false
    default: ${{ github.token }}
  suggest_eval_add:
    description: |
      Opt-in (W12.4 / #44): when enabled, log a logger.info suggestion to add
      the run to the eval bank when the run produced no positive
      findings, the trust tier is trusted, and the trigger is a re-review
      (not a fresh PR). Accepts disabled|enabled (also true/false aliases).
      Default: disabled; mergeCraft never auto-adds.
    required: false
    default: "disabled"
  tracing:
    description: |
      Tracing enablement (W8.5 / W7.7): true / false. Wins over the
      .mergecraft/config.yaml ``tracing.enabled`` block when set. Unset
      defers to the config (default off).
    required: false
    default: ""
  tracing-to:
    description: |
      Tracing shorthand (W8.5 / W7.7): ``local_files`` / ``logfire`` /
      ``otel``. Wins over the config block. ``logfire`` requires the
      optional ``[tracing]`` extra plus a `LOGFIRE_TOKEN` secret wired via
      `logfire-token` below; ``otel`` requires an ``otel-endpoint``.
    required: false
    default: ""
  logfire-token:
    description: |
      Direct logfire token (W8.5 / W7.7). Wire from a `LOGFIRE_TOKEN`
      GitHub Actions secret (interpolated in your workflow YAML, not written
      literally here) so the secret never appears in the workflow file.
      Held at runtime only; never inlined into config dumps.
    required: false
    default: ""
  otel-endpoint:
    description: |
      OTLP collector URL (W8.5 / W7.7): e.g.
      ``http://127.0.0.1:4318/v1/traces``. Wins over the config block.
    required: false
    default: ""
  tracing-content:
    description: |
      Model-payload capture level: off, metadata, redacted, or full.
      Wins over MERGECRAFT_TRACING_CONTENT and tracing.content when set.
      Untrusted runs still cap at metadata unless
      tracing-export-untrusted-content is also true. Unset defers to
      config (default redacted).
    required: false
    default: ""
  tracing-export-untrusted-content:
    description: |
      Allow prompt and completion bodies on untrusted (fork-PR) runs when
      the capture level emits bodies. Required to ship fork-PR content to
      Logfire. Wins over MERGECRAFT_TRACING_EXPORT_UNTRUSTED_CONTENT and
      tracing.exportUntrustedContent. Default false; content full alone
      does not lift the cap.
    required: false
    default: ""
  setup_failure_policy:
    description: >-
      S1 / D10 — what happens when a trusted-tier ``setupScript`` fails (non-zero
      exit) or times out. ``inconclusive`` (default) maps the run to
      ``RunOutcome.inconclusive`` (a ``neutral`` check conclusion) — the run is
      treated as no-verdict, never a passing review of an under-provisioned tree.
      ``fail`` aborts the run as ``RunOutcome.configuration_error`` (the consumer
      has declared the failure is unrecoverable). ``warn`` reproduces the legacy
      continue-on-failure behaviour; the prompt still carries the failure text so
      the reviewing agent knows its tree may be partially provisioned. Unknown
      values fail closed as ``configuration_error`` (this is a security/runtime
      surface — ``extra="forbid"`` semantics).
    required: false
    default: ""
  setup_timeout:
    description: >-
      S1 / F6 — maximum wall-clock duration for ``setupScript`` (e.g. ``5m``,
      ``30s``, ``1h``). A hanging install stalls the run otherwise. The setup
      runs as a session leader so its whole process tree is TERM→KILLed on
      timeout. Reusing ``resolve_timeout_ms`` — the same parser the ``timeout``
      input uses. Default ``10m`` applies even when ``timeout`` is unset or
      ``--notimeout``; setup never consumes the whole run budget.

      Note: ``setupTimeout`` must be strictly less than ``timeout`` (or the
      run aborts as ``configuration_error``). Equal / larger budgets would let
      the setup script eat the whole run deadline; the agent is then given
      ≈1 ms and a setup timeout surfaces as ``timed_out`` instead of the
      ``inconclusive`` / ``configuration_error`` the setup policy was supposed
      to produce. Lower ``setupTimeout`` or raise ``timeout`` to satisfy the
      guard — see ``docs/config-failure-policy.md`` for the runtime reason
      text.
    required: false
    default: ""

outputs:
  result:
    description: "Set when the prompt requests it; required when output_schema is provided."
  evidence_packet:
    description: |
      JSON body of this run's Merge Evidence Packet (#47) — the versioned,
      structured record of the findings, deterministic checks, blast-radius
      lane, self-assessment, and decision behind the review. Emitted via
      `$GITHUB_OUTPUT` as multiline JSON (not a filesystem path). Empty when
      the run had no pull request to attest to. To upload as an artifact,
      write the output to a file in a later step. Schema:
      `docs/evidence-packet.md`.
  verdict_diagnostic:
    description: |
      Closed VerdictDiagnostic code from the terminal-verdict policy path for
      this run. Empty when the run did not evaluate terminal protocol policy.

runs:
  using: "docker"
  # Slim image published by ci-cd.yml (SHA tag + digest retag). Pin by digest, never
  # :latest / :rc. Bump with scripts/check_action_image_digest.py after each
  # build-images push for the workflow Action SHA (#526).
  image: "docker://ghcr.io/alexhawat/mergecraft@sha256:e14a5e2d753db4785ecd7e44e758e016d7e23b3c790d5e753b62fe719a994cc5"
  entrypoint: "/entrypoint.sh"
  args:
    - "gha"
  env:
    INPUT_PROMPT: ${{ inputs.prompt }}
    INPUT_PROMPT_FILE: ${{ inputs.prompt_file }}
    INPUT_TIMEOUT: ${{ inputs.timeout }}
    INPUT_MODEL: ${{ inputs.model }}
    INPUT_MODEL_PIN: ${{ inputs.model_pin }}
    INPUT_CWD: ${{ inputs.cwd }}
    INPUT_PUSH: ${{ inputs.push }}
    INPUT_SHELL: ${{ inputs.shell }}
    INPUT_STATUS_CHECKS: ${{ inputs.status_checks }}
    INPUT_ANALYZERS: ${{ inputs.analyzers }}
    INPUT_SARIF_UPLOAD: ${{ inputs.sarif_upload }}
    INPUT_OUTPUT_SCHEMA: ${{ inputs.output_schema }}
    INPUT_ALLOW_PR_TARGET_COMMENTS: ${{ inputs.allow_pr_target_comments }}
    MERGECRAFT_CODEX_SANDBOX: ${{ inputs.codex_sandbox }}
    INPUT_PROVIDER_BASE_URL: ${{ inputs.provider_base_url }}
    INPUT_PROVIDER_API_KEY_ENV: ${{ inputs.provider_api_key_env }}
    INPUT_TOKEN: ${{ inputs.token }}
    INPUT_SUGGEST_EVAL_ADD: ${{ inputs.suggest_eval_add }}
    INPUT_TRACING: ${{ inputs.tracing }}
    INPUT_TRACING_TO: ${{ inputs.tracing-to }}
    INPUT_LOGFIRE_TOKEN: ${{ inputs.logfire-token }}
    INPUT_OTEL_ENDPOINT: ${{ inputs.otel-endpoint }}
    INPUT_TRACING_CONTENT: ${{ inputs.tracing-content }}
    INPUT_TRACING_EXPORT_UNTRUSTED_CONTENT: ${{ inputs.tracing-export-untrusted-content }}
    INPUT_SETUP_FAILURE_POLICY: ${{ inputs.setup_failure_policy }}
    INPUT_SETUP_TIMEOUT: ${{ inputs.setup_timeout }}

branding:
  icon: "code"
  color: "green"
